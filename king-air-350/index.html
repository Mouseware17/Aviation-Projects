  { fig: "2-46", t: "Battery ON, generator ties manually closed", cap: "GEN TIES MAN CLOSE latches both gen ties closed and the whole system runs on the battery. MAN TIES CLOSE is lit. It goes out once a generator comes on line.", apply(s) { s.bat = true; s.manLatch = true; } },
  { fig: "2-47", t: "Right engine start", cap: "The right starter relay is closed and the center bus drives the starter on battery power. The tie sensors are desensitized. Watch N1, light-off at about 12%, then set the start switch to OFF and GEN RESET → ON.", apply(s) { s.bat = true; s.start.R = "ON"; s.n1.R = 4; } },
  { fig: "2-48", t: "Right generator ON", cap: "The right line contactor is closed and both gen ties close automatically. The right generator powers every bus and recharges the battery. Only L DC GEN remains.", apply(s) { s.bat = true; runEng(s, "R"); s.deficit = 1500; } },
  { fig: "2-49", t: "Cross-generator start (left engine)", cap: "The battery and right generator both feed the left starter through the center bus. The right GCU caps its output at 400 A. Watch the right loadmeter and the battery ammeter share the start current.", apply(s) { s.bat = true; runEng(s, "R"); s.start.L = "ON"; s.n1.L = 4; } },
  { fig: "2-50", t: "Both generators ON", cap: "Normal configuration. Each generator feeds its own bus, the buses are tied through the center bus, and load is shared within 10%.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); } },
  { fig: "2-51", t: "Both generators ON, generator ties OPEN", cap: "The gen buses are separated from the center bus. Each generator feeds its own bus and the triple-fed bus, and the battery alone powers the center bus. Paralleling is inoperative.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); s.genTies = "OPEN"; } },
  { fig: "2-52", t: "Both generators ON, bus sense TEST", cap: "Test voltage simulates an overcurrent at all three sensors. All three ties open and latch. Press BUS SENSE RESET to close them.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); s.trip = { L: true, R: true, B: true }; } },
  { fig: "2-53", t: "Both generators failed (load shedding)", cap: "With no generator, the gen ties open and the gen bus loads are shed. The battery carries the center, triple-fed, battery and dual-fed buses, about 30 min at 50 A after load management. Do not MAN CLOSE.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); s.fail = { L: true, R: true }; s.excited = { L: false, R: false }; } },
  { fig: "2-54", t: "Bus isolation: left gen bus short", cap: "The left sensor sees >275 A flowing from the center bus into the short and opens the left gen tie, and the left GCU drops its generator. L DC GEN + L GEN TIE OPEN. The right generator carries everything else.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); s.short.LGB = true; } },
  { fig: "2-55", t: "Bus isolation: center bus short", cap: "The battery sensor opens the battery tie. Both 250 A limiters open because the gen sensors cannot see current flowing in that direction. Only BAT TIE OPEN is lit. The battery can't charge and the gear must be extended manually.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); s.short.CTR = true; } },
  { fig: "2-56", t: "Bus isolation: triple-fed bus short", cap: "All three 60 A limiters open and isolate the bus. There is no tie annunciation, and with annunciator power on this bus the panel goes dark. Diagnose from lost equipment and the voltmeter.", apply(s) { s.bat = true; runEng(s, "L"); runEng(s, "R"); s.short.TF = true; } },
  { fig: "2-57", t: "External power", cap: "EXT PWR ON closes the external power relay and both gen ties. Every bus, including the starters, is on external power. EXT PWR is lit steady.", apply(s) { s.bat = true; s.gpu = true; s.extSw = true; } }
];
function runEng(s, k) { s.lit[k] = true; s.n1[k] = 62; s.gen[k] = "ON"; s.excited[k] = true; }

/* ================= Electrical: simulation ================= */
function fresh() {
  return { bat: false, batBus: "NORMAL", gen: { L: "OFF", R: "OFF" }, genTies: "NORM", start: { L: "OFF", R: "OFF" }, extSw: false, gpu: false,
    n1: { L: 0, R: 0 }, lit: { L: false, R: false }, excited: { L: false, R: false }, fail: { L: false, R: false },
    short: { LGB: false, RGB: false, CTR: false, TF: false }, trip: { L: false, R: false, B: false }, manLatch: false,
    blown: { L250: false, R250: false, L60: false, R60: false, B60: false },
    deficit: 0, chgT: 0, strT: { L: 0, R: 0 }, strWarned: { L: false, R: false }, volt: "CTR", t: 0 };
}
let S = fresh();
let D = null;          // derived state from evaluate()
let M = { genA: { L: 0, R: 0 }, batA: 0, batV: 24.4, gpuA: 0 };   // meters
let timer = null;
let selected = null;
let scenIdx = 0;
let momentary = {};    // visual hold for spring-loaded positions

const NETS = ["LGEN", "RGEN", "LGB", "RGB", "LTA", "RTA", "CTR", "GPU", "BATN", "BATBUS", "DFB", "BRL", "B60", "TF", "L60", "R60", "TF20", "LSTR", "RSTR"];
const SHORTABLE = { LGB: "LGB", RGB: "RGB", CTR: "CTR", TF: "TF" };

function genOut(k) { return S.n1[k] >= 45 && (S.gen[k] === "ON" || S.gen[k] === "RESET") && S.excited[k] && !S.fail[k] && S.start[k] === "OFF"; }
function genOnline(k) { return genOut(k) && S.gen[k] === "ON"; }

function relays() {
  const r = {};
  r.rccb = S.batBus === "NORMAL";
  r.batCtl = r.rccb && S.bat;              // BAT switch control power is taken from the battery bus
  r.batRelay = r.batCtl;
  r.batTie = r.batCtl && !S.trip.B;
  r.ext = S.gpu && S.extSw;
  r.lineL = genOnline("L"); r.lineR = genOnline("R");
  r.tiesCmd = S.genTies !== "OPEN" && (r.lineL || r.lineR || r.ext || S.manLatch);
  r.tieL = r.tiesCmd && !S.trip.L; r.tieR = r.tiesCmd && !S.trip.R;
  r.strL = false; r.strR = false;
  return r;
}

function solve(r) {
  const E = [
    ["LGEN", "LGB", r.lineL, 0], ["LGB", "LTA", !S.blown.L250, 0], ["LTA", "CTR", r.tieL, 0],
    ["RGEN", "RGB", r.lineR, 0], ["RGB", "RTA", !S.blown.R250, 0], ["RTA", "CTR", r.tieR, 0],
    ["GPU", "CTR", r.ext, 1], ["CTR", "BATN", r.batTie, 0], ["BATN", "BATBUS", r.rccb, 0],
    ["BATBUS", "DFB", true, 1], ["BATN", "BRL", r.batRelay, 0], ["BRL", "B60", !S.blown.B60, 0], ["B60", "TF", true, 1],
    ["LGB", "L60", !S.blown.L60, 0], ["L60", "TF", true, 1], ["RGB", "R60", !S.blown.R60, 0], ["R60", "TF", true, 1],
    ["TF", "TF20", true, 0], ["TF20", "DFB", true, 1],
    ["CTR", "LSTR", r.strL, 1], ["CTR", "RSTR", r.strR, 1]
  ];
  const adj = {}; NETS.forEach(n => adj[n] = []);
  E.forEach(([a, b, on, dir]) => { if (!on) return; adj[a].push(b); if (!dir) adj[b].push(a); });
  const srcs = [["BAT", "BATN", 1]];
  if (genOut("L")) srcs.push(["LGEN", "LGEN", 2]);
  if (genOut("R")) srcs.push(["RGEN", "RGEN", 2]);
  if (S.gpu) srcs.push(["GPU", "GPU", 3]);
  const reach = {}, level = {}; NETS.forEach(n => level[n] = 0);
  srcs.forEach(([id, start, lv]) => {
    const seen = new Set([start]), q = [start];
    while (q.length) {
      const n = q.shift();
      if (SHORTABLE[n] && S.short[n]) continue;    // a grounded net passes nothing on
      adj[n].forEach(m => { if (!seen.has(m)) { seen.add(m); q.push(m); } });
    }
    reach[id] = { set: seen, lv };
    seen.forEach(n => { if (!(SHORTABLE[n] && S.short[n])) level[n] = Math.max(level[n], lv); });
  });
  return { reach, level };
}

let evLog = [];
function log(msg, cls) {
  evLog.unshift({ t: S.t, msg, cls: cls || "" });
  if (evLog.length > 40) evLog.pop();
  renderLog();
}

function evaluate(quiet) {
  const prev = D;
  let r, P;
  for (let i = 0; i < 6; i++) {
    r = relays(); P = solve(r);
    let ch = false;
    const desens = S.start.L !== "OFF" || S.start.R !== "OFF";
    ["L", "R"].forEach(k => {
      const net = k + "GB", n = SIDE[k].toLowerCase();
      if (S.short[net]) {
        if (S.excited[k]) { S.excited[k] = false; ch = true; if (!quiet) log(`${SIDE[k]} GCU takes its generator off line (short on ${n} gen bus).`, "bad"); }
        if (r["tie" + k] && !S.blown[k + "250"] && P.level.CTR > 0) {
          if (desens) { S.blown[k + "250"] = true; if (!quiet) log(`Start in progress, sensors desensitized: ${n} 250 A limiter opens.`, "bad"); }
          else { S.trip[k] = true; if (!quiet) log(`${SIDE[k]} Hall-effect sensor sees >275 A flowing toward the ${n} gen bus and opens the ${n} gen tie.`, "bad"); }
          ch = true;
        }
      }
      if (S.fail[k] && S.excited[k]) { S.excited[k] = false; ch = true; if (!quiet) log(`${SIDE[k]} generator fails, GCU opens the line contactor.`, "bad"); }
    });
    if (S.short.CTR) {
      if (r.batTie) { S.trip.B = true; ch = true; if (!quiet) log("Battery Hall-effect sensor sees >275 A flowing toward the center bus and opens the battery tie.", "bad"); }
      ["L", "R"].forEach(k => {
        if (r["tie" + k] && !S.blown[k + "250"] && P.level[k + "GB"] > 0) { S.blown[k + "250"] = true; ch = true; if (!quiet) log(`${SIDE[k]} 250 A limiter opens. The gen tie sensor can't see current flowing toward the center bus.`, "bad"); }
      });
    }
    if (S.short.TF) {
      if (!S.blown.L60 && P.level.LGB > 0) { S.blown.L60 = true; ch = true; if (!quiet) log("Left 60 A triple-fed limiter opens.", "bad"); }
      if (!S.blown.R60 && P.level.RGB > 0) { S.blown.R60 = true; ch = true; if (!quiet) log("Right 60 A triple-fed limiter opens.", "bad"); }
      if (!S.blown.B60 && r.batRelay) { S.blown.B60 = true; ch = true; if (!quiet) log("Battery 60 A triple-fed limiter opens. Triple-fed bus isolated.", "bad"); }
    }
    if (S.manLatch && (r.lineL || r.lineR)) { S.manLatch = false; ch = true; if (!quiet) log("Generator on line: GCU now holds the gen ties, MAN TIES CLOSE goes out."); }
    if (S.manLatch && (S.genTies === "OPEN" || P.level.CTR === 0)) { S.manLatch = false; ch = true; }
    if (!ch) break;
  }
  const tfLive = P.level.TF > 0;
  r.strL = S.start.L !== "OFF" && tfLive && P.level.CTR > 0;
  r.strR = S.start.R !== "OFF" && tfLive && P.level.CTR > 0;
  P = solve(r);
  D = { r, P };

  if (prev && !quiet) {
    const pr = prev.r;
    const msg = (key, on, off, cls) => { if (pr[key] !== r[key]) log(r[key] ? on : off, r[key] ? "" : (cls || "")); };
    msg("batRelay", "Battery relay closes. Battery feeds the triple-fed bus.", "Battery relay opens.");
    msg("batTie", "Battery bus tie closes. Battery connected to the center bus and starter relays.", "Battery bus tie opens.", "warn");
    msg("rccb", "RCCB closes. Battery bus and dual-fed bus powered.", "RCCB opens. Battery bus de-powered.", "warn");
    msg("lineL", "Left line contactor closes. Left generator on line.", "Left line contactor opens. Left generator off line.", "warn");
    msg("lineR", "Right line contactor closes. Right generator on line.", "Right line contactor opens. Right generator off line.", "warn");
    msg("tieL", "Left gen tie closes.", "Left gen tie opens.", "warn");
    msg("tieR", "Right gen tie closes.", "Right gen tie opens.", "warn");
    msg("ext", "External power relay closes. External power on line.", "External power relay opens.");
    msg("strL", "Left starter relay closes. Starter motoring.", "Left starter relay opens.");
    msg("strR", "Right starter relay closes. Starter motoring.", "Right starter relay opens.");
    if (pr.tiesCmd && !r.tiesCmd && (pr.lineL || pr.lineR) && !r.lineL && !r.lineR && S.genTies !== "OPEN")
      log("No generator on line: the gen ties open and the gen bus loads are shed.", "warn");
  }
  render();
}

/* ---------- loads, battery and engines (time step) ---------- */
const LOADS = { LGB: 45, RGB: 55, CTR: 20, TF: 25, BATBUS: 2, DFB: 3 };
const USABLE_AS = 97200;   // 36 Ah × 75% in amp-seconds

function suppliers(net) {
  const lv = D.P.level[net]; if (!lv) return [];
  return Object.keys(D.P.reach).filter(id => D.P.reach[id].lv === lv && D.P.reach[id].set.has(net));
}

function step(dt) {
  S.t += dt;
  let needEval = false;
  ["L", "R"].forEach(k => {
    const turning = D.r["str" + k];
    if (turning) { S.strT[k] += dt; if (S.strT[k] > 30 && !S.strWarned[k]) { S.strWarned[k] = true; log(`${SIDE[k]} starter has run 30 s. Limit is 30 s ON, then 5 min OFF.`, "warn"); } }
    else { S.strT[k] = 0; S.strWarned[k] = false; }
    const before = S.n1[k];
    if (S.lit[k]) S.n1[k] = Math.min(62, S.n1[k] + (turning ? 7 : 5) * dt);
    else if (turning) {
      S.n1[k] = Math.min(20, S.n1[k] + 3.2 * dt);
      if (S.start[k] === "ON" && S.n1[k] >= 12) { S.lit[k] = true; log(`${SIDE[k]} engine light-off at ${S.n1[k].toFixed(0)}% N1.`); }
    } else S.n1[k] = Math.max(0, S.n1[k] - 6 * dt);
    if (before < 62 && S.n1[k] >= 62 && S.lit[k] && S.start[k] !== "OFF") log(`${SIDE[k]} engine stabilized at idle. Set its start switch to OFF, then GEN RESET → ON.`);
    if (S.n1[k] < 45 && S.excited[k]) { S.excited[k] = false; }
    if ((before >= 45) !== (S.n1[k] >= 45)) needEval = true;
  });
  if (needEval) evaluate();
  else evaluate(true);

  // distribute loads
  const genA = { L: 0, R: 0 }; let batDis = 0, gpuA = 0;
  const add = (net, amps) => {
    if (S.short[net] || !D.P.level[net]) return;
    const sup = suppliers(net); if (!sup.length) return;
    const share = amps / sup.length;
    sup.forEach(id => { if (id === "BAT") batDis += share; else if (id === "GPU") gpuA += share; else genA[id.charAt(0)] += share; });
  };
  Object.keys(LOADS).forEach(n => add(n, LOADS[n]));
  ["L", "R"].forEach(k => { if (D.r["str" + k] && D.P.level[k + "STR"]) add(k + "STR", S.n1[k] < 12 ? 380 : 260); });
  // cross-generator start: operating GCU limits to 400 A, the battery supplies the rest
  ["L", "R"].forEach(k => {
    const o = k === "L" ? "R" : "L";
    if (S.start[o] !== "OFF" && genA[k] > 400) { batDis += (D.r.batTie ? genA[k] - 400 : 0); genA[k] = 400; }
  });
  let batA;
  const bl = D.P.level.BATN;
  if (bl >= 2) {
    const I = Math.min(110, 2 + S.deficit * 0.06);
    const sup = suppliers("BATN");
    sup.forEach(id => { if (id === "GPU") gpuA += I / sup.length; else if (id !== "BAT") genA[id.charAt(0)] += I / sup.length; });
    S.deficit = Math.max(0, S.deficit - I * dt * 1.6);
    batA = batDis > 0 ? I - batDis : I;
  } else {
    batA = -batDis;
    S.deficit = Math.min(USABLE_AS * 1.2, S.deficit + batDis * dt);
  }
  if (batA > 7) S.chgT += dt; else S.chgT = 0;
  const restV = 24.6 - 2.2 * Math.min(1, S.deficit / USABLE_AS);
  M = { genA, batA, gpuA, batDis, batV: bl >= 2 ? (bl === 3 ? 28.0 : 28.25) : Math.max(17.5, restV - 0.012 * batDis) };
  renderMeters();
}

/* ================= SVG schematic ================= */
const VB_W = 1040;
function buildSchematic() {
  const casings = [], wires = [], ctl = [], syms = [];
  const pts = a => a.map(p => p.join(",")).join(" ");
  const W = (net, a) => { casings.push(`<polyline class="w-case" data-netc="${net}" points="${pts(a)}"/>`); wires.push(`<polyline class="w" data-net="${net}" points="${pts(a)}"/>`); };
  const C = (key, a, dash) => ctl.push(`<polyline class="c${dash ? " dash" : ""}" data-ctl="${key}" points="${pts(a)}"/>`);
  const T = (x, y, s, cls, anchor) => `<text x="${x}" y="${y}" class="${cls || "lbl"}" text-anchor="${anchor || "middle"}">${s}</text>`;
  const comp = (id, inner, hit, label) => syms.push(`<g class="comp" data-comp="${id}" tabindex="0" role="button" aria-label="${esc(label || COMPS[id].name)}"><rect class="hit" x="${hit[0]}" y="${hit[1]}" width="${hit[2]}" height="${hit[3]}" rx="4"/>${inner}</g>`);
  const contacts = (key, x, y, ang) => `<g transform="translate(${x},${y}) rotate(${ang || 0})"><circle class="term" cx="-15" cy="0" r="3"/><circle class="term" cx="15" cy="0" r="3"/><line class="blade" data-sw="${key}" x1="-15" y1="0" x2="15" y2="0"/></g>`;
  const limiter = (key, x, y, ang) => `<g transform="translate(${x},${y}) rotate(${ang || 0})"><path class="lim" data-lim="${key}" d="M-14,-8 L0,0 L-14,8 Z M14,-8 L0,0 L14,8 Z"/></g>`;
  const diode = (x, y, ang) => `<g transform="translate(${x},${y}) rotate(${ang || 0})"><path class="sym-solid" d="M-8,-8 L7,0 L-8,8 Z"/><line class="sym-l" x1="8" y1="-9" x2="8" y2="9"/></g>`;
  const coil = (key, x, y, w, h) => `<rect class="coil" data-coil="${key}" x="${x}" y="${y}" width="${w || 20}" height="${h || 16}" rx="2"/>`;
  const ground = (x, y) => `<g transform="translate(${x},${y})"><line class="sym-l" x1="0" y1="0" x2="0" y2="8"/><line class="sym-l" x1="-10" y1="8" x2="10" y2="8"/><line class="sym-l" x1="-6" y1="13" x2="6" y2="13"/><line class="sym-l" x1="-2" y1="18" x2="2" y2="18"/></g>`;
  const bolt = (key, x, y) => `<g data-short="${key}" transform="translate(${x},${y})" hidden><path class="bolt" d="M0,0 L18,-26 L10,-8 L26,-14 L4,22 L12,2 Z"/>${ground(6, 22)}</g>`;
  const bus = (id, net, x, y, w, label) => comp(id, `<rect class="bus-fill" data-net="${net}" x="${x}" y="${y}" width="${w}" height="32" rx="16"/><text class="bus-txt" data-bustxt="${net}" x="${x + w / 2}" y="${y + 21}" text-anchor="middle">${label}</text>`, [x - 4, y - 4, w + 8, 40]);

  // ---------- per side ----------
  ["L", "R"].forEach(k => {
    const X = x => k === "L" ? x : VB_W - x;
    const A = a => k === "L" ? a : ({ start: "end", end: "start", middle: "middle" }[a]);
    const P = (x, y) => [X(x), y];
    const n = SIDE[k].toUpperCase();
    // generator output → loadmeter → line contactor → gen bus
    W(k + "GEN", [P(160, 139), P(160, 180), P(211, 180)]);
    W(k + "GB", [P(241, 180), P(290, 180), P(290, 240), P(100, 240), P(100, 274)]);
    // starter relay tap from center bus line
    W("CTR", [P(370, 290), P(370, 40), P(340, 40)]);
    W(k + "STR", [P(310, 40), P(190, 40), P(190, 76)]);
    // top bus row
    W(k + "GB", [P(170, 290), P(213, 290)]);
    W(k + "TA", [P(241, 290), P(300, 290)]);
    W("CTR", [P(330, 290), P(460, 290)]);
    // gen bus → 60 A → diode → triple-fed
    const d = t => P(70 + 350 * t, 306 + 494 * t);
    W(k + "GB", [P(70, 306), d(0.17)]);
    W(k + "60", [d(0.23), d(0.885)]);
    W("TF", [d(0.915), P(420, 800)]);
    const ang = Math.atan2(494, 350 * (k === "L" ? 1 : -1)) * 180 / Math.PI;

    // control wiring (GCU)
    C("field" + k, [P(86, 196), P(86, 168)]);
    C("field" + k, [P(86, 142), P(86, 105), P(126, 105)]);
    C("lc" + k, [P(132, 212), P(226, 212), P(226, 204)]);
    C("hed" + k, [P(325, 314), P(411, 314), P(411, 306)], true);

    // generator
    comp("gen" + k,
      `<circle class="sym" cx="${X(160)}" cy="105" r="34"/><circle class="sym" cx="${X(160)}" cy="105" r="21"/>
       <g class="rotor" data-rotor="${k}"><line class="sym-l" x1="${X(160)}" y1="88" x2="${X(160)}" y2="122"/><line class="sym-l" x1="${X(143)}" y1="105" x2="${X(177)}" y2="105"/></g>
       ${T(X(205), 104, "STARTER/GEN", "lbl", A("start"))}`,
      [X(160) - 40, 64, 80, 104]);
    syms.push(`<text class="n1t" data-n1="${k}" x="${X(108)}" y="64" text-anchor="${A("end")}">N1 0%</text>`);
    syms.push(T(X(80), 120, "TO GEN", "lbl", A("end")), T(X(80), 133, "FIELD", "lbl", A("end")));
    // gen switch in field line
    syms.push(`<g>${T(X(98), 160, "GEN SW", "lbl", A("start"))}${contacts("genSw" + k, X(86), 155, 90)}</g>`);
    comp("load" + k, `<circle class="sym" cx="${X(196)}" cy="180" r="11"/><line class="sym-l" x1="${X(190)}" y1="186" x2="${X(202)}" y2="173"/>${T(X(190), 164, "LOAD", "lbl")}`, [X(196) - 16, 152, 32, 42]);
    comp("line" + k, contacts("line" + k, X(226), 180) + coil("line" + k, X(226) - 10, 192) + T(X(234), 164, "LINE CONT", "lbl", A("start")), [X(226) - 22, 152, 44, 60]);
    comp("gcu" + k, `<rect class="gcu" data-gcu="${k}" x="${X(k === "L" ? 40 : 132)}" y="196" width="92" height="32" rx="3"/><text class="gcu-t" data-gcut="${k}" x="${X(86)}" y="216" text-anchor="middle">GEN CONTROL</text>`, [X(k === "L" ? 40 : 132) - 3, 193, 98, 38]);

const SWITCHES = [
  { group: "Master switch", items: [
    { id: "bat", name: "BAT", pos: [["ON", "ON"], ["OFF", "OFF"]] },
    { id: "genL", name: "L GEN", pos: [["RESET", "RESET", 1], ["ON", "ON"], ["OFF", "OFF"]] },
    { id: "genR", name: "R GEN", pos: [["RESET", "RESET", 1], ["ON", "ON"], ["OFF", "OFF"]] }
  ]},
  { group: "Battery bus", items: [{ id: "batBus", name: "BAT BUS", pos: [["NORMAL", "NORMAL"], ["EMER", "EMER OFF"]] }] },
  { group: "Bus ties", items: [
    { id: "genTies", name: "GEN TIES", ring: 1, pos: [["MAN", "MAN CLOSE", 1], ["NORM", "NORM"], ["OPEN", "OPEN"]] },
    { id: "busSense", name: "BUS SENSE", ring: 1, pos: [["RESET", "RESET", 1], ["NORM", "NORM"], ["TEST", "TEST", 1]] }
  ]},
  { group: "Ignition & engine start", items: [
    { id: "startL", name: "LEFT", ring: 1, pos: [["ON", "ON"], ["OFF", "OFF"], ["STARTER", "STARTER ONLY"]] },
    { id: "startR", name: "RIGHT", ring: 1, pos: [["ON", "ON"], ["OFF", "OFF"], ["STARTER", "STARTER ONLY"]] }
  ]},
  { group: "External power", items: [{ id: "ext", name: "EXT PWR", pos: [["ON", "ON"], ["OFF", "OFF"]] }] }
];

function swValue(id) {
  if (momentary[id]) return momentary[id];
  switch (id) {
    case "bat": return S.bat ? "ON" : "OFF";
    case "genL": return S.gen.L; case "genR": return S.gen.R;
    case "batBus": return S.batBus;
    case "genTies": return S.genTies;
    case "busSense": return "NORM";
    case "startL": return S.start.L; case "startR": return S.start.R;
    case "ext": return S.extSw ? "ON" : "OFF";
  }
}

function hold(id, val, ms) {
  momentary[id] = val; renderSwitches();
  setTimeout(() => { delete momentary[id]; renderSwitches(); }, ms || 900);
}

function setSwitch(id, val) {
  switch (id) {
    case "bat": S.bat = val === "ON"; break;
    case "genL": case "genR": {
      const k = id.slice(-1);
      if (val === "RESET") {
        if (S.n1[k] < 45) log(`${SIDE[k]} GEN RESET: engine not running, so there is nothing to excite.`, "warn");
        else if (S.start[k] !== "OFF") log(`${SIDE[k]} GEN RESET: the field is disabled while the start switch is selected.`, "warn");
        else if (S.fail[k]) log(`${SIDE[k]} GEN RESET: the generator won't come on line (failed). Turn it OFF and rely on the other generator.`, "bad");
        else if (S.short[k + "GB"]) log(`${SIDE[k]} GEN RESET: the GCU trips again because the ${SIDE[k].toLowerCase()} gen bus is still shorted.`, "bad");
        else { S.excited[k] = true; log(`${SIDE[k]} GEN RESET: GCU builds generator voltage. Release to ON to close the line contactor.`); }
        S.gen[k] = "RESET"; evaluate();
        hold(id, "RESET", 900);
        setTimeout(() => { if (S.gen[k] === "RESET") { S.gen[k] = "ON"; evaluate(); } }, 900);
        return;
      }
      S.gen[k] = val; if (val === "OFF") S.excited[k] = false;
      break;
    }
    case "batBus": S.batBus = val; break;
    case "genTies":
      if (val === "MAN") {
        hold(id, "MAN", 700);
        if (S.genTies === "OPEN") { log("GEN TIES: the switch is lever-locked in OPEN. Move it to NORM first.", "warn"); return; }
        if (!D.P.level.CTR) { log("GEN TIES MAN CLOSE: no bus voltage to close the ties.", "warn"); return; }
        if (S.trip.L || S.trip.R) log("A gen tie opened by a fault can't be manually closed. Use BUS SENSE RESET first.", "warn");
        S.manLatch = true;
        if (!D.r.lineL && !D.r.lineR && (S.fail.L || S.fail.R)) log("Warning: MAN CLOSE reconnects both gen bus loads and severely limits battery duration.", "bad");
        else log("GEN TIES MAN CLOSE: gen ties latched closed, MAN TIES CLOSE on.");
        S.genTies = "NORM";
        break;
      }
      S.genTies = val;
      if (val === "OPEN") log("GEN TIES OPEN: both gen ties open.");
      break;
    case "busSense":
      if (val === "TEST") {
        hold(id, "TEST", 700);
        if (!D.P.level.TF && !D.P.level.CTR) { log("BUS SENSE TEST: no bus voltage.", "warn"); return; }
        S.trip = { L: true, R: true, B: true };
        log("BUS SENSE TEST: all three sensors simulate overcurrent, so every tie opens and latches.");
      } else if (val === "RESET") {
        hold(id, "RESET", 700);
        S.trip = { L: false, R: false, B: false };
        log("BUS SENSE RESET: tie latches cleared.");
        if (S.short.LGB || S.short.RGB || S.short.CTR) log("The fault is still present and will trip the tie again. Hold RESET only momentarily.", "warn");
      }
      break;
    case "startL": case "startR": {
      const k = id.slice(-1); S.start[k] = val;
      if (val === "OFF" && !S.lit[k] && S.n1[k] > 0) log(`${SIDE[k]} start switch OFF before light-off.`, "warn");
      break;
    }
    case "ext":
      S.extSw = val === "ON";
      if (S.extSw && !S.gpu) log("EXT PWR ON: no ground power unit connected.", "warn");
      break;
  }
  evaluate();
}

function renderSwitches() {
  const host = $("#switches"); if (!host) return;
  if (!host.dataset.built) {
    host.innerHTML = SWITCHES.map(g => `<div class="sw-group"><div class="gname">${g.group}</div><div class="sws">${g.items.map(s =>
      `<div class="tog${s.ring ? " ring" : ""}"><div class="name">${s.name}</div><div class="pos" role="group" aria-label="${s.name} switch">${s.pos.map(p =>
        `<button type="button" id="sw-${s.id}-${p[0]}" data-sw="${s.id}" data-val="${p[0]}" class="${p[2] ? "mom" : ""}" aria-pressed="false">${p[1]}</button>`).join("")}</div></div>`).join("")}</div></div>`).join("");
    host.dataset.built = "1";
    host.addEventListener("click", e => { const b = e.target.closest("button[data-sw]"); if (b) setSwitch(b.dataset.sw, b.dataset.val); });
  }
  $$("button[data-sw]", host).forEach(b => b.setAttribute("aria-pressed", String(swValue(b.dataset.sw) === b.dataset.val)));

function renderEngines() {
  const host = $("#engines"); if (!host) return;
  if (!host.dataset.built) {
    host.innerHTML = ["L", "R"].map(k => `<div class="eng"><div class="hd"><span>${SIDE[k]} engine</span><span class="n1v mono" id="n1v${k}">0%</span></div>

    if (D.r["str" + k]) h = S.start[k] === "STARTER" ? "Motoring on the starter only (no ignition)." : (S.lit[k] ? "Light-off. Accelerating to idle." : "Starter engaged. Light-off near 12% N1.");
    else if (S.start[k] !== "OFF" && !S.lit[k]) h = "Start switch selected, but the starter relay needs the triple-fed (control) and center (power) buses.";
    else if (S.lit[k] && S.start[k] !== "OFF") h = "Running. Set the start switch to OFF.";
    else if (S.lit[k] && !D.r["line" + k]) h = S.fail[k] ? "Running. Generator failed." : "Running. Generator off line: GEN RESET, then ON.";
    else if (S.lit[k]) h = "Running. Generator on line.";
    else if (S.n1[k] > 0) h = "Spooling down.";
    else h = "Shut down.";
    $("#hint" + k).textContent = h;
    $("#cut" + k).disabled = !S.lit[k];
  });
}

const GAUGES = [
  { id: "gL", label: "L Load", min: 0, max: 120, ticks: [0, 50, 100], unit: "%", red: 100 },

];
const VSEL = [["EXT", "Ext pwr"], ["BAT", "Batt"], ["LGB", "L gen"], ["CTR", "Ctr"], ["RGB", "R gen"], ["TF", "Tpl fed"]];
function gaugeSVG(g) {
  const ang = v => -120 + 240 * (Math.max(g.min, Math.min(g.max, v)) - g.min) / (g.max - g.min);
  const pt = (a, r) => [60 + r * Math.sin(a * Math.PI / 180), 60 - r * Math.cos(a * Math.PI / 180)];
  let s = `<svg viewBox="0 0 120 104" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="#1a1d21" stroke="#596169" stroke-width="2"/>`;
  for (let v = g.min; v <= g.max; v += (g.max - g.min) / 12) { const a = ang(v), p1 = pt(a, 47), p2 = pt(a, 41); s += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#d9dee3" stroke-width="1.2"/>`; }
  if (g.amber) { const p1 = pt(ang(g.amber[0]), 47), p2 = pt(ang(g.amber[1]), 47); s += `<path d="M${p1[0]},${p1[1]} A47,47 0 0 1 ${p2[0]},${p2[1]}" fill="none" stroke="#f2b81c" stroke-width="4"/>`; }
  if (g.red !== undefined) { const a1 = ang(g.red), a2 = ang(g.max), p1 = pt(a1, 47), p2 = pt(a2, 47); s += `<path d="M${p1[0]},${p1[1]} A47,47 0 0 1 ${p2[0]},${p2[1]}" fill="none" stroke="#e5483a" stroke-width="3"/>`; }
  g.ticks.forEach(v => { const p = pt(ang(v), 31); s += `<text x="${p[0]}" y="${p[1] + 3}" font-size="9" text-anchor="middle">${v}</text>`; });
  s += `<line id="${g.id}N" x1="60" y1="60" x2="60" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" style="transition:transform .3s;transform-origin:60px 60px"/><circle cx="60" cy="60" r="5" fill="#d9dee3"/></svg>`;
  return s;
}
function renderMeters() {
  const host = $("#gauges"); if (!host) return;
  if (!host.dataset.built) {
    host.innerHTML = GAUGES.map(g => `<div class="gauge">${gaugeSVG(g)}<div class="gl">${g.label}</div><div class="gv" id="${g.id}V">—</div>${g.id === "gV" ? `<div class="vsel" role="group" aria-label="Voltmeter bus select">${VSEL.map(v => `<button type="button" id="vs-${v[0]}" data-vs="${v[0]}" aria-pressed="false">${v[1]}</button>`).join("")}</div>` : ""}</div>`).join("");
    host.dataset.built = "1";
    host.addEventListener("click", e => { const b = e.target.closest("[data-vs]"); if (b) { S.volt = b.dataset.vs; renderMeters(); } });
  }
  const set = (g, v, txt, over) => {
    const G = GAUGES.find(x => x.id === g);
    const a = -120 + 240 * (Math.max(G.min, Math.min(G.max, v)) - G.min) / (G.max - G.min);
    $("#" + g + "N").style.transform = `rotate(${a}deg)`;
    const el = $("#" + g + "V"); el.textContent = txt; el.classList.toggle("over", !!over);
  };
  const pctL = M.genA.L / 3, pctR = M.genA.R / 3;
  set("gL", pctL, `${pctL.toFixed(0)}%  ${M.genA.L.toFixed(0)} A`, pctL > 100);
  set("gR", pctR, `${pctR.toFixed(0)}%  ${M.genA.R.toFixed(0)} A`, pctR > 100);
  const lvV = n => { const lv = D.P.level[n]; if (!lv || (SHORTABLE[n] && S.short[n])) return 0; return lv === 3 ? 28.0 : lv === 2 ? 28.25 : M.batV; };
  const v = S.volt === "EXT" ? (S.gpu ? 28.0 : 0) : S.volt === "BAT" ? M.batV : lvV(S.volt);
  set("gV", v, v.toFixed(2) + " V", v > 31);
  set("gA", M.batA, (M.batA >= 0 ? "+" : "") + M.batA.toFixed(0) + " A", false);
  $$("[data-vs]", host).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.vs === S.volt)));
  const soc = Math.max(0, 100 - 100 * S.deficit / USABLE_AS);
  let e = `Battery usable charge ≈ ${soc.toFixed(0)}%.`;
  if (M.batA < -1) { const min = Math.max(0, (USABLE_AS - S.deficit) / -M.batA / 60); e += ` At ${(-M.batA).toFixed(0)} A discharge: about ${min < 1 ? "<1" : min.toFixed(0)} min remaining.`; }
  else if (M.batA > 0.5) e += " Charging.";
  $("#endur").textContent = e;
  renderAnns(); renderEngines();
}

const ANNS = [["LDC", "L DC GEN"], ["LTIE", "L GEN TIE OPEN"], ["RTIE", "R GEN TIE OPEN"], ["RDC", "R DC GEN"], ["BTIE", "BAT TIE OPEN"], ["MAN", "MAN TIES CLOSE"], ["EXT", "EXT PWR"], ["BCHG", "BATTERY CHARGE"]];
function renderAnns() {

function renderLog() {

function stateLine(id) {
  const lv = n => ["unpowered", "battery power", "generator power", "external power"][D.P.level[n] || 0];
  const cl = b => b ? "CLOSED" : "OPEN";
  const v = {
    battery: () => `Terminal ${M.batV.toFixed(1)} V · ${M.batA >= 0 ? "charging +" : "discharging "}${Math.abs(M.batA).toFixed(0)} A`,
    batRelay: () => `Relay ${cl(D.r.batRelay)}`, batTie: () => `Tie ${cl(D.r.batTie)}${S.trip.B ? " · latched open by sensor" : ""}`,
    hedB: () => S.trip.B ? "TRIPPED (latched)" : "Normal", rccb: () => `RCCB ${cl(D.r.rccb)} · battery bus ${lv("BATBUS")}`,
    batBusSw: () => S.batBus === "NORMAL" ? "NORMAL" : "EMERGENCY OFF", batSw: () => `BAT ${S.bat ? "ON" : "OFF"}${S.bat && !D.r.rccb ? " · no control power" : ""}`,
    ammeter: () => `${M.batA >= 0 ? "+" : ""}${M.batA.toFixed(0)} A`, gpu: () => `GPU ${S.gpu ? "connected" : "not connected"} · relay ${cl(D.r.ext)}`,
    ctr: () => (S.short.CTR ? "SHORTED · " : "") + lv("CTR"), tf: () => (S.short.TF ? "SHORTED · " : "") + lv("TF"),
    batbus: () => lv("BATBUS"), dfb: () => lv("DFB"), cb20: () => "Closed", diodeBB: () => "Passive",
    lim60B: () => S.blown.B60 ? "OPEN (blown)" : "Intact"
  };
  ["L", "R"].forEach(k => {
    v["gen" + k] = () => `N1 ${S.n1[k].toFixed(0)}% · ${D.r["str" + k] ? "motoring as starter" : genOut(k) ? "generating 28.25 V" : S.fail[k] ? "FAILED" : "not generating"}`;
    v["gcu" + k] = () => S.excited[k] ? (D.r["line" + k] ? "Regulating · generator on line" : "Field excited") : "Generator off line";
    v["line" + k] = () => `Contactor ${cl(D.r["line" + k])}`; v["str" + k] = () => `Relay ${cl(D.r["str" + k])} · start switch ${S.start[k]}`;
    v["load" + k] = () => `${(M.genA[k] / 3).toFixed(0)}% (${M.genA[k].toFixed(0)} A)`;
    v["tie" + k] = () => `Tie ${cl(D.r["tie" + k])}${S.trip[k] ? " · latched open by sensor" : ""}`;
    v["hed" + k] = () => S.trip[k] ? "TRIPPED (latched)" : (S.start.L !== "OFF" || S.start.R !== "OFF" ? "Desensitized (start)" : "Armed");
    v["lim250" + k] = () => S.blown[k + "250"] ? "OPEN (blown)" : "Intact";
    v["lim60" + k] = () => S.blown[k + "60"] ? "OPEN (blown)" : "Intact";
    v[k.toLowerCase() + "gb"] = () => (S.short[k + "GB"] ? "SHORTED · " : "") + lv(k + "GB");
  });
  return v[id] ? v[id]() : "";
}

function renderInfo() {

const FAULTS = [["failL", "Fail L generator"], ["failR", "Fail R generator"], ["LGB", "Short L gen bus"], ["RGB", "Short R gen bus"], ["CTR", "Short center bus"], ["TF", "Short triple-fed bus"]];
function faultOn(f) { return f === "failL" ? S.fail.L : f === "failR" ? S.fail.R : S.short[f]; }
function buildFaults() {
  const host = $("#faults");
  host.innerHTML = FAULTS.map(f => `<button type="button" class="pbtn" id="fault-${f[0]}" data-fault="${f[0]}" aria-pressed="false">${f[1]}</button>`).join("") + `<button type="button" class="pbtn" id="repair">Repair faults &amp; replace limiters</button>`;
  host.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "repair") {
      S.fail = { L: false, R: false }; S.short = { LGB: false, RGB: false, CTR: false, TF: false };
      S.blown = { L250: false, R250: false, L60: false, R60: false, B60: false };
      log("Maintenance: faults cleared and limiters replaced. Ties latched open stay open until BUS SENSE RESET; generators need GEN RESET.");
    } else {
      const f = b.dataset.fault;
      if (f === "failL" || f === "failR") { const k = f.slice(-1); S.fail[k] = !S.fail[k]; if (!S.fail[k]) log(`${SIDE[k]} generator repaired. Use GEN RESET → ON.`); }
      else { S.short[f] = !S.short[f]; log(S.short[f] ? `Fault injected: ${b.textContent.toLowerCase()}.` : `Short removed from ${f}. Blown limiters stay open until replaced.`, S.short[f] ? "bad" : ""); }
    }

}

function applyScenario(i) {
  scenIdx = Math.max(0, Math.min(SCEN.length - 1, i));
  const sc = SCEN[scenIdx];
  S = fresh(); sc.apply(S);
  D = null; evLog = [];
  evaluate(true);
  if (S.fail.L || S.fail.R) { /* load-shed scenarios start part-discharged */ S.deficit = 8000; }
  log(`Loaded Figure ${sc.fig}: ${sc.t}.`);
  $("#scenSel").value = String(scenIdx);
  $("#scenCap").innerHTML = `<b>Fig ${sc.fig}</b>${esc(sc.cap)}`;
  M = { genA: { L: 0, R: 0 }, batA: 0, batV: 24.4, gpuA: 0 };
  step(0.01);
}

  }).join("")).join("");

  $("#steps").addEventListener("click", e => { const b = e.target.closest("[data-sc]"); if (b) { applyScenario(+b.dataset.sc); $("#sim").scrollIntoView({ behavior: "smooth", block: "start" }); } });
  // equipment lists
  $("#eqcols").innerHTML = ["lgb", "ctr", "rgb", "tf", "batbus", "dfb"].map(b => `<div><h5>${EQUIP[b].name}</h5>${EQUIP[b].groups.filter(g => g[1].length).map(g => `<div style="margin-bottom:6px"><i>${esc(g[0])}</i><ul>${g[1].map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>`).join("");

  renderInfo();

  select("ctr");
  stopSim();
  timer = setInterval(() => step(0.2), 200);
}

  $("#mwClear").addEventListener("click", () => { MW.lit.clear(); renderMW(); });
  const order = ["w", "c", "a", "s"];

    `<tr><td><span class="chip ${TYPE_CHIP[ANN[n].t]}">${esc(n)}</span></td><td>${TYPE_NAME[ANN[n].t]}</td><td>${esc(ANN[n].cause)}</td></tr>`).join("");

}

function renderMW() {

/* ================= Chapter 5: Fuel ================= */
const CAP = { wing: 911, nac: 362, aux: 533 };   // lb per side (136 / 54 / 79.5 gal at 6.7 lb/gal)
const BURN = 370, JET = 650, GRAV = 1200, XFILL = 300;   // lb/hr

function fFresh() {
  return { q: { L: { wing: CAP.wing, nac: CAP.nac, aux: CAP.aux }, R: { wing: CAP.wing, nac: CAP.nac, aux: CAP.aux } },
    eng: { L: true, R: true }, ign: { L: false, R: false }, stby: { L: "OFF", R: "OFF" }, aux: { L: "AUTO", R: "AUTO" }, xf: "OFF", qsel: "MAIN",
    fw: { L: "OPEN", R: "OPEN" }, fwT: { L: 0, R: 0 },
    fault: { edp: { L: false, R: false }, stbyp: { L: false, R: false }, mfv: { L: false, R: false }, tm: { L: false, R: false } },
    tm: { nfx: { L: 0, R: 0 }, fq: { L: 0, R: 0 }, empty: { L: 0, R: 0 }, test: 0 }, lit: { nfx: { L: false, R: false }, fq: { L: false, R: false } },
    overboard: 0, t: 0, speed: 60 };
}
let F = fFresh(), FD = null, fTimer = null, fSel = null, fScen = 0, fLogArr = [], fSpeed = 60;
const OTHER = { L: "R", R: "L" };

function fDerive() {
  const d = { fwOpen: {}, stbyOn: {}, pumping: {}, edp: {}, src: {}, supply: {}, press: {}, fed: {}, mfOpen: {}, motive: {}, transfer: {}, autoCmd: {} };
  d.xfOpen = F.xf !== "OFF";
  d.recv = d.xfOpen ? F.xf : null; d.feed = d.xfOpen ? OTHER[F.xf] : null;
  ["L", "R"].forEach(s => {
    d.fwOpen[s] = F.fw[s] === "OPEN" && F.fwT[s] <= 0;
    d.stbyOn[s] = !F.fault.stbyp[s] && (F.stby[s] === "ON" || s === d.feed);
    d.pumping[s] = d.stbyOn[s] && F.q[s].nac > 0.5;
    d.edp[s] = F.eng[s] && !F.fault.edp[s];
  });
  ["L", "R"].forEach(s => {
    d.src[s] = (s === d.recv && d.pumping[d.feed] && !d.pumping[s]) ? d.feed : s;
    d.supply[s] = d.fwOpen[s] && F.q[d.src[s]].nac > 0.5;
    d.press[s] = d.supply[s] && (d.pumping[d.src[s]] || d.edp[s]);
    d.fed[s] = F.eng[s] && d.supply[s];
  });
  ["L", "R"].forEach(s => {
    const float = F.q[s].aux > 0.5 || F.tm.empty[s] < 6.5;
    d.autoCmd[s] = F.aux[s] === "AUTO" && !F.fault.tm[s] && d.press[s] && float && !F.ign[s] && s !== d.recv;
    d.mfOpen[s] = !F.fault.mfv[s] && (F.aux[s] === "OVERRIDE" || d.autoCmd[s]);
    d.motive[s] = d.mfOpen[s] && d.press[s];
    d.transfer[s] = d.motive[s] && F.q[s].aux > 0.5;
    d["float" + s] = float;
  });
  d.xfFlow = d.xfOpen && d.src[d.recv] === d.feed && d.fed[d.recv];
  d.xfill = d.xfFlow && d.motive[d.recv];   // override on the receiving side: crossfed fuel drives its jet pump
  return d;
}

function fLog(msg, cls) { fLogArr.unshift({ t: F.t, msg, cls: cls || "" }); if (fLogArr.length > 40) fLogArr.pop(); const h = $("#fLog"); if (h) h.innerHTML = fLogArr.map(e => `<li class="${e.cls}"><span class="t">${fmtT(e.t)}</span><span class="m">${esc(e.msg)}</span></li>`).join(""); }
function fmtT(t) { const m = Math.floor(t / 60); return m + ":" + String(Math.floor(t % 60)).padStart(2, "0"); }

function fStep(dtReal) {
  const prev = FD;
  ["L", "R"].forEach(s => { if (F.fwT[s] > 0) F.fwT[s] = Math.max(0, F.fwT[s] - dtReal); });
  let d = fDerive();
  // flameout when no fuel reaches a running engine
  ["L", "R"].forEach(s => { if (F.eng[s] && !d.supply[s]) { F.eng[s] = false; fLog(`${SIDE[s]} engine flames out: no fuel reaching the engine${!d.fwOpen[s] ? " (firewall valve closed)" : ""}.`, "bad"); } });
  d = fDerive();
  const dt = dtReal * fSpeed; F.t += dt; const h = dt / 3600;
  const fl = { grav: {}, ret: {}, burn: {} };
  ["L", "R"].forEach(s => {
    if (d.fed[s]) { const src = F.q[d.src[s]]; const b = Math.min(BURN * h, src.nac); src.nac -= b; fl.burn[s] = BURN; } else fl.burn[s] = 0;
  });
  ["L", "R"].forEach(s => {
    const q = F.q[s];
    if (d.transfer[s]) { const a = Math.min(JET * h, q.aux); q.aux -= a; q.nac += a; }
  });
  if (d.xfill) { const a = Math.min(XFILL * h, F.q[d.feed].nac); F.q[d.feed].nac -= a; F.q[d.recv].nac += a; }
  ["L", "R"].forEach(s => {
    const q = F.q[s];
    const space = CAP.nac - q.nac;
    fl.grav[s] = false;
    if (space > 0.01 && q.wing > 0.01) { const g = Math.min(GRAV * h, space, q.wing); q.wing -= g; q.nac += g; fl.grav[s] = true; }
    fl.ret[s] = false;
    if (q.nac > CAP.nac) {
      const ex = q.nac - CAP.nac; q.nac = CAP.nac; fl.ret[s] = true;
      const toAux = Math.min(ex, CAP.aux - q.aux); q.aux += toAux;
      if (ex - toAux > 0.001) { if (F.overboard < 0.5) fLog(`${SIDE[s]} aux tank full: excess fuel is venting overboard.`, "bad"); F.overboard += ex - toAux; }
    }
    if (q.aux <= 0.5) F.tm.empty[s] += dtReal; else F.tm.empty[s] = 0;
  });
  d = fDerive();
  d.flow = fl;
  // annunciator timers (real seconds)
  ["L", "R"].forEach(s => {
    const nfxCond = d["float" + s] && F.q[s].aux > 0.5 && !d.motive[s];
    F.tm.nfx[s] = nfxCond ? F.tm.nfx[s] + dtReal : 0;
    const was = F.lit.nfx[s]; F.lit.nfx[s] = F.tm.nfx[s] >= 11;
    if (F.lit.nfx[s] && !was) fLog(`${SIDE[s]} NO FUEL XFR: aux fuel present but no motive flow pressure for 11 s.`, "warn");
    const main = F.q[s].wing + F.q[s].nac;
    const fqCond = main < 300 || F.qsel === "TEST";
    F.tm.fq[s] = fqCond ? F.tm.fq[s] + dtReal : Math.max(0, Math.min(F.tm.fq[s], 6) - dtReal);
    const wasF = F.lit.fq[s];
    F.lit.fq[s] = fqCond ? F.tm.fq[s] >= 6 : (wasF && F.tm.fq[s] > 2);
    if (F.lit.fq[s] && !wasF && main < 300) fLog(`${SIDE[s]} FUEL QTY: under 300 lb in the ${SIDE[s].toLowerCase()} main system.`, "warn");
  });
  if (F.qsel === "TEST") F.tm.test += dtReal; else F.tm.test = 0;
  // transition messages
  if (prev) ["L", "R"].forEach(s => {
    if (prev.press[s] !== d.press[s]) fLog(d.press[s] ? `${SIDE[s]} boost pressure restored.` : `${SIDE[s]} boost pressure below 10 psi: FUEL PRES LO.`, d.press[s] ? "" : "bad");
    if (prev.mfOpen[s] !== d.mfOpen[s]) fLog(`${SIDE[s]} motive flow valve ${d.mfOpen[s] ? "opens" : "closes"}${d.mfOpen[s] && F.aux[s] === "OVERRIDE" ? " (OVERRIDE)" : ""}.`);
    if (prev.transfer[s] && !d.transfer[s] && F.q[s].aux <= 0.5) fLog(`${SIDE[s]} aux tank empty. Transfer stops, and the wing cells now gravity-feed the nacelle.`);
    if (!prev.stbyOn[s] && d.stbyOn[s] && s === d.feed) fLog(`Crossfeed: ${SIDE[s].toLowerCase()} standby pump energized automatically.`);
  });
  if (prev && prev.xfOpen !== d.xfOpen) fLog(d.xfOpen ? `Crossfeed valve open: ${SIDE[d.feed].toLowerCase()} nacelle supplies the ${SIDE[d.recv].toLowerCase()} engine. FUEL CROSSFEED on.` : "Crossfeed valve closed.");
  if (prev && !prev.xfill && d.xfill) fLog(`AUX TRANSFER in OVERRIDE on the receiving side: crossfed fuel is filling the ${SIDE[d.recv].toLowerCase()} tanks. Possible overboard dump.`, "bad");
  FD = d;
  fRender();
}

const FCOMP = {};
(function () {
  const pair = (key, group, name, desc, state) => ["L", "R"].forEach(s => { const f = t => t.replace(/\{Side\}/g, SIDE[s]).replace(/\{side\}/g, SIDE[s].toLowerCase()); FCOMP[key + s] = { group, name: f(name), desc: f(desc), state: () => state(s) }; });
  const lb = v => Math.round(v) + " lb";
  pair("wing", "Tanks", "{Side} wing cells", "Two leading-edge bladder cells (13 and 40 gal), two box-section bladder cells (25 and 23 gal) and the integral wet-wing cell (35 gal): 136 gal of the 190-gal main system. They are interconnected and gravity-feed into the nacelle tank through a line from the aft inboard cell. Filler near the wingtip on the leading edge.", s => `${lb(F.q[s].wing)} · ${FD && FD.flow.grav[s] ? "gravity feeding the nacelle" : "holding (nacelle full)"}`);
  pair("nac", "Tanks", "{Side} nacelle tank", "54 gal. The engine always draws from its own nacelle tank. Aux transfer and gravity feed from the wing cells keep it full. Excess leaves an overflow tube at the top and returns to the aux tank. It holds the standby boost pump, the outlet strainer and a fiber-optic low-level sensor.", s => `${lb(F.q[s].nac)}`);
  pair("aux", "Tanks", "{Side} auxiliary tank", "79.5 gal in the wing center section. It sits lower than the nacelle tank and can't gravity-feed, so a jet pump in its sump transfers its fuel automatically. That is why aux fuel is used first. It has its own filler and anti-siphon valve.", s => `${lb(F.q[s].aux)} · ${FD && FD.transfer[s] ? "transferring" : "not transferring"}`);
  pair("stby", "Pumps", "{Side} electric standby boost pump", "In the bottom of the nacelle tank. It backs up the engine-driven boost pump, supplies crossfeed pressure, and can provide motive flow. Powered from the {side} gen bus (two 10 A breakers) and the triple-fed bus through a diode network. Crossfeed turns it on automatically on the supplying side.", s => `${FD && FD.stbyOn[s] ? "RUNNING" : "OFF"}${F.fault.stbyp[s] ? " · FAILED" : ""}${FD && FD.stbyOn[s] && s === FD.feed && F.stby[s] === "OFF" ? " (energized by crossfeed)" : ""}`);
  pair("fw", "Valves", "{Side} firewall fuel valve", "A motorized valve just behind the firewall, controlled by the {side} alternate-action pushbutton in the glareshield. FW VALVE CLOSED is on when closed and flashes in transit. Closing it arms the {side} fire extinguisher. It sits downstream of the crossfeed junction, so a closed valve on a dead engine still lets that side's nacelle supply crossfeed. With no motive pressure, though, that side's aux fuel becomes unusable.", s => F.fwT[s] > 0 ? "IN TRANSIT" : F.fw[s]);
  pair("edp", "Pumps", "{Side} engine-driven boost pump", "Turns whenever N1 turns. It pushes 1,250 pph at 30 psi to the high-pressure pump in all conditions except crossfeed or avgas operation. Its pressure is also the normal motive flow for aux transfer.", s => `${F.fault.edp[s] ? "FAILED" : F.eng[s] ? "Running" : "Stopped (engine off)"}`);
  pair("filter", "Engine fuel", "{Side} main fuel filter & pressure switch", "On the lower center of the firewall. It has a bypass valve for a clogged filter and a drain for preflight. The pressure switch directly above it closes at 9–11 psi of falling boost pressure and lights {side} FUEL PRES LO. The motive flow line also tees off here.", s => FD && FD.press[s] ? "Boost pressure normal" : "LOW PRESSURE · FUEL PRES LO");
  pair("heater", "Engine fuel", "{Side} oil-to-fuel heater", "Warms fuel with engine oil before the FCU. Fuel temperature before the heater is assumed to equal OAT. Below −45 °C an anti-icing additive is required.", s => F.eng[s] ? "Heating" : "Inactive");
  pair("fcu", "Engine fuel", "{Side} high-pressure pump & FCU", "The engine-driven high-pressure pump, with an internal strainer, delivers up to 1,050 psi. The fuel control unit meters it to the nozzles. If this pump fails, the engine flames out. With both boost pumps failed it can run on suction lift, limited to 10 hours.", s => F.eng[s] ? (FD && FD.press[s] ? "Normal feed" : "SUCTION LIFT (10 h limit)") : "Not running");
  pair("ff", "Engine fuel", "{Side} fuel flow transmitter", "Next to the FCU. It sends a signal to the DC-powered fuel flow gauge, which reads pounds per hour.", s => F.eng[s] ? `${BURN} pph` : "0 pph");
  pair("eng", "Engine", "{Side} engine", "PT6A-60A. The simulation assumes about 370 lb/hr per engine, roughly the manual's 55 gal/hr planning figure.", s => F.eng[s] ? `Running · fed from ${SIDE[FD ? FD.src[s] : s].toLowerCase()} nacelle${FD && FD.src[s] !== s ? " (crossfeed)" : ""}` : "Shut down");
  pair("mfv", "Aux transfer", "{Side} motive flow valve", "Normally closed, just aft of the firewall. The transfer module opens it with AUX TRANSFER in AUTO when boost pressure and aux fuel are both sensed. It closes it for an empty aux tank (6–7 s delay), low boost pressure, ignition on, or crossfeed toward this side. OVERRIDE powers it directly.", s => `${FD && FD.mfOpen[s] ? "OPEN" : "CLOSED"}${F.fault.mfv[s] ? " · FAILED" : ""} · switch ${F.aux[s]}`);
  pair("ck", "Aux transfer", "{Side} motive flow check valve", "Right after the motive flow valve. It stops the engine from drawing air back through the motive line when no boost pump is running.", s => FD && FD.motive[s] ? "Flowing" : "No flow");
  pair("mps", "Aux transfer", "{Side} motive flow pressure switch (6 ±1 psi)", "Confirms motive flow pressure. Below 6 ±1 psi with fuel still in the aux tank, it lights {side} NO FUEL XFR after an 11 s delay.", s => FD && FD.motive[s] ? "Pressure sensed" : "No pressure");
  pair("jet", "Aux transfer", "{Side} jet transfer pump", "A venturi pump in the aux tank sump with no moving parts. Motive fuel flowing through it entrains aux fuel and carries it to the nacelle tank, faster than the engine burns.", s => FD && FD.transfer[s] ? `Transferring about ${JET} pph` : "Idle");
  pair("relief", "Aux transfer", "{Side} overflow return & 1.5 psi relief valve", "Transfer outpaces burn, so excess fuel leaves an overflow tube at the top of the nacelle tank, passes a 1½ psi relief valve and returns to the aux tank.", s => FD && FD.flow && FD.flow.ret[s] ? "Returning fuel to aux" : "No return flow");
  pair("grav", "Tanks", "{Side} gravity flow check valve", "At the end of the gravity feed line just aft of the firewall, below the motive flow valve. It lets wing fuel into the nacelle tank but prevents backflow into the wing cells.", s => FD && FD.flow && FD.flow.grav[s] ? "Gravity flow" : "No flow");
  FCOMP.xfv = { group: "Valves", name: "Crossfeed valve", desc: "Solenoid valve at the aft inboard corner of the left nacelle (drawn on the centerline here), opened by the CROSSFEED FLOW switch through a 5 A breaker. It joins each nacelle's supply line to the opposite engine. Single-engine use only. It does not move fuel between tanks.", state: () => FD && FD.xfOpen ? `OPEN · ${SIDE[FD.feed].toLowerCase()} → ${SIDE[FD.recv].toLowerCase()} engine` : "CLOSED" };
})();

const F_STEPS = [
  ["Nacelle tank & standby pump", "Each engine draws from its own nacelle tank. The electric standby boost pump sits in the tank bottom and runs only when selected, or when crossfeed calls for it."],
  ["Firewall fuel valve", "A motorized shutoff valve just behind the firewall, controlled from the glareshield."],
  ["Engine-driven boost pump", "Raises fuel to boost pressure (30 psi, 1,250 pph) for the high-pressure pump. Its pressure also drives aux transfer."],
  ["Main fuel filter & pressure switch", "On the lower center of the firewall, with a bypass and a drain. The switch above it senses boost pressure for FUEL PRES LO. The motive flow line tees off here."],
  ["Oil-to-fuel heater", "Engine oil warms the fuel so ice crystals don't form ahead of the FCU."],
  ["High-pressure pump & FCU", "Up to 1,050 psi. The fuel control unit meters fuel to the nozzles."],
  ["Fuel flow transmitter → nozzles", "Sends fuel flow (pph) to the cockpit gauge. The manifold purge system clears residual fuel at shutdown."]
];

const F_SCEN = [
  { t: "Normal cruise: aux fuel used first", cap: "Both engines running, all switches normal. Engine boost pressure drives each jet pump, which moves aux fuel into the nacelle tank faster than the engine burns it. The excess returns to the aux tank through the overflow line. The wing cells stay full until the aux tanks are empty.", apply() {} },
  { t: "Aux tanks empty: wing cells gravity-feed", cap: "With the aux tanks dry, the transfer module closes the motive flow valves 6–7 s after the float switch senses empty. The outer wing cells now gravity-feed the nacelle tanks through the gravity flow check valves.", apply(f) { f.q.L.aux = 0; f.q.R.aux = 0; f.tm.empty = { L: 10, R: 10 }; } },
  { t: "Left engine-driven boost pump failure", cap: "Boost pressure drops below 10 psi: L FUEL PRES LO, the motive flow valve closes, and L NO FUEL XFR follows after 11 s. The engine keeps running on suction lift. Turn the LEFT STANDBY PUMP ON to restore pressure and aux transfer.", apply(f) { f.fault.edp.L = true; } },
  { t: "Both left boost pumps failed: suction lift", cap: "Engine-driven and standby boost pumps are both failed on the left. The high-pressure pump keeps the engine running on suction lift (10 hour limit). With no motive flow, left aux fuel can't transfer. Crossfeed from the right side is one way to feed the left engine with pressure.", apply(f) { f.fault.edp.L = true; f.fault.stbyp.L = true; } },
  { t: "Left transfer module failure: use OVERRIDE", cap: "The module no longer powers the motive flow valve, so L NO FUEL XFR lights after 11 s. Move LEFT AUX TRANSFER to OVERRIDE to power the valve directly and restore transfer.", apply(f) { f.fault.tm.L = true; } },
  { t: "Left motive flow valve failed closed", cap: "The valve itself won't open, so neither AUTO nor OVERRIDE restores transfer. Left aux fuel is unusable, and the aux gauge stays put while the left main fuel goes down.", apply(f) { f.fault.mfv.L = true; } },
  { t: "Ignition on: transfer interrupted", cap: "Whenever ignition is powered (start switch or auto-ignition below 17% torque), the module removes power from that side's motive flow valve. L IGNITION ON lights, and L NO FUEL XFR follows after 11 s while the ignition stays on.", apply(f) { f.ign.L = true; } },
  { t: "Single engine: crossfeed right tank → left engine", cap: "The right engine is shut down with its firewall valve open. CROSSFEED FLOW toward the LEFT engine opens the crossfeed valve and starts the right standby pump automatically. The left motive flow valve closes because it is the receiving side, so L NO FUEL XFR comes on. The right side keeps transferring its aux fuel with standby pump motive flow.", apply(f) { f.eng.R = false; f.xf = "L"; } },
  { t: "Crossfeed with the dead engine's firewall valve closed", cap: "The right firewall valve was closed at shutdown. Crossfeed still works because the crossfeed line tees off upstream of the firewall valve. But R FUEL PRES LO stays on and the right aux fuel is unusable, with no motive flow pressure behind the closed valve.", apply(f) { f.eng.R = false; f.fw.R = "CLOSED"; f.xf = "L"; } },
  { t: "Crossfeed error: receiving side in OVERRIDE", cap: "LEFT AUX TRANSFER was left in OVERRIDE while crossfeeding to the left engine. The left motive flow valve stays open, so crossfed fuel drives the left jet pump and fills the left tanks. With the left aux already full, the excess vents overboard. Return the switch to AUTO.", apply(f) { f.eng.R = false; f.xf = "L"; f.aux.L = "OVERRIDE"; } },
  { t: "Low fuel: FUEL QTY", cap: "Aux tanks and wing cells empty, nacelles only. When a main system drops below about 300 lb, FUEL QTY lights after a 5–7 s delay, about 30 minutes at maximum continuous power. Also try holding the FUEL QTY switch at TEST.", apply(f) { ["L", "R"].forEach(s => { f.q[s].aux = 0; f.q[s].wing = 0; f.q[s].nac = 320; f.tm.empty[s] = 10; }); } },
  { t: "On the ground, engines off", cap: "Battery on, engines off, standby pumps off. There's no boost pressure, so both FUEL PRES LO lights are on, and with fuel in the aux tanks both NO FUEL XFR lights come on after 11 s. Switch a standby pump ON and watch its side transfer.", apply(f) { f.eng.L = false; f.eng.R = false; } }
];

const F_SW = [
  { group: "Left", items: [{ id: "stbyL", name: "STBY PUMP", pos: [["ON", "ON"], ["OFF", "OFF"]] }, { id: "auxL", name: "AUX XFER", pos: [["OVERRIDE", "OVERRIDE"], ["AUTO", "AUTO"]] }] },
  { group: "Center", items: [{ id: "xf", name: "CROSSFEED FLOW", pos: [["L", "◄ LEFT ENG"], ["OFF", "OFF"], ["R", "RIGHT ENG ►"]] }, { id: "qsel", name: "FUEL QTY", pos: [["TEST", "TEST", 1], ["MAIN", "MAIN"], ["AUX", "AUXILIARY", 1]] }] },
  { group: "Right", items: [{ id: "stbyR", name: "STBY PUMP", pos: [["ON", "ON"], ["OFF", "OFF"]] }, { id: "auxR", name: "AUX XFER", pos: [["OVERRIDE", "OVERRIDE"], ["AUTO", "AUTO"]] }] }
];
let qselTimer = null;
function fSwVal(id) { if (id === "xf") return F.xf; if (id === "qsel") return F.qsel; const k = id.slice(-1); return id.startsWith("stby") ? F.stby[k] : F.aux[k]; }
function fSetSw(id, v) {
  if (id === "xf") {
    if (v !== "OFF" && F.eng.L && F.eng.R) fLog("Crossfeed is permitted only with one engine inoperative. With both engines running, pressures balance and each engine feeds normally.", "warn");
    F.xf = v;
  } else if (id === "qsel") {
    F.qsel = v; clearTimeout(qselTimer);
    if (v !== "MAIN") qselTimer = setTimeout(() => { F.qsel = "MAIN"; fRender(); }, v === "TEST" ? 8000 : 4000);
  } else { const k = id.slice(-1); if (id.startsWith("stby")) F.stby[k] = v; else F.aux[k] = v; }
  fStep(0.001);
}

function fRender() {
  if (!$("#fschem") || !FD) return;
  const d = FD;
  const act = {}, kind = {};
  ["L", "R"].forEach(s => {
    act["grav" + s] = !!(d.flow && d.flow.grav[s]);
    act["tank" + s] = (d.fed[s] && d.src[s] === s) || (d.xfFlow && s === d.feed) || (d.press[s] && d.pumping[s]);
    kind["tank" + s] = d.pumping[s] ? "press" : "fuel";
    act["feedA" + s] = d.fed[s] || (d.press[s] && d.motive[s]);
    act["feedB" + s] = d.fed[s];
    kind["feedA" + s] = kind["feedB" + s] = d.press[s] ? "press" : "fuel";
    act["mot" + s] = d.motive[s];
    act["jet" + s] = d.transfer[s] || (d.motive[s] && d.xfill && s === d.recv);
    act["ret" + s] = !!(d.flow && d.flow.ret[s]);
  });
  act.xfLR = d.xfFlow && d.feed === "L"; act.xfRL = d.xfFlow && d.feed === "R";
  $$("#fschem [data-fl]").forEach(el => {
    const k = el.dataset.fl; el.classList.toggle("on", !!act[k]);
    if (kind[k]) { el.classList.remove("k-fuel", "k-press"); el.classList.add("k-" + kind[k]); }
  });
  $$("#fschem [data-fa]").forEach(el => {
    const k = el.dataset.fa; el.classList.toggle("on", !!act[k]);
    if (kind[k]) { el.classList.remove("k-fuel", "k-press"); el.classList.add("k-" + kind[k]); }
  });
  const H = { wing: 93, nac: 94, aux: 56 }, Y0 = { wing: 428, nac: 328, aux: 458 };
  ["L", "R"].forEach(s => ["wing", "nac", "aux"].forEach(t => {
    const fr = Math.max(0, Math.min(1, F.q[s][t] / CAP[t])), r = $(`#fschem [data-tank="${t}${s}"]`);
    r.setAttribute("y", Y0[t] - H[t] * fr); r.setAttribute("height", H[t] * fr);
    $(`#fschem [data-tq="${t}${s}"]`).textContent = Math.round(F.q[s][t]) + " lb";
  }));
  ["L", "R"].forEach(s => {
    const fwv = $(`#fschem [data-vlv="fw${s}"]`), st = F.fwT[s] > 0 ? "transit" : F.fw[s] === "OPEN" ? "open" : "closed";
    fwv.setAttribute("class", "vlv " + st); $(`#fschem [data-vbar="fw${s}"]`).classList.toggle("open", st === "open");
    $(`#fschem [data-vlv="mfv${s}"]`).setAttribute("class", "vlv " + (F.fault.mfv[s] ? "fail" : d.mfOpen[s] ? "open" : "closed"));
    $(`#fschem [data-vbar="mfv${s}"]`).classList.toggle("open", d.mfOpen[s]);
    $(`#fschem [data-pump="stby${s}"]`).setAttribute("class", "pump" + (F.fault.stbyp[s] ? " fail" : d.stbyOn[s] ? " on" : ""));
    $(`#fschem [data-pump="edp${s}"]`).setAttribute("class", "pump" + (F.fault.edp[s] ? " fail" : d.edp[s] ? " on" : ""));
    $(`#fschem [data-psw="${s}"]`).classList.toggle("lo", !d.press[s]);
    $(`#fschem [data-mps="${s}"]`).classList.toggle("lo", !d.motive[s] && F.q[s].aux > 0.5);
    $(`#fschem [data-eng="${s}"]`).setAttribute("class", "engbox " + (F.eng[s] ? "run" : "out"));
    $(`#fschem [data-ffr="${s}"]`).textContent = F.eng[s] ? `FF ${BURN} PPH` : "SHUT DOWN";
  });
  $('#fschem [data-vlv="xfv"]').setAttribute("class", "vlv " + (d.xfOpen ? "open" : "closed"));
  $('#fschem [data-vbar="xfv"]').classList.toggle("open", d.xfOpen);

  // switches
  $$("#fSwitches button[data-fsw]").forEach(b => b.setAttribute("aria-pressed", String(fSwVal(b.dataset.fsw) === b.dataset.val)));
  // gauges
  ["L", "R"].forEach(s => {
    const v = F.qsel === "AUX" ? F.q[s].aux : F.q[s].wing + F.q[s].nac;
    setGaugeTo("fq" + s, FQ_G, v / 100, `${F.qsel === "AUX" ? "AUX" : "MAIN"} ${Math.round(v)} lb`);
  });
  // firewall buttons
  ["L", "R"].forEach(s => { const b = $("#fwb" + s); b.classList.toggle("closed", F.fw[s] === "CLOSED" && F.fwT[s] <= 0); b.classList.toggle("transit", F.fwT[s] > 0); });
  // engines
  ["L", "R"].forEach(s => {
    let h;
    if (!F.eng[s]) h = "Shut down.";
    else if (!d.press[s]) h = `Running on suction lift (HP pump only). FUEL PRES LO.`;
    else h = `Running · ${BURN} pph from the ${SIDE[d.src[s]].toLowerCase()} nacelle${d.src[s] !== s ? " via crossfeed" : ""}${d.pumping[d.src[s]] ? " (standby pump pressure)" : ""}.`;
    $("#fhint" + s).textContent = h;
    $("#feng" + s).textContent = F.eng[s] ? "Shut down (condition lever cutoff)" : "Start engine";
    $("#fign" + s).setAttribute("aria-pressed", String(F.ign[s]));
    $("#fign" + s).textContent = F.ign[s] ? "Ignition: ON" : "Ignition: OFF";
  });
  // annunciators
  const A = { LPL: ["red", !d.press.L], XF: ["green", d.xfOpen], RPL: ["red", !d.press.R], LNFX: ["amber", F.lit.nfx.L], RNFX: ["amber", F.lit.nfx.R], LFQ: ["amber", F.lit.fq.L], RFQ: ["amber", F.lit.fq.R], LIGN: ["green", F.ign.L], RIGN: ["green", F.ign.R] };
  Object.keys(A).forEach(k => { const el = $("#fann-" + k); if (el) el.className = "ann" + (A[k][1] ? " " + A[k][0] : ""); });
  $$("#fFaults [data-ff]").forEach(b => { const [t, s] = b.dataset.ff.split(":"); b.setAttribute("aria-pressed", String(F.fault[t][s])); });
  $$("#fSpeed [data-sp]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.sp === fSpeed)));
  // info panel live state
  const n = $("#fInfoNow"); if (n && fSel) n.textContent = "Now: " + FCOMP[fSel].state();
}

const FQ_G = { min: 0, max: 14, ticks: [0, 4, 8, 12], amber: [0, 2.65] };
function setGaugeTo(id, G, v, txt) {
  const a = -120 + 240 * (Math.max(G.min, Math.min(G.max, v)) - G.min) / (G.max - G.min);
  const n = $("#" + id + "N"); if (n) n.style.transform = `rotate(${a}deg)`;
  const t = $("#" + id + "V"); if (t) t.textContent = txt;
}

function fSelect(id, scroll) {
  fSel = id;
  $$("#fschem .comp").forEach(g => g.classList.toggle("sel", g.dataset.fcomp === id));
  const c = FCOMP[id];
  $("#fInfo").innerHTML = `<div class="eyebrow">${esc(c.group)}</div><h4>${esc(c.name)}</h4><div class="now" id="fInfoNow">Now: ${esc(c.state())}</div><p>${esc(c.desc)}</p>`;
  if (scroll) $("#f-sim").scrollIntoView({ behavior: "smooth", block: "start" });
}

function fApply(i) {
  fScen = Math.max(0, Math.min(F_SCEN.length - 1, i));
  F = fFresh(); F_SCEN[fScen].apply(F); FD = null; fLogArr = [];
  fLog(`Loaded scenario: ${F_SCEN[fScen].t}.`);
  $("#fScenSel").value = String(fScen);
  $("#fScenCap").textContent = F_SCEN[fScen].cap;
  fStep(0.001);
}

function initFuel() {
  buildFuelSchematic();
  $("#fSubnav").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) document.getElementById(b.dataset.go).scrollIntoView({ behavior: "smooth", block: "start" }); });
  $("#fScenSel").innerHTML = F_SCEN.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.t)}</option>`).join("");
  $("#fScenSel").addEventListener("change", e => fApply(+e.target.value));
  $("#fPrev").addEventListener("click", () => fApply(fScen - 1));
  $("#fNext").addEventListener("click", () => fApply(fScen + 1));
  // switches
  $("#fSwitches").innerHTML = F_SW.map(g => `<div class="sw-group"><div class="gname">${g.group}</div><div class="sws">${g.items.map(s =>
    `<div class="tog"><div class="name">${s.name}</div><div class="pos" role="group" aria-label="${s.name} ${g.group}">${s.pos.map(p =>
      `<button type="button" id="fsw-${s.id}-${p[0]}" data-fsw="${s.id}" data-val="${p[0]}" class="${p[2] ? "mom" : ""}" aria-pressed="false">${p[1]}</button>`).join("")}</div></div>`).join("")}</div></div>`).join("");
  $("#fSwitches").addEventListener("click", e => { const b = e.target.closest("[data-fsw]"); if (b) fSetSw(b.dataset.fsw, b.dataset.val); });
  $("#fGauges").innerHTML = ["L", "R"].map(s => `<div class="gauge">${gaugeSVG(Object.assign({ id: "fq" + s }, FQ_G))}<div class="gl">${SIDE[s]} fuel · lb × 100</div><div class="gv" id="fq${s}V"></div></div>`).join("");
  $("#fwBtns").innerHTML = ["L", "R"].map(s => `<button type="button" class="fwbtn" id="fwb${s}" aria-label="${SIDE[s]} firewall fuel valve pushbutton"><span class="top">ENG FIRE<br>${s} F/W VALVE</span><span class="bot">PUSH · CLOSED</span></button>`).join("");
  ["L", "R"].forEach(s => $("#fwb" + s).addEventListener("click", () => {
    F.fw[s] = F.fw[s] === "OPEN" ? "CLOSED" : "OPEN"; F.fwT[s] = 2;
    fLog(`${SIDE[s]} firewall valve ${F.fw[s] === "OPEN" ? "opening" : "closing"} (FW VALVE CLOSED flashes in transit).${F.fw[s] === "CLOSED" ? " Fire extinguisher armed." : ""}`);
    fStep(0.001);
  }));
  $("#fEngines").innerHTML = ["L", "R"].map(s => `<div class="eng"><div class="hd"><span>${SIDE[s]} engine</span></div><div class="hint" id="fhint${s}"></div>
    <div class="faults"><button class="pbtn" type="button" id="feng${s}"></button><button class="pbtn" type="button" id="fign${s}" aria-pressed="false"></button></div></div>`).join("");
  ["L", "R"].forEach(s => {
    $("#feng" + s).addEventListener("click", () => {
      if (F.eng[s]) { F.eng[s] = false; fLog(`${SIDE[s]} engine shut down.`); }
      else if (FD && FD.supply[s]) { F.eng[s] = true; fLog(`${SIDE[s]} engine started.`); }
      else fLog(`${SIDE[s]} engine can't start: no fuel reaches it (check the firewall valve and nacelle quantity).`, "warn");
      fStep(0.001);
    });
    $("#fign" + s).addEventListener("click", () => { F.ign[s] = !F.ign[s]; fLog(`${SIDE[s]} ignition ${F.ign[s] ? "ON: motive flow valve power removed" : "OFF"}.`); fStep(0.001); });
  });
  $("#fAnns").innerHTML = [["LPL", "L FUEL PRES LO"], ["XF", "FUEL CROSSFEED"], ["RPL", "R FUEL PRES LO"], ["LNFX", "L NO FUEL XFR"], ["", ""], ["RNFX", "R NO FUEL XFR"], ["LFQ", "L FUEL QTY"], ["", ""], ["RFQ", "R FUEL QTY"], ["LIGN", "L IGNITION ON"], ["", ""], ["RIGN", "R IGNITION ON"]]
    .map(a => a[0] ? `<div class="ann" id="fann-${a[0]}">${a[1]}</div>` : `<div class="ann" aria-hidden="true"></div>`).join("");
  const FAULTS_F = [["edp", "Eng-driven boost pump"], ["stbyp", "Standby pump"], ["tm", "Transfer module"], ["mfv", "Motive flow valve"]];
  $("#fFaults").innerHTML = ["L", "R"].map(s => FAULTS_F.map(f => `<button type="button" class="pbtn" id="ff-${f[0]}${s}" data-ff="${f[0]}:${s}" aria-pressed="false">${s} ${f[1]}</button>`).join("")).join("") + `<button type="button" class="pbtn" id="fRepair">Repair all</button>`;
  $("#fFaults").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "fRepair") { ["edp", "stbyp", "tm", "mfv"].forEach(t => F.fault[t] = { L: false, R: false }); fLog("All fuel system failures repaired."); }
    else { const [t, s] = b.dataset.ff.split(":"); F.fault[t][s] = !F.fault[t][s]; fLog(`${F.fault[t][s] ? "Failure" : "Repaired"}: ${b.textContent}.`, F.fault[t][s] ? "bad" : ""); }
    fStep(0.001);
  });
  $("#fSpeed").innerHTML = [[1, "Real time"], [10, "×10"], [60, "×60"], [240, "×240"]].map(x => `<button type="button" id="fsp-${x[0]}" data-sp="${x[0]}" aria-pressed="false">${x[1]}</button>`).join("");
  $("#fSpeed").addEventListener("click", e => { const b = e.target.closest("[data-sp]"); if (b) { fSpeed = +b.dataset.sp; fRender(); } });
  const sv = $("#fschem");
  sv.addEventListener("click", e => { const g = e.target.closest(".comp"); if (g) fSelect(g.dataset.fcomp); });
  sv.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".comp")) { e.preventDefault(); fSelect(e.target.closest(".comp").dataset.fcomp); } });
  $("#fSteps").innerHTML = F_STEPS.map(s => `<li><div><h4>${esc(s[0])}</h4><p>${esc(s[1])}</p></div></li>`).join("");
  fApply(0);
  fSelect("nacL");
  fTimer = setInterval(() => fStep(0.25), 250);
}


/* ================= Chapter 7: Powerplant ================= */
const PL_IDLE = 24, PL_GF = 14, CL_GATE = 10, PR_FTH = 10;
let PP = null, ppTimer = null, ppSide = "L", ppTab = "gas", ppSel = null, ppScen = 0, ppScript = null, ppLogArr = [];
const clamp01 = v => Math.max(0, Math.min(1, v));

function ppEngine() {
  return { pl: PL_IDLE, pr: 5, cl: 0, start: "OFF", autoIgn: false, n1: 0, itt: 15, np: 0, tq: 0, ff: 0, oilP: 0, oilT: 15, blade: 1,
    lit: false, startPhase: false, wetT: 0, peak: 0, purgeT: 0, starterT: 0, mode: "SHUT DOWN", ctl: "", topping: false, warned: {}, stallT: 0, prevN1: 0, starterHold: 0 };
}
function ppFresh() {
  return { E: { L: ppEngine(), R: ppEngine() }, env: { flight: false, oat: 15, gen: { L: true, R: true }, ac: false },
    fault: { chip: { L: false, R: false }, bleedOpen: { L: false, R: false }, bleedClosed: { L: false, R: false }, hp: { L: false, R: false }, boost: { L: false, R: false }, csu: { L: false, R: false } },
    lift: { pwr: false, cnd: false }, together: true, t: 0 };
}
function ppLog(msg, cls) {
  ppLogArr.unshift({ t: PP.t, msg, cls: cls || "" }); if (ppLogArr.length > 50) ppLogArr.pop();
  const h = $("#ppLog"); if (h) h.innerHTML = ppLogArr.map(e => `<li class="${e.cls}"><span class="t">${e.t.toFixed(1)}s</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
function warnOnce(e, key, cond, msg, cls) { if (cond && !e.warned[key]) { e.warned[key] = true; ppLog(msg, cls || "warn"); } if (!cond) e.warned[key] = false; }
const npSetOf = e => 1450 + clamp01((e.pr - 12) / 88) * 250;
const idleOf = e => 62 + clamp01((e.cl - CL_GATE) / 90) * 8;

function ppStep(dt) {
  PP.t += dt;
  const env = PP.env, F = PP.fault;
  ["L", "R"].forEach(k => {
    const e = PP.E[k], S = SIDE[k];
    const fuelSel = e.cl >= CL_GATE;
    if (e.start === "STARTER") { e.starterHold -= dt; if (e.starterHold <= 0) { e.start = "OFF"; ppLog(`${S} STARTER ONLY released (spring-loaded to OFF).`); } }
    const starter = e.start === "ON" || e.start === "STARTER";
    const ign = e.start === "ON" || (e.autoIgn && e.tq < 17);
    e.ign = ign;
    const flowing = fuelSel && !F.hp[k] && e.n1 >= 8;
    // light-off / flameout
    if (flowing && !e.lit) {
      if (ign) {
        e.lit = true; e.startPhase = e.n1 < idleOf(e) - 1;
        e.peak = 760 + Math.max(0, 12 - e.n1) * 150 + Math.min(e.wetT, 10) * 30 + (env.oat - 15) * 2;
        ppLog(e.startPhase ? `${S} light-off at ${e.n1.toFixed(0)}% N1${e.n1 < 12 ? ". Fuel was introduced below 12% N1: expect a hot start." : "."}${e.wetT > 2 ? " Pooled fuel adds to the ITT peak." : ""}` : `${S} engine relights (igniters on).`, e.n1 < 12 && e.startPhase ? "warn" : "");
        e.wetT = 0;
      } else { e.wetT += dt; warnOnce(e, "wet", e.wetT > 2, `${S}: fuel is flowing with no ignition. That's a wet start risk, and STARTER ONLY clears the fuel.`); }
    } else if (!flowing) e.wetT = Math.max(0, e.wetT - dt * 0.5);
    if (e.lit && !flowing) {
      e.lit = false; e.startPhase = false;
      if (!fuelSel) { e.purgeT = 1.5; ppLog(`${S} condition lever to FUEL CUTOFF. The P3 manifold purge burns residual fuel, so spool-down starts after 1–2 s.`); }
      else if (F.hp[k]) ppLog(`${S} high-pressure fuel pump failed. The minimum pressurizing valve closes and the engine flames out.`, "bad");
      else ppLog(`${S} engine flamed out.`, "bad");
    }
    // N1
    const idle = idleOf(e);
    if (e.lit) {
      let cmd;
      if (e.pl >= PL_IDLE) cmd = idle + (e.pl - PL_IDLE) / (100 - PL_IDLE) * (104 - idle);
      else if (e.pl >= PL_GF) cmd = idle;
      else cmd = idle + (PL_GF - e.pl) / PL_GF * (86 - idle);
      if (e.startPhase) {
        e.n1 += (2.6 + (starter ? 1.6 : 0) + (e.n1 > 37 ? 1.8 : 0)) * dt;
        if (e.n1 >= 37 && e.prevN1 < 37) ppLog(`${S} secondary nozzles flowing (~37% N1). All 14 nozzles now deliver fuel, and N1 accelerates noticeably.`);
        if (e.n1 >= idle - 1) { e.startPhase = false; ppLog(`${S} stabilized at idle, ${idle.toFixed(0)}% N1. Turn the start switch OFF.`); }
      } else e.n1 += Math.max(-6 * dt, Math.min(8 * dt, (cmd - e.n1) * dt / 1.6));
    } else if (e.purgeT > 0) e.purgeT -= dt;
    else {
      const tgt = starter ? 20 : 0;
      e.n1 += (tgt - e.n1) * dt / (tgt > e.n1 ? 2.4 : 3.5);
      if (e.n1 < 0.05) e.n1 = 0;
    }
    if (starter) { e.starterT += dt; warnOnce(e, "starter", e.starterT > 30, `${S} starter has run 30 s. Limit is 30 s ON, then 5 min OFF.`); } else e.starterT = 0;
    // bleed valve
    e.bleedOpen = F.bleedOpen[k] ? true : F.bleedClosed[k] ? false : e.n1 < 90;
    // SHP
    const dens = 288 / (273 + env.oat) * (env.flight ? 0.72 : 1);
    let shp = e.lit ? 1180 * dens * Math.pow(clamp01((e.n1 - 55) / 49), 1.8) : 0;
    if (e.bleedOpen && e.n1 > 85) shp *= 0.88;
    // ITT
    if (e.lit) {
      const pen = ((env.gen[k] ? 90 : 0) + (k === "R" && env.ac ? 160 : 0)) * clamp01((78 - e.n1) / 16);
      const steadyAt = n => 520 + 6.4 * (n - 62) + (env.oat - 15) * 2.2 + pen + (e.bleedOpen && n > 85 ? 55 : 0) - (env.flight ? 15 : 0);
      let tgt = steadyAt(e.n1);
      if (e.startPhase) { const base = steadyAt(idle); tgt = Math.max(tgt, base + (e.peak - base) * Math.exp(-Math.pow((e.n1 - 26) / 11, 2))); }
      if (F.bleedClosed[k] && e.n1 < 85 && e.n1 - e.prevN1 > 0.25 * dt * 10 && !e.startPhase) { if (e.stallT <= 0) ppLog(`${S} compressor stall: the bleed valve is stuck closed during acceleration at low N1. Bang, ITT spike.`, "bad"); e.stallT = 1.5; }
      if (e.stallT > 0) { e.stallT -= dt; tgt += 120; }
      e.itt += (tgt - e.itt) * dt / 1.1;
    } else e.itt += (env.oat + 20 - e.itt) * dt / 8;
    // oil
    e.oilP = e.n1 < 10 ? e.n1 * 4.5 : 55 + (Math.min(e.n1, 80) - 10) * 0.85;
    e.oilT += ((e.n1 > 5 ? 45 + e.n1 * 0.4 + (env.oat - 15) * 0.3 : env.oat) - e.oilT) * dt / 40;
    // propeller
    const npSet = npSetOf(e);
    const ram = env.flight ? 950 : 0;
    const npFine = e.lit ? 900 + 2200 * Math.pow(shp / 1180, 0.75) + ram : (env.flight ? 1150 : 0);
    let feather = e.pr < PR_FTH || (!env.flight && (!e.lit || e.oilP < 40));
    let npT, blade, mode, ctl; e.topping = false;
    if (feather) {
      blade = 1; npT = e.lit ? Math.min(npFine * 0.3, 650) : 0;
      mode = e.lit ? "FEATHERED" : (e.n1 > 0.5 ? (e.startPhase || e.start !== "OFF" ? "STARTING" : "SPOOLING DOWN") : "SHUT DOWN");
      ctl = e.pr < PR_FTH ? "Prop lever in FEATHER: the feathering valve dumps governor oil, and springs plus counterweights drive the blades to the feather stop." : "No governor oil pressure: the propeller sits on its feather stop until the engine is running.";
    } else if (!e.lit && env.flight) {
      blade = 0.25; npT = Math.min(npSet, 1150); mode = "WINDMILLING";
      ctl = "Engine not running, propeller windmilling with high drag. Feather it: prop lever to FEATHER.";
    } else if (e.pl >= PL_IDLE) {
      if (F.csu[k]) {
        const top = npSet * 1.06; npT = Math.min(npFine, top); e.topping = npFine > top;
        blade = 0.15; mode = "CSU FAILED";
        ctl = e.topping ? `Constant speed governor failed. The fuel topping governor bleeds FCU air and cuts fuel to hold about ${Math.round(top)} rpm. More power lever has no effect.` : "Constant speed governor failed. Np follows power until the fuel topping governor takes over.";
      } else if (npFine >= npSet) {
        npT = npSet; blade = 0.18 + 0.55 * clamp01((npFine - npSet) / 2600); mode = "ALPHA";
        ctl = `Constant speed: the CSU varies blade angle to hold ${Math.round(npSet)} rpm. The power lever sets N1 only.`;
      } else {
        npT = npFine; blade = 0.15 + (e.pl - PL_IDLE) / 76 * 0.04; mode = "BETA";
        ctl = `Below governing speed (Np < ${Math.round(npSet)}). The blades rest at the flight-idle angle set through the beta valve, and the CSU is in underspeed.`;
      }
    } else if (e.pl >= PL_GF) {
      blade = (e.pl - 19) / 5 * 0.15; npT = npFine; mode = "GROUND FINE";
      ctl = "Ground fine: the power lever sets blade angle through the cambox and beta valve. N1 stays at idle. Zero thrust is near the middle of this range.";
    } else {
      const top = npSet * 0.97; blade = -0.15 - (PL_GF - e.pl) / PL_GF * 0.25; npT = Math.min(npFine, top); e.topping = npFine > top; mode = "REVERSE";
      ctl = `Reverse: the power lever sets both N1 and reverse blade angle. The fuel topping governor, reset below the selected speed, limits Np to about ${Math.round(top)} rpm.`;
    }
    e.np += (npT - e.np) * dt / 1.3; if (e.np < 1) e.np = 0;
    e.blade += (blade - e.blade) * dt / 0.8;
    e.mode = e.startPhase ? "STARTING" : mode; e.ctl = e.startPhase ? "Starting: the starter and the FCU's start fuel schedule accelerate the gas generator. Watch ITT." : ctl;
    e.tq = e.lit && e.np > 60 ? shp / 1050 * 1700 / e.np * 100 : 0;
    e.ff = e.lit ? (90 + 540 * Math.pow(clamp01((e.n1 - 55) / 49), 1.35)) * (env.flight ? 0.8 : 1) : (flowing ? 110 : 0);
    // exceedance messages
    warnOnce(e, "itt1000", e.itt > 1000, `${S} ITT above 1,000 °C. That's the starting limit, and only 5 s is allowed. Abort: condition lever to FUEL CUTOFF.`, "bad");
    warnOnce(e, "itt820", e.lit && !e.startPhase && e.itt > 822, `${S} ITT above 820 °C maximum continuous. Reduce power: this is the ITT-limited case.`, "bad");
    warnOnce(e, "itt750", e.lit && !e.startPhase && e.n1 < 72 && e.itt > 750 && e.itt <= 822, `${S} ITT above the 750 °C idle limit. Reduce generator/A-C load, then raise N1 with the condition lever (HI IDLE).`, "warn");
    warnOnce(e, "tq", e.tq > 101, `${S} torque above 100%. Reduce the power lever: this is the torque-limited case.`, "bad");
    warnOnce(e, "np", e.np > 1712, `${S} propeller above 1,700 rpm.`, "bad");
    warnOnce(e, "oilp", e.lit && !e.startPhase && e.oilP < 60, `${S} oil pressure below 60 psi.`, "bad");
    warnOnce(e, "ground", env.flight && e.pl < PL_IDLE, `${S} power lever below flight idle in flight. Never do this.`, "bad");
    e.prevN1 = e.n1;
  });
  if (ppScript) ppRunScript();
  ppRender();
}

/* ---------- scripts (auto-demonstrations) ---------- */
function ppRunScript() {
  const s = ppScript;
  while (s.i < s.steps.length) {
    const st = s.steps[s.i];
    if (st.wait !== undefined) { if (PP.t - s.t0 < st.wait) return; }
    else if (st.until && !st.until(PP)) return;
    st.do(PP); if (st.msg) ppLog("Demo: " + st.msg); s.i++; s.t0 = PP.t;
  }
  ppScript = null;
}

/* ---------- scenarios ---------- */
function ppRun(e, cl) { e.lit = true; e.n1 = idleOf(Object.assign({}, e, { cl: cl === undefined ? e.cl : cl })); e.itt = 560; e.np = 1100; e.oilP = 100; e.oilT = 60; e.blade = 0.15; e.mode = "BETA"; }
const both = (P, f) => ["L", "R"].forEach(k => f(P.E[k], k));
const PP_SCEN = [
  { t: "Cold & dark", cap: "Both engines shut down, props feathered, condition levers at FUEL CUTOFF. Try a start yourself: prop levers to HIGH RPM, start switch ON, then condition lever to LOW IDLE (lift over the gate) once N1 passes 12%.", apply() {} },

function ppApply(i) {
  ppScen = Math.max(0, Math.min(PP_SCEN.length - 1, i));
  const sc = PP_SCEN[ppScen];
  PP = ppFresh(); ppLogArr = [];
  sc.apply(PP);
  ppScript = sc.script ? { steps: sc.script, i: 0, t0: 0 } : null;
  ppLog(`Loaded: ${sc.t}.`);
  $("#ppScenSel").value = String(ppScen);
  $("#ppScenCap").textContent = sc.cap;
  $$("[data-eng]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.eng === ppSide)));
  ppSyncControls();
  ppStep(0.01);
}

const LEVERS = [
  { g: "pwr", name: "Power", cls: "pwr", marks: [[100, "Takeoff"], [62, "Cruise"], [PL_IDLE, "Idle", 1], [19, "Gnd fine"], [PL_GF, "", 1], [5, "Reverse"]], gates: [PL_IDLE, PL_GF] },
  { g: "prp", name: "Propeller", cls: "prp", marks: [[100, "High rpm 1700"], [56, "1575"], [15, "Low 1450"], [5, "Feather"]], stripe: [0, PR_FTH] },

];
const LKEY = { pwr: "pl", prp: "pr", cnd: "cl" };
function ppHint(msg) { const h = $("#ppHint"); if (h) h.textContent = msg; }

function ppLeverInput(g, k, v) {
  const key = LKEY[g], e = PP.E[k], prev = e[key];
  if (g === "pwr") {
    if (PP.env.flight && v < PL_IDLE) { v = PL_IDLE; ppHint("In flight the power levers stay at or above flight idle. Ground fine and reverse are for the ground only."); }

  if (PP.together) { const o = PP.E[OTHER[k]]; if (!(g === "cnd" && o.cl < CL_GATE && v >= CL_GATE && !o.lit && o.n1 < 1)) o[key] = v; }

function ppSyncControls() {

  $$("#envRow [data-env]").forEach(b => {

  $$("#ppFaults [data-pf]").forEach(b => { const [t, k] = b.dataset.pf.split(":"); b.setAttribute("aria-pressed", String(PP.fault[t][k])); });
}

  ["High idle", P => both(P, e => { if (e.lit || e.cl >= CL_GATE) e.cl = 100; e.pl = PL_IDLE; })],

  ["Takeoff power", P => both(P, e => { e.pl = 100; e.pr = 100; })],
  ["Cruise 1,500 rpm", P => both(P, e => { e.pl = 80; e.pr = 12 + 50 / 250 * 88; })],
