  <section class="block" id="pp-ign">
    <h2>Ignition &amp; starting <span class="ref">Figure 7-9</span></h2>
    <div class="two-col">
      <div class="card"><h3>Igniters &amp; exciter</h3><p>Two spark igniters in the combustion liner. Either one alone will start the engine, and an open or shorted igniter doesn't stop the other. An airframe-mounted exciter runs on 28 V DC (works from 9 to 30 V) and produces up to 3,500 V. Combustion is self-sustaining once lit, so the igniters go off after the start.</p></div>
      <div class="card"><h3>IGNITION AND ENGINE START switches</h3><p><b>ON</b> runs the starter and both igniters. <b>OFF</b> is the center position. <b>STARTER ONLY</b> is a spring-loaded hold position that motors the engine without ignition to clear unburned fuel. Starter limits: 30 s ON, 5 min OFF, 30 s ON, 5 min OFF, 30 s ON, then 30 min OFF.</p></div>
      <div class="card"><h3>Auto-ignition</h3><p>Arm the ENG AUTO IGNITION switches in turbulence, precipitation and icing. When armed, if torque falls below about 17%, the igniters fire automatically and IGNITION ON lights. A flamed-out engine relights by itself. Ignition also closes that side's motive flow valve, which stops aux fuel transfer.</p></div>
    </div>
  </section>

  <section class="block" id="pp-lube">
    <h2>Accessories &amp; lubrication <span class="ref">Figures 7-10 to 7-15</span></h2>
    <div class="two-col">
      <div class="prose">
        <p><b>Accessory gearbox.</b> At the rear of the engine, driven from the compressor shaft (N1) through a coupling shaft. It carries the starter/generator, the high-pressure fuel pump and FCU, the N1 tachometer generator and the oil pumps, each pad at its own gear ratio. The propeller tachometer and propeller governors are on the reduction gearbox instead, driven by the power section.</p>
        <p><b>Lubrication.</b> Oil cools and lubricates the bearings. It also supplies the propeller governor and reversing system. The oil tank is part of the compressor inlet case and holds a gear-type pressure pump, the pressure regulator and the filter. Pressure oil passes the pressure and temperature bulbs and goes to the bearing compartments and nose case. Scavenge pumps return it through the thermostatic external oil cooler. The oil-to-fuel heat exchanger uses that heat to keep ice out of the fuel pump filter.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Oil quantity &amp; consumption</h3><p>4 US gal total, including the 2.5 gal tank. The dipstick reads quarts <i>below full</i>. Engines usually settle 1–2 qt down when hot and about 1 qt lower than that when cold. Don't overfill, and don't mix brands or types. Check shortly after shutdown for the most accurate reading. Maximum consumption is 1 qt per 10 hours, and normal can be as low as 1 qt per 50 hours.</p></div>
        <div class="card"><h3>Magnetic chip detector</h3><p>In the bottom of each nose (reduction) gearbox. Metal contamination lights L or R CHIP DETECT. That alone is not a reason to shut down. Watch engine parameters, and if they're abnormal a precautionary shutdown is at the pilot's discretion. Find and correct the cause before the next flight.</p></div>
      </div>
    </div>
  </section>

  <section class="block" id="pp-fuel">
    <h2>Engine fuel system &amp; FCU <span class="ref">Figures 7-16 to 7-19</span></h2>
    <ol class="steps">
      <li><div><h4>Engine-driven boost pump</h4><p>Runs whenever N1 turns and supplies about 30 psi head pressure so the high-pressure pump doesn't cavitate. FUEL PRES LO lights below 10 psi. The standby pump restores pressure above 11 (±2) psi.</p></div></li>
      <li><div><h4>Firewall filter, pressure switch &amp; oil-to-fuel heater</h4><p>Filtered fuel is warmed by engine oil to prevent icing at the pump filter. This is automatic. Below −45 °C OAT an anti-icing additive is required.</p></div></li>
      <li><div><h4>High-pressure pump</h4><p>A gear pump with inlet and outlet filters, delivering up to 1,050 psi depending on N1 and the FCU. A purge line returns a little fuel to the gravity-feed line to keep vapor out of the FCU. If this pump fails, the engine flames out.</p></div></li>
      <li><div><h4>Fuel control unit (FCU)</h4><p>Meters fuel for starting, acceleration and maximum power. It compares N1 with the power lever setting. The condition lever operates the <b>pump unloading valve</b>, which is fully open (cutoff) or fully closed with nothing in between. A minimum-flow adjustment of about 90 pph keeps the engine running at minimum power.</p></div></li>
      <li><div><h4>Minimum pressurizing valve, flow transmitter &amp; flow divider</h4><p>The minimum pressurizing valve opens at about 100 psi so that only a good spray pattern reaches the nozzles. The fuel flow transmitter, between the FCU and flow divider, drives the DC fuel flow gauge in pph × 100. The flow divider feeds the primary nozzles first and adds the secondaries at about 35–40% N1. That staging gives cooler starts and a noticeable N1 surge.</p></div></li>
      <li><div><h4>Manifold purge</h4><p>A tank charged with P3 air through a check valve. At shutdown, when fuel pressure drops, the P3 air blows residual fuel from the flow divider and manifolds into the combustor to burn. The result is a 1–2 s delay before spool-down.</p></div></li>
    </ol>
    <div class="two-col">
      <div class="card"><h3>How the FCU governs N1</h3><p>The power lever, and the condition lever at idle, position a <b>3D cam</b> to select an N1 speed. A <b>flyweight N1 governor</b> is the feedback element. An overspeed drives the cam down and cuts fuel, and an underspeed drives it up and adds fuel, until N1 matches the selection. A <b>P3 bellows</b> sets acceleration and deceleration fuel limits so the engine can't overheat while spooling. The bellows also lets the propeller's fuel topping governor reduce N1 in a propeller overspeed. With the power levers fixed, N1 stays constant in a climb or descent while torque, ITT and fuel flow change.</p></div>
      <div class="callout"><b>Caution</b>Operation with FUEL PRES LO on is limited to 10 hours between overhaul or replacement of the high-pressure pump. Boost pressure lubricates and cools that pump and keeps it from cavitating.</div>
    </div>
  </section>

  <section class="block" id="pp-ctl">
    <h2>Levers, alpha &amp; beta, and the governors <span class="ref">Figures 7-21, 7-22</span></h2>
    <div class="two-col">
      <div class="card"><h3>Power levers</h3><p>Select N1 through the FCU's N1 governor, from idle to takeoff power. Three regions: <b>forward thrust</b>; <b>ground fine</b>, reached by lifting over the IDLE gate, which holds idle N1 while the lever sets blade angle for taxi; and <b>reverse</b>, reached by lifting over the GROUND FINE gate, where the lever sets both N1 and blade angle. Reverse is for use only with the engines running.</p></div>
      <div class="card"><h3>Propeller levers</h3><p>Set governed rpm from 1,450 to 1,700 (HIGH RPM is used for takeoff, landing and reverse). Pull back through the friction detent into the red-and-white striped area to <b>feather</b>, and push forward into the governing range to unfeather. Props feather automatically at shutdown because hub oil pressure is lost. Automatic feathering (autofeather) is also installed.</p></div>
      <div class="card"><h3>Condition levers</h3><p><b>FUEL CUTOFF</b>, <b>LOW IDLE</b> (62% N1 minimum) and <b>HI IDLE</b> (70%), continuously variable in between. They set the idle floor that the power lever works above: 62–104% from low idle, 70–104% from high idle. High idle keeps more airflow through the engine to cool it under generator or air-conditioning load. During starts, keep the lever just out of the LOW IDLE detent so it can come straight back to cutoff.</p></div>
    </div>
    <div class="two-col">
      <div class="prose">
        <p><b>Alpha (constant speed).</b> The power lever controls only the FCU fuel schedule (N1, and so torque). The propeller lever controls Np through the constant speed governor (CSU), which varies blade angle. More power gives more torque at the same Np. Pulling the prop lever back gives lower Np and more torque, with no change in N1, because it's a free turbine.</p>
        <p><b>Beta.</b> At low power the propeller can't reach governed speed and drops onto its flight-idle blade angle. The power lever then sets blade angle directly. The cambox moves the <b>beta valve</b>, and a carbon block and beta ring feed blade position back. The CSU sits fully open in an underspeed and acts only as a pressure source. Ground fine and reverse are deeper beta.</p>
        <p><b>Blade forces.</b> Feathering springs and counterweights push the blades toward high pitch and feather. Governor oil pressure on the servo piston, assisted by centrifugal twisting moment, pushes toward low pitch and reverse. Lose the oil and the propeller feathers.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Four governors</h3><ul class="tight">
          <li><b>N1 governor (in the FCU):</b> holds the gas generator speed selected by the power or condition lever.</li>
          <li><b>Constant speed governor (prop governor):</b> holds Np selected by the prop lever, using a booster pump that supplies oil from 0 psi (feather) to about 400 psi (full reverse) through the transfer sleeve.</li>
          <li><b>Fuel topping (Nf) governor:</b> built into the prop governor. Above the selected Np (about 6–10% on a typical PT6 installation) it bleeds FCU air pressure to cut fuel. In beta it is reset to roughly 5% below the selected speed, so it is the governor limiting Np in reverse.</li>
          <li><b>Hydraulic overspeed governor:</b> a separate unit on its own drive pad, typically set around 104–106% Np. It dumps prop oil if everything else fails. A ground TEST switch resets it below normal speed so it can be checked.</li>
        </ul></div>
        <div class="callout warning"><b>Why the gate</b>In alpha three governors protect the propeller. In beta and reverse only the fuel topping governor does. An overspeed dump while the blades are at negative pitch drives them through zero toward feather, unloading the propeller into a runaway overspeed. Never bring the power levers below flight idle in flight.</div>
      </div>
    </div>
  </section>

    <p class="disclaimer">From the manual's engine limits chart (Figure 7-23). Torque limit applies from 1,000 to 1,700 prop rpm. Below 1,000 rpm, torque is limited to 62%. Cold or low conditions are usually torque-limited. Hot or high conditions are ITT-limited. Whichever limit you reach first sets the power available.</p>
    <div class="two-col">
      <div class="card"><h3>Ground ITT</h3><p>At idle, ITT climbs with generator load, air conditioning (a heavy load on the right engine's N1) and P3 bleed. If ITT approaches the 750 °C idle limit, reduce the loads, then raise N1 with the condition lever. About 70% (HI IDLE) is normally enough. Restore the loads once ITT stays below 750 °C.</p></div>
      <div class="card"><h3>Generator limits</h3><p>On the ground, 75% generator load is the maximum between 62% and 70% N1. In flight, 100% from sea level to 34,000 ft and 95% above. See the POH Generator Limits table.</p></div>
    </div>
  </section>

  <section class="block" id="pp-over">
    <h2>Exceedances &amp; trend monitoring <span class="ref">Figures 7-24 to 7-26</span></h2>
    <div class="two-col">
      <div class="card"><h3>Overtemperature (Figure 7-24)</h3><ul class="tight">
        <li><b>Area A</b> (moderate, short exceedance): find and correct the cause. After a start overtemp, inspect visually through the exhaust duct. Log it.</li>
        <li><b>Area B</b> (longer exceedance): hot section inspection.</li>
        <li><b>Area C</b> (severe): the engine may need to go to overhaul. More than a few seconds here can cause extensive damage.</li>
      </ul><p>Abort any start whose ITT is approaching the starting limit before the needle reaches the line.</p></div>
      <div class="card"><h3>Overtorque (Figure 7-25)</h3><p>Brief transients up to 156% for 20 s need no action. Sustained overtorque means a logbook entry and, in the worse regions, sending the power section to overhaul. Exceeding the torque limit for more than a few minutes can damage the gearbox.</p></div>
      <div class="card"><h3>Trend monitoring</h3><p>PT6 performance is predictable, so the recommended trend program records stabilized cruise data each flying day or every 5 flight hours. After at least 5 minutes stable, record IAS, OAT, altitude, torque, ITT, N1 and fuel flow. Correct the readings and compare them against typical engine values. Steady deviations in ITT, N1 and fuel flow reveal deterioration early.</p></div>
    </div>
  </section>

  <section class="block" id="pv-forces">
    <h2>Pitch-change forces <span class="ref">Figures 7-27, 7-28</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>The governor pump, driven by the Np shaft, raises engine oil to about <b>375 psi</b>. That oil reaches the propeller dome through a <b>transfer gland</b> around the propeller shaft. More oil in the dome moves the dome forward and the blades to <b>lower pitch</b> (higher rpm), and eventually to reverse.</p>
        <p><b>Feathering springs and counterweights</b> push constantly the other way, toward <b>high pitch</b> (lower rpm) and feather. Propeller control is a balance between the two. There are <b>no high-pitch stop locks</b>, so the propeller feathers after every shutdown, and any loss of oil pressure sends it toward feather.</p>
      </div>
      <div class="bus-table-wrap"><table><thead><tr><th>Blade angle (42-in station)</th><th>Meaning</th></tr></thead><tbody>
        <tr><td class="num">79.3°</td><td>Feather</td></tr>
        <tr><td class="num">30–45°</td><td>Typical cruise (governing)</td></tr>
        <tr><td class="num">+12°</td><td>Flight low pitch stop (power levers at IDLE or above, in flight)</td></tr>
        <tr><td class="num">+9°</td><td>PROP PITCH proximity switch, ≈ 9° or less</td></tr>
        <tr><td class="num">+2°</td><td>Ground low pitch stop (on the ground, power levers at IDLE)</td></tr>
        <tr><td class="num">−3°</td><td>Ground fine, zero thrust (at the GROUND FINE gate)</td></tr>
        <tr><td class="num">−14°</td><td>Maximum reverse</td></tr>
      </tbody></table></div>
    </div>
  </section>

  <section class="block" id="pv-gov">
    <h2>Primary governor <span class="ref">Figures 7-30 to 7-34</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Mounted on top of the reduction gearbox, the primary governor turns a variable-pitch propeller into a constant-speed one. <b>Flyweights</b> geared to the propeller shaft are balanced against a <b>speeder spring</b> whose tension the prop lever sets. The flyweights move a free-floating <b>pilot valve</b>, which decides whether oil goes to the dome, stays trapped, or drains to the case.</p>
        <p>The governor makes small corrections constantly, and the pilot notices few of them. If the governor control linkage fails, an external spring on the governor drives it to <b>1,700 rpm</b>.</p>
      </div>
      <div class="bus-table-wrap"><table><thead><tr><th>Condition</th><th>Cause</th><th>Flyweights / pilot valve</th><th>Result</th></tr></thead><tbody>
        <tr><td><span class="chip green">Onspeed</span></td><td>Np = selected</td><td>Centered; valve in the middle</td><td>Oil trapped. Constant pitch and rpm.</td></tr>
        <tr><td><span class="chip amber">Overspeed</span></td><td>Descent or power increase</td><td>Fly out; valve rises</td><td>Oil drains from the dome. Higher pitch, rpm comes back down.</td></tr>
        <tr><td><span class="chip amber">Underspeed</span></td><td>Climb or power reduction</td><td>Droop in; valve drops</td><td>Oil to the dome. Lower pitch, rpm comes back up.</td></tr>
      </tbody></table></div>
    </div>
  </section>

  <section class="block" id="pv-lps">
    <h2>Low pitch stop &amp; the beta valve <span class="ref">Figure 7-35</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>If the governor could keep reducing blade angle, the propeller would become a flat disc. That means huge drag and blanked airflow over the wing and tail. So a <b>hydraulic low pitch stop</b> limits it. On a reversing propeller this stop has to be movable.</p>
        <p>Four <b>flanges</b> on the dome meet four <b>low-pitch stop nuts</b> on four spring-loaded <b>polished rods</b> at about 15°. Below that, the dome drags the rods, the <b>feedback ring</b> and the <b>carbon block</b> forward. That moves the bottom of the <b>reverse lever</b>, which pulls the <b>beta valve</b> forward to cut off oil to the dome. The blades stop at the flight low pitch stop. Pull the beta valve further forward and it <b>dumps</b> dome oil to the gearbox sump. A mechanical stop limits its forward travel.</p>
        <p>Whenever Np is <i>below</i> the selected rpm (a stabilized underspeed), the blades are sitting on the low pitch stop. That stop is the flight stop in the air and the ground stop on the ground.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>The reverse lever</h3><ul class="tight">
          <li><b>Top:</b> reversing linkage from the power lever (cam box and push-pull control) <i>and</i> the ground low pitch stop solenoid.</li>
          <li><b>Middle:</b> the beta valve in the primary governor.</li>
          <li><b>Bottom:</b> the feedback ring, carbon block and polished rods, which report blade angle.</li>
        </ul><p>When the blades are above the flight stop, the feedback ring is fully aft and the beta valve is aft (open), so the governor alone controls pitch. Rearward beta valve travel doesn't affect normal governing.</p></div>
        <div class="callout"><b>Fail-safe</b>The beta valve is spring-loaded to cut off oil and dump the dome if its linkage fails, which drives the blades toward high pitch.</div>
      </div>
    </div>
  </section>

  <section class="block" id="pv-gf">
    <h2>Ground fine &amp; reverse <span class="ref">Figures 7-36, 7-38</span></h2>
    <p class="prose">From IDLE to full forward thrust, the cam box geometry doesn't move the beta valve. Aft of IDLE, the power lever pulls the top of the reverse lever aft. That opens the beta valve, oil flows to the dome, and the blade angle decreases. The dome's forward travel comes back through the polished rods and feedback ring and closes the valve at the angle the lever selected. The lever has effectively moved the low pitch stop. Moving the lever forward pushes the valve fully forward, dumps oil until the feedback re-centers it, and the blade angle rises.</p>
    <ol class="steps">
      <li><div><h4>Flight idle → ground low pitch stop (touchdown)</h4><p>On approach, decreasing airspeed lowers blade angle to hold governor rpm until the beta valve cuts off at +12°. At touchdown the right main gear safety switch energizes the ground low pitch stop solenoids. They pull the reverse lever aft, oil flows, and the blades settle at <b>+2°</b>.</p><button class="show" type="button" data-pvsc="5">Load in the simulator →</button></div></li>
      <li><div><h4>Ground low pitch stop → ground fine gate</h4><p>Lift over the IDLE gate and pull aft. The blades go progressively from +2° to <b>−3°</b> (zero thrust) at the GROUND FINE gate. <b>N1 stays at idle</b> (62–70% per the condition lever). Ground fine is for taxi.</p><button class="show" type="button" data-pvsc="1">Load in the simulator →</button></div></li>
      <li><div><h4>Ground fine gate → full reverse</h4><p>Lift again and pull aft. The blades go from −3° to <b>−14°</b> while N1 rises progressively to a maximum of <b>87 ±1%</b>. The fuel topping governor, reset to 95% of selected rpm, keeps the primary governor in underspeed so the beta valve stays in charge.</p><button class="show" type="button" data-pvsc="2">Load in the simulator →</button></div></li>
    </ol>
    <div class="two-col">
      <div class="card"><h3>PROP PITCH annunciators</h3><p>White L/R PROP PITCH lights show the blade angle has dropped below the flight low pitch stop. The FAA requires an alert any time pitch drops more than 8° below the flight stop without direct pilot action, as happens at touchdown. A magnetic proximity sensor watches the feedback ring (≈ 9° or less).</p></div>
      <div class="callout warning"><b>Caution</b>Don't pull the power levers into GROUND FINE or REVERSE with the propellers feathered, or with the engines shut down. With the blades above the flight stop the beta valve is already aft and open and the feedback ring can't move, so forcing the lever damages the reversing linkage.</div>
    </div>
  </section>

  <section class="block" id="pv-glps">
    <h2>Flight &amp; ground low pitch stops (King Air 350) <span class="ref">Figure 7-40</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>A lower blade angle on the ground gives higher rpm without excess thrust, and keeps the prop above 1,050 rpm out of the resonance range. So each engine has a <b>ground low pitch stop solenoid</b> that acts on the top of the reverse lever, just as the power lever does.</p>
        <ul class="tight">
          <li><b>Energized by</b> the <b>right main landing gear safety switch</b> (on ground). Backup: a power-quadrant switch that closes when <b>either power lever is lifted at the IDLE gate</b>.</li>
          <li><b>Interrupted by</b> a microswitch on each power lever above <b>68–70% N1</b>. As power comes up for takeoff, the blades step from +2° to +12°, and Np dips momentarily under the extra rotational drag. That helps prevent surging.</li>
          <li>Voltage drops from about 28 V to about 14 V 2 s after energizing (resistors), to keep the solenoids cool. Protected by the PROP GOV TEST breaker. A GROUND LOW PITCH STOP TEST switch is provided.</li>
          <li>The stop only matters once the governor is in <b>underspeed</b>. While Np is onspeed, the blades stay above the flight stop no matter what the power levers or solenoid do.</li>
        </ul>
      </div>
      <div class="mw-stack">
        <div class="callout warning"><b>Warning</b>Do not lift the power levers at the IDLE gate in flight. Doing so energizes the ground low pitch stop solenoids. If the governor is in underspeed, the blades drop from +12° to +2°, causing excessive drag and a high sink rate.</div>
        <div class="card"><h3>Resonance &amp; ground ops</h3><p>Keep ground rpm above 1,050 or below 400. 850–900 rpm is the worst, especially with a quartering tailwind. Feathered at idle is acceptable because it's below the resonance range. Avoid long feathered running on the ground, though: without prop blast, exhaust heat builds up around the nacelle, nose avionics and fuselage.</p></div>
      </div>
    </div>
  </section>

  <section class="block" id="pv-prot">
    <h2>Overspeed protection <span class="ref">Figure 7-41</span></h2>
    <div class="two-col">
      <div class="card"><h3>Overspeed governor</h3><p>On the left side of the reduction gearbox, set at about <b>1,768 rpm</b>. It has flyweights and a pilot valve like the primary governor, but it can only <b>drain</b> dome oil, never add it, and the pilot can't select its speed. Because the prop is driven by a free turbine, a primary-governor failure can overspeed it quickly. A tach stabilized near 1,768 means the primary has failed and the overspeed governor is working. For the pre-takeoff check, the PROP GOV TEST switch resets it to about 1,565 rpm. The autofeather dump solenoid (normally closed) sits on its oil line.</p></div>
      <div class="card"><h3>Fuel topping governor (FTG)</h3><p>Part of the primary governor. If neither governor can change blade angle, for example with a frozen hub, the FTG bleeds Py/P3 air in the FCU to cut fuel and power. It limits Np to about <b>106%</b> of selected rpm in the forward range. In GROUND FINE and REVERSE the power lever resets it to about <b>95%</b>, so the primary governor stays in underspeed and the beta valve, not the governor, positions the blades. In those ranges, Np is a function of N1 and power lever position.</p></div>
    </div>
  </section>

  <section class="block" id="pv-ctl">
    <h2>Levers &amp; feathering <span class="ref">Figures 7-42, 7-43</span></h2>
    <div class="two-col">
      <div class="card"><h3>Power levers</h3><p><b>Forward range:</b> select N1 through the FCU. <b>Ground fine:</b> blade angle proportional to aft travel, FTG reset to 95%, N1 unchanged. <b>Reverse:</b> blade angle proportional to aft travel, N1 to sustain reverse power, FTG reset to 95%. Gates at IDLE and GROUND FINE must be lifted over.</p></div>
      <div class="card"><h3>Propeller levers</h3><p>Full forward sets 1,700 rpm. Full aft, ahead of the feather detent, sets 1,450 rpm. A detent at low rpm guards the FEATHER position (red and white stripes). RVS NOT READY lights if the gear is down and the prop levers aren't at HIGH RPM.</p></div>
      <div class="card"><h3>Feathering</h3><p>Prop lever into the feather detent opens the <b>feathering dump valve</b>. Dome oil drains and the springs and counterweights feather the blades. Because the prop and N1 shafts aren't connected, you can feather with the engine at idle without harm. With autofeather not armed, an engine shut down in cruise keeps windmilling onspeed, and in sync, until it is feathered or loses all oil pressure.</p></div>
    </div>
  </section>

  <section class="block" id="pv-af">
    <h2>Autofeather <span class="ref">Figures 7-44 to 7-47</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>The AUTOFEATHER switch (ARM – OFF – TEST) lets a failed engine's propeller feather by itself. It energizes a normally closed dump valve that drains the dome. It is required to be operable for all flights and armed for takeoff, climb and approach.</p>
        <ul class="tight">
          <li><b>Armed</b> when both power levers are above about <b>88% N1</b> (power lever switches) and both torques are above <b>17%</b>. Both green L/R AUTOFEATHER lights come on.</li>
          <li>When one engine's torque drops below <b>17%</b>, the <i>opposite</i> engine's autofeather disarms and its light goes out.</li>
          <li>If it keeps dropping below <b>10%</b>, that engine's dump valve opens and the propeller feathers. Its light goes out too.</li>
          <li>Retarding either power lever below 88%, or the last engine's torque falling below 17%, disarms the whole system.</li>
        </ul>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Autofeather test</h3>
          <ol class="tight">
            <li>Power levers at about <b>22% torque</b>.</li>
            <li>AUTOFEATHER switch: hold to <b>TEST</b>. This bypasses the 88% switches, and both lights come on.</li>
            <li>Retard one power lever. At about 17% the <i>opposite</i> light goes out. At about 10% the prop starts to feather. The light blinks and torque fluctuates as it moves in and out of feather.</li>
            <li>Repeat on the other side, then retard both to IDLE: neither feathers, and both lights go out.</li>
            <li>Arm for takeoff. Then, at LOW IDLE, check manual feathering.</li>
          </ol>
          <button class="show" type="button" data-pvsc="10">Run the test in the simulator →</button>
        </div>
      </div>
    </div>
  </section>

  <section class="block" id="pv-sync">
    <h2>Synchrophaser &amp; synchroscope <span class="ref">Figure 7-48</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>An electronic system, certified for all phases including takeoff and landing, that matches the two propellers' rpm and holds a set blade phase between them to cut beat and cabin noise. It isn't master-slave. It brings the <b>slower</b> prop up to the faster one, by at most about <b>20 rpm</b>, and never lets rpm drop below what the lever selected.</p>
        <p>A magnetic pickup at each spinner bulkhead sends one pulse per revolution to a control box ahead of the pedestal. The box biases coils next to each primary governor's flyweights. Synchronize manually to within 20 rpm, then press the sync button (350). To change rpm with sync on, move both prop levers together. If it won't match, it's at the end of its range.</p>
      </div>
      <div class="card"><h3>Synchroscope</h3><p>A black-and-white cross that spins clockwise when the <b>right</b> propeller is faster, counterclockwise when the <b>left</b> is faster, and stops when they're synchronized. It is to the left of the oil pressure and temperature gauges.</p></div>
    </div>
  </section>
</div>
</template>

<template id="tpl-pneumatics">
<div class="view">
  <header class="chapter-head">
    <div class="eyebrow">Chapter 9</div>
    <h1>Pneumatics</h1>
    <p class="lede">Hot P3 bleed air from both engines meets at a tee in the fuselage and is regulated to 18 psi. That one manifold inflates the deice boots and the door seal, pressurizes the hydraulic fill can and the bleed-air warning tubes, runs the flight hourmeter, and drives an ejector that makes the vacuum for the gyros, the pressurization controller and boot hold-down. Either engine can supply all of it.</p>
    <p class="disclaimer">Study aid built from the King Air 300/350 training manual pneumatics section. It is not an approved document. The POH/AFM governs. The simulator's pressures, timing and response are a teaching model, not performance data.</p>

      <div class="spec"><span class="v">≈ 700 °F</span><span class="k">Bleed air temperature at the engine. It cools to about 70 °F above ambient by the time it reaches the fuselage tee.</span></div>
      <div class="spec"><span class="v">18 ± 1 psi</span><span class="k">Regulated manifold pressure with an engine at 70–80% N1</span></div>
      <div class="spec"><span class="v">21 psi</span><span class="k">Relief valve in the 18 psi regulator, in case the regulator fails</span></div>
      <div class="spec"><span class="v">15 → 6 in Hg</span><span class="k">Ejector vacuum capacity, sea level to 31,000 ft</span></div>
      <div class="spec"><span class="v">4.3–5.9 in Hg</span><span class="k">Regulated vacuum. Expect about 5.9 (+0, −0.2) at sea level, even on one engine at 70–80% N1.</span></div>

    <p class="prose">The schematic follows Figure 9-1, with the same colors: <b>blue</b> for high-pressure bleed air, <b>green</b> for regulated 18 psi air and <b>yellow</b> for vacuum. Moving lines and arrows show where air is going. Vacuum arrows point toward the ejector, because that's the way the air moves. Start or stop the engines, move the BLEED AIR VALVE switches, take off, cycle the boots, or break a bleed line. Select any component for its description.</p>

  <section class="block" id="pn-source">
    <h2>Pneumatic air source <span class="ref">Figures 9-1, 9-2</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>High-pressure <b>P3 bleed air</b>, 90 to 120 psi, is taken from each engine compressor. The manual places the tap at the fourth stage, at up to about 700 °F. It goes through a normally-open, firewall-mounted <b>pneumatic air valve</b> and into the fuselage, where the two lines meet at a <b>tee</b>. The plumbing sheds heat on the way, so the air is only about 70 °F above ambient at the tee.</p>
        <p>A <b>check valve</b> in each engine's line stops reverse flow. With one engine inoperative, the good engine's air can't escape back through the dead engine's line. Normally one engine supplies enough air for every pneumatic and vacuum user.</p>
        <p>Downstream of the tee, the air passes through the <b>18 psi pressure regulator</b> under the right seat deck, just forward of the main spar. It has a built-in <b>relief valve</b> set at <b>21 psi</b> in case the regulator fails. With an engine at 70–80% N1 it gives 18 ± 1 psi.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Pneumatic pressure gage</h3><p>On the copilot's right subpanel. It reads the pressure available to the pneumatic manifold, in psi. The green arc runs from 10 to just below 20 psi, with a red line at 20.</p></div>
        <div class="card"><h3>Also tapped off the high-pressure line</h3><p>The <b>window defogging regulator</b>, upstream of the 18 psi regulator, and each side's <b>brake deice valve</b>, between that engine's pneumatic air valve and its check valve. Rudder boost pressure transducers are on the King Air 300 only.</p></div>
      </div>
    </div>
  </section>

  <section class="block" id="pn-vac">
    <h2>Vacuum air source <span class="ref">Figures 9-1, 9-3</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>There's no vacuum pump. Regulated air flows through an <b>ejector</b>, a pressure line that narrows into a venturi and then exhausts overboard. The vacuum line is attached at the narrowest point, where pressure is lowest, so the moving air pulls air out of the vacuum line.</p>
        <p>The ejector can make about <b>15 in Hg</b> at sea level, falling to about <b>6 in Hg</b> at 31,000 ft. It supplies vacuum, regulated to 4.3–5.9 in Hg, to:</p>
        <ul class="tight">
          <li>the <b>air-driven gyro instruments</b>, through a vacuum regulator in the nose compartment on the left side of the pressure bulkhead. The regulator has a foam filter, and another filter in the nose gives the gyros a clean, sheltered air source.</li>
          <li>the <b>pressurization controller</b>, outflow valve and safety valve.</li>
          <li>the <b>deice distributor valve</b>, which uses vacuum to hold the boots down (deflated) between cycles.</li>
        </ul>
      </div>
      <div class="card"><h3>Gyro suction gage</h3><p>To the left of the pneumatic pressure gage, calibrated in inches of mercury. Even with only one engine at 70–80% N1, it should read about <b>5.9 (+0, −0.2) in Hg</b> at sea level.</p></div>
    </div>
  </section>

  <section class="block" id="pn-ctl">
    <h2>Bleed air control <span class="ref">Figure 9-4</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Two <b>BLEED AIR VALVE</b> switches, one per engine, control the bleed air that enters the cabin for pressurization and environmental use and the pneumatic air. Each has three positions:</p>
      </div>
      <div class="bus-table-wrap"><table><thead><tr><th>Switch position</th><th>Environmental flow control valve</th><th>Pneumatic (instrument) air valve</th></tr></thead><tbody>
        <tr><td><b>OPEN</b></td><td>Open</td><td>Open</td></tr>
        <tr><td><b>ENVIR OFF</b></td><td>Closed</td><td>Open</td></tr>
        <tr><td><b>PNEU &amp; ENVIR OFF</b></td><td>Closed</td><td>Closed, so bleed air stops at the firewall</td></tr>
      </tbody></table></div>
    </div>
    <p class="disclaimer">The Master Warning chapter lists L/R BL AIR OFF as a caution for a bleed air valve switch that isn't OPEN. The simulator shows it that way.</p>
  </section>

  <section class="block" id="pn-warn">
    <h2>Engine bleed air warning <span class="ref">Figures 9-5, 9-6</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>A ruptured bleed line can quickly heat-damage the skin and structure around it. To catch that, <b>ethylene vinyl acetate (EVA) plastic tubes</b> run next to the environmental and pneumatic bleed lines from each engine to the cabin. The tubes are pressurized with 18 psi air tapped off the manifold through an orifice.</p>
        <p>Heat from a ruptured line melts the tubing, the air escapes, and tube pressure falls. Below <b>2 psi</b> a normally-closed pressure switch under the cockpit floor (one per side) closes and lights that side's <b>BLEED FAIL</b> warning.</p>
        <p>Then turn off all bleed air on that side: BLEED AIR VALVE switch to <b>PNEU &amp; ENVIR OFF</b>. Both shutoff valves close and bleed air stops at the engine firewall. <b>The BLEED FAIL light stays on</b>, because the tube is still melted.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Why both lights are on before start</h3><p>The tubes are fed from the manifold, so with no engine running they have no pressure and both switches close. The lights go out once an engine builds manifold pressure. That also means one engine keeps both sides' tubes pressurized. In the simulator, the same thing happens if both sides are shut off.</p>
          <button class="show" type="button" data-pnsc="1">Watch it during engine start →</button></div>
        <div class="card"><h3>Caution: emergency exits</h3><p>Take care removing or installing the emergency exits so you don't damage the bleed air lines, and make sure they're properly reconnected when the hatches go back in.</p>
          <button class="show" type="button" data-pnsc="6">Run a bleed line rupture →</button></div>
      </div>
    </div>
  </section>

  <section class="block" id="pn-users">
    <h2>What uses the pneumatic air <span class="ref">Figure 9-1</span></h2>
    <div class="comp-grid">
      <div class="comp-card"><h4>Surface deice boots</h4><p>Regulated air through the deice distributor valve inflates the boots. Between cycles the distributor connects the boots to vacuum, which holds them down. See Ice and Rain Protection for the controls.</p><button class="show" type="button" data-pnsc="5">Cycle the boots →</button></div>
      <div class="comp-card"><h4>Cabin door seal</h4><p>Manifold air goes through a 4 psi regulator to a normally-open valve controlled by the <b>left</b> landing gear safety switch, which holds it closed on the ground. At liftoff the switch changes, the valve opens and the seal inflates.</p><button class="show" type="button" data-pnsc="3">Take off →</button></div>
      <div class="comp-card"><h4>Hydraulic fill can</h4><p>Pneumatic pressure in the landing gear hydraulic fill can keeps the fluid from vaporizing and gives the hydraulic pump a positive feed. After shutdown it bleeds off through a small orifice.</p></div>
      <div class="comp-card"><h4>Flight hourmeter</h4><p>A valve controlled by the <b>right</b> landing gear safety switch (normally closed, open in flight) sends air to a pressure switch that runs the flight hourmeter, so it only counts time in the air.</p></div>
      <div class="comp-card"><h4>Bleed air warning tubes</h4><p>Pressurized from the manifold through two orifices. A melted tube lights that side's BLEED FAIL.</p></div>
      <div class="comp-card"><h4>Window defog</h4><p>Bleed air from a separate regulator under the floor goes to the cockpit side windows (all 300s and 350s) and, where installed, the cabin windows (optional on the 350). It works whenever either engine is running. Warm, dry air goes to the inside surface of each window.</p></div>
      <div class="comp-card"><h4>Brake deice</h4><p>Each side's normally-closed brake deice valve takes hot high-pressure bleed air from that engine's line to the brakes. See Ice and Rain Protection and Landing Gear for its operation.</p></div>
      <div class="comp-card"><h4>Rudder boost (300 only)</h4><p>On the King Air 300, pressure transducers in each engine's bleed line feed the rudder boost system. The 350 doesn't use them.</p></div>
    </div>
  </section>
</div>

    <h1>Fire Protection</h1>
    <p class="lede">Each engine compartment has its own fire detection and fire-extinguishing system. Detection is automatic: a gas-filled sensor tube loops around the engine and lights a red ENG FIRE lens when it overheats. Extinguishing is manual: close that side's firewall fuel valve, then fire that side's one-shot bottle.</p>

  <section class="block" id="fp-det">
    <h2>Engine fire detection <span class="ref">Figures 8-1, 8-2</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>The main element is a <b>temperature-sensing tube</b> looped continuously around the engine. It ends at a <b>responder unit</b> in the accessory area, at about the ten o'clock position. The tube is a hermetically sealed stainless-steel outer tube filled with an inert gas, around a hydride core filled with an active gas.</p>
        <p>The responder has two sets of contacts:</p>
        <ul class="tight">
          <li><b>Integrity switch</b> (normally closed). Normal gas pressure in the tube holds it closed. It's used by the detection test, so a tube that has lost its gas fails the test.</li>
          <li><b>Alarm switch</b> (normally open). As the tube heats, its gases expand. At a factory-preset pressure the alarm contacts close and send a signal to the <b>printed circuit board</b>, which is forward of the main spar under the center aisle floor.</li>
        </ul>
        <p>The board lights the red <b>L</b> or <b>R ENG FIRE</b> lens in that side's firewall fuel valve pushbutton. ENG FIRE also triggers the <b>MASTER WARNING</b> flasher.</p>
      </div>
      <div class="mw-stack">
        <div class="bus-table-wrap"><table><thead><tr><th>Alarm when…</th><th>Temperature</th></tr></thead><tbody>
          <tr><td>Any one-foot section of tube</td><td>800 °F</td></tr>
          <tr><td>Average of the entire tube</td><td>360 °F</td></tr>
          <tr><td>Accessory compartment</td><td>545 °F</td></tr>
          <tr><td>Hot section compartment</td><td>540 °F</td></tr>
          <tr><td>Plenum chamber (2 ft of tube, not a fire or overheat zone)</td><td>≈ 900 °F</td></tr>
        </tbody></table></div>
        <div class="card"><h3>Firewall fuel valve pushbutton</h3><p>A split-lens pushbutton on the glareshield. The top lens is the red <b>ENG FIRE</b> warning. The bottom lens is <b>FW VALVE CLOSED</b>, which shows the firewall fuel valve's position when the battery switch is on:</p>
          <ul class="tight"><li><b>Off:</b> valve open.</li><li><b>Steady:</b> valve closed.</li><li><b>Flashing:</b> valve position disagrees with the pushbutton (in transit or failed).</li></ul></div>
      </div>
    </div>
  </section>

  <section class="block" id="fp-dtest">
    <h2>Fire detection test</h2>
    <div class="two-col">
      <div class="prose">
        <p>Two three-position, center-off toggle switches on the copilot's left subpanel, placarded <b>ENG FIRE TEST · DET – OFF – EXT · LEFT – RIGHT</b>.</p>
        <p>In <b>DET</b>, current flows from that side's 5-amp <b>FIRE DET</b> circuit breaker (right circuit-breaker panel) through the detector circuitry and lights the red ENG FIRE lens in that side's firewall fuel valve pushbutton.</p>
        <p>If the lens doesn't light, something is wrong with the sensor tube, the responder, the annunciator or the wiring. <b>Fix it before flight.</b></p>
      </div>
      <div class="card"><h3>Try it</h3><p>In the cockpit controls above, hold LEFT to DET: the L ENG FIRE lens lights and MASTER WARNING flashes. Then select the "L sensor tube lost its gas" failure and test again. The light stays out.</p>
        <button class="show" type="button" data-fpgo="fp-panel">Go to the cockpit controls →</button></div>
    </div>
  </section>

  <section class="block" id="fp-ext">
    <h2>Engine fire extinguishing <span class="ref">Figure 8-3</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>A <b>fire extinguisher supply container</b> is mounted on brackets aft of the main spar in each main landing gear wheel well. Each holds <b>2.50 lb of bromotrifluoromethane (CBrF3)</b>, pressurized to 450–475 psi at 72 °F. It has a <b>pressure gage</b> and a <b>pyrotechnic cartridge</b>, which fires to release the agent.</p>
        <p>The line runs along the side of the nacelle and branches into <b>eight spray tubes</b>: four discharge into the engine exhaust area, four into the accessory area. Once fired, the whole bottle empties into that engine.</p>
        <p>The <b>fire extinguisher pushbuttons</b> are on the glareshield at each end of the warning annunciator panel. Power comes from a 5-amp <b>LEFT</b> or <b>RIGHT ENGINE FIRE EXT</b> circuit breaker on the <b>hot battery bus</b>. The circuit goes to the <b>firewall fuel valve pushbutton first</b>. That valve must be <b>closed</b> to complete the circuit to the extinguisher pushbutton. Once the circuit is complete, the bottle can be fired <b>whatever the battery switch position</b>.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Extinguisher pushbutton lights</h3>
          <ul class="tight">
            <li><b>EXTINGUISHER PUSH</b> (red, upper half): the firing circuit is complete. You see it once that side's firewall valve is closed.</li>
            <li><b>DISCHARGED</b> (amber, lower half): a sensor watches the pyrotechnic cartridge. When the cartridge fires and breaks the sensor circuit, DISCHARGED lights and <b>stays on until the cartridge is replaced</b>, regardless of the battery switch or firewall valve.</li>
          </ul></div>
        <div class="card"><h3>Fire sequence</h3><ol class="tight"><li>ENG FIRE lens lights and MASTER WARNING flashes.</li><li>Shut down the engine and push that side's <b>firewall fuel valve</b> pushbutton (FW VALVE CLOSED lights).</li><li>EXTINGUISHER PUSH lights. Push it to fire the bottle, and DISCHARGED lights.</li></ol><p class="disclaimer">Follow the AFM emergency checklist for the actual procedure.</p>
          <button class="show" type="button" data-fpfire="L">Practice a left engine fire →</button></div>
      </div>
    </div>
  </section>

    <div class="two-col">
      <div class="prose">
        <p>The same ENG FIRE TEST switches, in the <b>EXT</b> position. Current flows from the 5-amp hot battery bus circuit breaker through the EXT test switch, the EXTINGUISHER PUSH annunciator and the cartridge on the container to ground. <b>EXTINGUISHER PUSH</b> lighting proves the cartridge circuit is good.</p>
        <p>At the same time the EXT switch breaks the cartridge sensor circuit, so <b>DISCHARGED</b> should also light. That proves the cartridge sensor works.</p>
        <p>If either light fails on a side, that side's extinguisher system has a fault. <b>Fix it before flight.</b></p>
      </div>
      <div class="card"><h3>Try it</h3><p>Hold RIGHT to EXT: both halves of the right extinguisher pushbutton light. It works with the battery switch off too, because the power comes from the hot battery bus. Then select "R cartridge sensor fault" and test again.</p>

  <section class="block" id="ic-ofh">
    <h2>Oil-to-fuel heat exchanger <span class="ref">Figure 10-19</span></h2>
    <p class="prose">Mounted on each engine's accessory section, it protects the fuel control unit from ice. Hot engine oil and the fuel pass side by side through the <b>heat exchanger core</b>, and heat moves by conduction into the fuel, melting any ice particles. It works automatically whenever the engine runs. A <b>thermal element</b> in the fuel outlet positions a <b>slide valve</b> in the oil path. Switch between cold and warm fuel to see the valve move, and select any part.</p>
    <div class="sim near">
      <div class="diagram-card">
        <div class="dtabs">
          <div class="seg" role="group" aria-label="Fuel temperature" id="ofhMode">
            <button type="button" data-ofh="cold" aria-pressed="true">Cold fuel: oil through core</button>
            <button type="button" data-ofh="warm" aria-pressed="false">Warm fuel: oil bypasses core</button>
          </div>
          <div class="seg" role="group" aria-label="Engine">
            <button type="button" id="ofhRun" aria-pressed="true">Engine running</button>
          </div>
        </div>
        <div class="svg-wrap"><svg id="ofhschem" viewBox="0 0 1000 600" role="img" aria-label="Oil-to-fuel heat exchanger"></svg></div>
        <div class="legend">
          <span><i style="background:#e2342a"></i>Fuel</span>
          <span><i style="background:#2a73c4"></i>Hot engine oil</span>
          <span><i style="background:#ee7d1f"></i>Heat transfer (conduction)</span>
        </div>

      <div class="side"><div class="card info" id="ofhInfo" aria-live="polite"></div></div>
    </div>
    <p class="disclaimer">The manual names the thermal element and slide valve but doesn't describe the bypass in detail. The cold and warm behavior shown follows the Powerplant chapter's description: the exchanger holds a desired fuel temperature at the pump inlet. A minimum oil temperature of 55 °C is recommended for oil-to-fuel heater operation at takeoff power. See the Fuel section of the POH for the heat exchanger temperature limits.</p>
  </section>

  <section class="block" id="ic-eng">
    <h2>Engine protection <span class="ref">Figures 10-6 to 10-11</span></h2>
    <div class="two-col">
      <div class="prose">
        <p><b>Inlet lip heat.</b> A scoop in each engine's left exhaust stack sends some hot exhaust into the hollow lip tube around the cowling inlet. It leaves through a line into the right exhaust stack. It works whenever the engine runs, with no switch.</p>
        <p><b>Inertial separators (ice vanes).</b> Two movable vanes, forward and aft. Normally retracted. With ENGINE ANTI-ICE <b>ON</b>, the forward vane drops to form a venturi with a sudden turn into the intake, and the aft vane opens the bypass duct. Heavier ice, dust and sand particles carry straight on and go overboard. The air makes the turn and enters through the inlet screen. There are only two positions. Expect a small torque loss and ITT rise while extended.</p>
        <p>The vanes are driven by electric actuators. <b>ACTUATORS MAIN</b> motors run on the triple-fed bus, <b>STANDBY</b> on each side's generator bus. Otherwise they're identical. L/R <b>ENG ANTI-ICE</b> (green) means extended. L/R <b>ENG ICE FAIL</b> (yellow) means the vane doesn't match its switch after <b>35 s</b>, or immediately if the motor has lost power. Either way, select the other actuator.</p>
        <p><b>Auto-ignition.</b> Lever-lock ARM/OFF switches above the ice vane switches. When armed, torque below about <b>17%</b> powers the igniters and lights green <b>IGNITION ON</b>, so a flameout relights automatically. Arm it for turbulence, icing and precipitation. Leave it off on the ground to save igniter life.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Vane rules (King Air 350)</h3><ul class="tight"><li>Extend whenever there's visible moisture at +5 °C or colder.</li><li>Retract for takeoff above +10 °C.</li><li>In flight, extend and watch the annunciators whenever you can't be sure of staying out of visible moisture at +5 °C or below.</li></ul>
          <button class="show" type="button" data-icset="1">Climb into icing →</button></div>
      </div>
    </div>
  </section>

  <section class="block" id="ic-ws">
    <h2>Windshield anti-ice &amp; wipers <span class="ref">Figures 10-12 to 10-16</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Each windshield has three layers: a thick structural glass inner panel, a polyvinyl middle layer carrying the heating grid, and a bonded outer glass layer with a static-discharge <b>NESA</b> coating. Pilot and copilot sides have independent switches: <b>NORMAL</b> (up), OFF, or <b>HIGH</b> (down, lever-locked).</p>
        <ul class="tight">
          <li><b>NORMAL</b> heats the secondary area, almost the whole windshield.</li>
          <li><b>HIGH</b> heats the smaller primary area, the <b>outboard two-thirds</b>, which warms faster.</li>
          <li>Either way, a sensor in the glass and a controller hold <b>90–110 °F</b>.</li>
        </ul>
        <p>Power: 50 A circuit breakers in the power distribution panel under the aisle floor. Control: 5 A breakers on the copilot's panel. Turn it on <b>before</b> entering icing. It can also help defrost. Expect erratic magnetic compass readings with it on. Above <b>226 KIAS</b> it can't keep the glass clear, so slow down if the windshield ices.</p>
        <p><b>Wipers:</b> one motor drives both. PARK, OFF, SLOW and FAST on the overhead panel. Never run them on a dry windshield, which can scratch the NESA coating.</p>
      </div>
      <div class="card"><h3>Try it</h3><p>Load the icing-cruise setup and select HIGH on one side. The inboard third of that windshield starts to ice. Then push airspeed past 226 KIAS.</p><button class="show" type="button" data-icset="2">Icing cruise, all on →</button></div>
    </div>
  </section>

  <section class="block" id="ic-prop">
    <h2>Propeller deice <span class="ref">Figures 10-17, 10-18</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>An electrically heated boot on each blade, slip rings, brush assemblies, a timer, two switches (AUTO and MANUAL) and an ammeter. Heat loosens the ice, then centrifugal force and the airstream throw it off.</p>
        <p><b>AUTO:</b> the timer heats all boots on one propeller for <b>90 s</b>, then all boots on the other for 90 s, and repeats every <b>3 minutes</b> until turned off. The ammeter normally shows <b>26–32 A</b>, with a slight flick as it changes phase. Too much current trips the circuit-breaker switch. When it's turned off, the timer moves on to the start of the other propeller's phase, so it may restart on either one.</p>
        <p><b>MANUAL</b> is a momentary backup. Hold it to power all boots on both props until the ice is gone. The prop ammeter shows nothing, but the loadmeters rise about 10%.</p>
      </div>
      <div class="card"><h3>Caution</h3><p>Never run prop deice with the propellers static. The slip rings pit and burn.</p></div>
    </div>
  </section>

  <section class="block" id="ic-surf">
    <h2>Surface deice <span class="ref">Figures 10-22 to 10-26</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Pneumatic boots on each wing (inboard and outboard) and on each side of the horizontal stabilizer. The vertical stabilizer has none and doesn't need any. Regulated bleed air inflates them through the deice distributor valve, and vacuum pulls them flat and holds them down between cycles. See Pneumatics.</p>
        <p>SURFACE DEICE switch: SINGLE, OFF, MANUAL, spring-loaded to OFF.</p>
        <ul class="tight">
          <li><b>SINGLE:</b> wing boots inflate for about <b>6 s</b>, then deflate as the tail boots inflate for about <b>4 s</b>, about 10 s in all.</li>
          <li><b>MANUAL:</b> all boots inflate together for as long as the switch is held.</li>
        </ul>
        <p>The distributor needs electrical power (SURF DEICE breaker, triple-fed bus). Without it, vacuum just holds the boots down. Green <b>WING DEICE</b> lights when both wing pressure switches see 14–15 psi, and green <b>TAIL DEICE</b> when the tail switch does.</p>
      </div>
      <div class="card"><h3>When to cycle</h3><p>Let <b>½ in to 1 in</b> of ice build first. Very thin ice can crack and cling, then later cycles build a shell outside the inflated boot. Over 1 in may be impossible to remove. In the simulator, cycle too early or too late and see what the log says.</p></div>
    </div>
  </section>

  <section class="block" id="ic-heat">
    <h2>Fuel vent, pitot &amp; stall warning heat <span class="ref">Figures 10-19 to 10-21</span></h2>
    <div class="comp-grid">
      <div class="comp-card"><h4>Fuel vent heat</h4><p>One electrically heated vent in each wing. L and R FUEL VENT switches (right subpanel), powered by the left and right generator buses. On whenever ice is expected or found.</p></div>
      <div class="comp-card"><h4>Pitot heat</h4><p>Two heated masts on the nose. PITOT LEFT and RIGHT circuit-breaker switches, up for on. Left from the triple-fed bus, right from the right generator bus. On for takeoff and in icing. Only briefly on the ground. A slow loss of indicated airspeed at altitude may be pitot ice. If heat restores it, leave it on.</p></div>
      <div class="comp-card"><h4>Stall warning heat</h4><p>Heats the lift transducer vane and plate on the left wing. STALL WARN switch on the right subpanel, powered by the right generator bus. On the ground, the left gear safety switch limits it to about 14 V to prevent overheating. It gets the full 28 V in flight. With ice on the wing, stall speed rises and the warning can't be trusted.</p></div>
    </div>
  </section>

  <section class="block" id="ic-prec">
    <h2>Precautions during icing <span class="ref">p. 10-25</span></h2>
    <div class="two-col">
      <ul class="tight">
        <li>Remove all frost from wing, stabilizer and propeller leading edges, the windshield, control surfaces, hinges, pitot masts, fuel caps and vents before moving the airplane. The texture of frost, not its thickness, is what spoils the airflow.</li>
        <li>Check fuel drains for free flow, take a good-sized sample, and use only the correct amount of anti-icing additive.</li>
        <li>Turn the propellers by hand in their normal direction before start. Check the hubs for ice and snow.</li>
        <li>Leave auto-ignition off until just before takeoff.</li>
      </ul>
      <ul class="tight">
        <li>In icing: fuel vent heat, pitot heat, prop deice, windshield heat and stall warning heat all <b>ON</b>.</li>
        <li>Keep at least 140 KIAS to avoid ice under the wing. Slow below 226 KIAS if the windshield ices.</li>
        <li>Stall speeds rise as ice builds, and stall warning devices become unreliable. Keep a comfortable margin.</li>
        <li>Ice on even the best-equipped airplane degrades performance and upsets time and fuel planning.</li>
      </ul>
    </div>
  </section>
</div>

    <h2>Bleed air &amp; flow control <span class="ref">Figures 11-5, 11-6, 11-18</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>P3 bleed air from each engine goes to a <b>flow control unit</b> on the firewall. There it mixes with <b>ambient air</b> from the cowling intake. The mixture runs aft through the firewall along the inboard nacelle, then inboard along the center wing ahead of the main spar. One engine's bleed air is enough for pressurization, heat, pneumatics and vacuum.</p>
        <p>The <b>ambient air valve</b> in each flow control unit is <b>closed on the ground</b> (left squat switch), so undiluted P3 air warms a cold cabin faster. In flight above about <b>50 °F</b> ambient, it opens and adds ambient air, increasing flow.</p>
        <p><b>ENVIR BLEED AIR — NORMAL / LOW.</b> LOW cuts environmental bleed flow by about <b>50%</b>. Use LOW for takeoff above <b>+10 °C</b>, and for maximum cooling in pressurized flight. NORMAL gives more heat or more pressurization flow.</p>
      </div>

  <section class="block" id="ac-temp">
    <h2>Temperature control <span class="ref">Figures 11-7 to 11-10</span></h2>

      <div class="prose">
        <p>Environmental air passes an <b>air-to-air heat exchanger</b> in each center wing. Ram air from a leading-edge scoop cools its fins and goes overboard through louvers under the wing. A motor-driven <b>bypass valve</b> on each side sends the air <i>through</i> the exchanger (cooler) or <i>around</i> it (keeps its heat).</p>
        <ul class="tight">
          <li><b>AUTO:</b> the CABIN TEMP knob, a duct sensor and a cabin sensor (headliner, second window) feed a controller that drives the bypass valves <b>one at a time</b>. When the <b>left</b> valve reaches full cold, the air conditioner comes on (right engine above 62% N1). It goes off when that valve opens more than <b>30°</b> toward heat.</li>
          <li><b>MAN HEAT / MAN COOL:</b> hold MANUAL TEMP INCR or DECR. It springs back to center. Allow about <b>30 s per valve</b>, one minute in all, full travel. In MAN COOL the air conditioner runs if the left valve is within 30° of full cold.</li>
          <li><b>OFF:</b> no automatic control and no air conditioning. With VENT BLOWER at AUTO, the forward blower stops.</li>
        </ul>
      </div>
      <div class="card"><h3>Maximum cooling</h3><ol class="tight"><li>CABIN TEMP MODE to AUTO, CABIN TEMP fully counterclockwise.</li><li>VENT BLOWER HIGH, AFT BLOWER on.</li><li>On the ground or unpressurized: BLEED AIR VALVES to ENVIR OFF.</li><li>Pressurized: bleed valves OPEN, ENVIR BLEED AIR to LOW.</li></ol>
        <button class="show" type="button" data-acset="0">Hot day on the ground →</button></div>
    </div>
  </section>

  <section class="block" id="ac-dist">
    <h2>Distribution <span class="ref">Figures 11-13 to 11-17, 11-20 to 11-23</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Air from both wings meets at a <b>cross junction</b> in the center fuselage. It runs forward through a <b>muffler</b> (right side, under the floor, forward of the spar) into the <b>mixing plenum</b> under the copilot's floor. A partition splits the plenum:</p>
        <ul class="tight">
          <li><b>Floor and defrost section:</b> warm environmental air plus recirculated air goes to the floor outlets, which are always the warmest.</li>
          <li><b>Headliner section:</b> recirculated air from the vent blower and forward evaporator (cooled when the air conditioner runs) goes to the overhead eyeball outlets, which are always cooler.</li>
        </ul>
        <p>Some warm air is tapped up to the <b>defrost/pilot/copilot heat duct</b> under the panel. <b>AFT HEAT</b> opens a valve that sends environmental air from the cross junction straight to the aft floor outlets.</p>
      </div>
      <div class="mw-stack">
        <div class="card"><h3>Subpanel air knobs</h3><ul class="tight"><li><b>DEFROST AIR:</b> butterfly valve feeding the windshields and glareshield eyeballs.</li><li><b>PILOT AIR / COPILOT AIR:</b> dampers for air to the crew's feet.</li><li><b>CABIN AIR:</b> pulled to the stop passes only about 50% to the cabin floor outlets, sending more to the cockpit. Pushed in sends most to the cabin.</li></ul><p>Full out gives the cockpit the most air. Full in gives the cabin the most.</p></div>
        <div class="card"><h3>Eyeball outlets</h3><p>Adjust them in preflight. Fully open for short, low, summer flights. Closed for high-altitude, night or cold-weather flights, for the most cabin heat.</p></div>
      </div>
    </div>
  </section>

  <section class="block" id="ac-vent">
    <h2>Blowers &amp; unpressurized ventilation <span class="ref">Figures 11-11, 11-12, 11-16</span></h2>
    <div class="two-col">
      <div class="prose">
        <p><b>VENT BLOWER — HI / LO / AUTO</b> (forward blower).</p>
        <ul class="tight">
          <li><b>HI:</b> always high speed.</li>
          <li><b>LO:</b> always low speed, even with CABIN TEMP MODE OFF.</li>
          <li><b>AUTO:</b> low speed in any mode except OFF. Off when the mode is OFF.</li>
        </ul>
        <p>If it fails, the duct design still circulates some air.</p>
        <p><b>AFT BLOWER</b>, under the aisle just ahead of the airstair door, is one speed and independent of everything else. It recirculates cabin air, through the aft evaporator, to the aft floor and overhead outlets and the baggage area. It spreads aft electric heat or aft evaporator cooling.</p>
      </div>
      <div class="card"><h3>Fresh air when unpressurized</h3><p>Bleed air is the fresh-air source in both modes. Unpressurized, a second source opens: the <b>ram air (evaporator) door</b> in the nose. Pressurized, spring tension, a solenoid magnet and cabin pressure hold it shut. Unpressurized in flight, ram air pushes it open, and it may stay open until landing unless you repressurize. The ambient air mixes with recirculated air, goes through the vent blower and forward evaporator, and into the plenum.</p>
        <button class="show" type="button" data-acset="4">Unpressurized ventilation →</button></div>
    </div>
  </section>

  <section class="block" id="ac-elec">
    <h2>Electric heat <span class="ref">Figures 11-25, 11-26</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Forward and aft electric heat elements add to bleed air heat <b>on the ground only</b>. Taking weight off the right main squat switch removes control power. ELEC HEAT works only with CABIN TEMP MODE in <b>AUTO or MAN HEAT</b>, separate from the bypass valves.</p>
        <p>The aft element only comes on with the <b>AFT BLOWER</b> on, which doubles the output. Both together draw about <b>200 A</b>, so use a ground power unit to preheat before engine start. It's available with external power or at least one generator on.</p>
        <p>Overtemperature thermistors just upstream of the elements cut power if a duct overheats, for example after a blower failure. The solenoid-held switch then springs OFF. Run the blowers for 15 s after turning ELEC HEAT off.</p>
      </div>
      <div class="card"><h3>Try it</h3><p>Preheat a cold cabin from a ground power unit, then turn the aft blower off and watch the aft element drop out.</p><button class="show" type="button" data-acset="1">Cold-morning preheat →</button></div>
    </div>
  </section>

  <section class="block" id="ac-cool">
    <h2>Air conditioner (cooling system) <span class="ref">Figures 11-27 to 11-30</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Below about 50 °F outside, bleed air alone normally keeps the cabin comfortable. Above that, the freon system adds cooling. It has:</p>
        <ul class="tight">
          <li>a belt-driven <b>compressor on the right engine</b> accessory pad</li>
          <li>refrigerant lines through the right wing leading edge and forward to the nose</li>
          <li>the <b>condenser</b> and <b>condenser blower</b>, receiver/dryer and expansion valve in the nose</li>
          <li>the <b>forward evaporator</b>, and an optional aft one</li>
        </ul>
        <p>The condenser blower runs only on the ground and stops when the nose gear is up, when ram air through the nose inlet takes over. Refrigerant flows through the aft evaporator whenever it flows through the forward one, but the aft evaporator only cools when the aft blower runs. A 33 °F switch on the forward evaporator controls a hot-gas valve that prevents icing.</p>
        <p>The compressor is <b>locked out</b> if refrigerant pressure is too high or too low, ambient is below about 50 °F, or the right engine is below about <b>62% N1</b>. Pressurized air from the floor registers is always warmer than the overhead outlets.</p>
      </div>
      <div class="card"><h3>AIR COND N1 LOW</h3><p>White advisory on the 350. Air conditioning is requested but the right engine is too slow, so the compressor clutch is disconnected. Set the right condition lever to hold <b>62–64% N1</b>.</p><button class="show" type="button" data-acset="5">See it at low idle →</button></div>
    </div>
  </section>

  <section class="block" id="ac-abn">
    <h2>Abnormal indications <span class="ref">Figures 11-24, 11-31</span></h2>
    <div class="comp-grid">
      <div class="comp-card"><h4>DUCT OVERTEMP (yellow)</h4><p>Environmental air above about <b>300 °F</b> at a sensor about a foot downstream of the mixing plenum in the floor duct. The usual cause has been a restricted duct, such as CABIN AIR pulled most of the way out, combined with a sudden power increase like takeoff. See the POH.</p><button class="show" type="button" data-acset="3">Reproduce it →</button></div>
      <div class="comp-card"><h4>BLEED AIR FAIL</h4><p>A leak in environmental or pneumatic bleed air. Set that BLEED AIR VALVE switch to PNEU &amp; ENVIR OFF. See Pneumatics.</p></div>
      <div class="comp-card"><h4>Electric heat overheat</h4><p>The thermistors should shut it off. If they fail, you may smell or see it, or get DUCT OVERTEMP. Turn ELEC HEAT off. If the switch won't stay up, check the CABIN TEMP breaker.</p></div>
      <div class="comp-card"><h4>A/C pressure trip</h4><p>An over- or underpressure fault trips an amber resettable switch in the nose wheel well. Try one reset only, with the engines shut down and air conditioning requested. If it trips again, have it investigated. Constant AIR COND N1 LOW cycling can cause these trips.</p></div>
    </div>
  </section>
</div>

  <section class="block" id="pr-fcu">
    <h2>Flow control unit (inflow) <span class="ref">Figures 12-5 to 12-7</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>An electronic flow control unit in each nacelle meters both <b>ambient</b> and <b>P3 bleed</b> air into the cabin and supplies half the total. Each has an ambient temperature sensor, an electronic controller and a valve assembly:</p>
        <ul class="tight">
          <li>the ambient mass-flow transducer, flow motor and modulating valve, plus a check valve so bleed air can't escape out the ambient inlet</li>
          <li>the bleed-air flow transducer, flow motor and modulating valve, with a high-flow bypass</li>
          <li>an air ejector, a solenoid valve and the environmental (firewall) shutoff valve</li>
        </ul>
        <p><b>Start-up:</b> when the unit is energized after engine start, the bleed modulating valve closes. Fully closed, it trips a shaft switch, and the controller opens the solenoid. P3 then opens the shutoff valve, and the bleed valve opens to the commanded flow.</p>
        <p><b>Ground vs flight:</b> on the ground (left main gear safety switch) the ambient valve stays closed, so inflow is bleed only and limited by ambient temperature. After takeoff the left unit opens its ambient valve. About <b>4–6 s later</b> the right one does, so inflow rises in stages without a pressure bump. As it gets colder, ambient flow is reduced and bleed increased. At about <b>50 °F</b> ambient is shut off and the bleed bypass opens as needed.</p>
      </div>
      <div class="mw-stack">
        <div class="bus-table-wrap"><table><thead><tr><th>BLEED AIR VALVES</th><th>Solenoid / environmental shutoff valve</th></tr></thead><tbody>
          <tr><td>OPEN</td><td>Solenoid held open electrically, so the shutoff valve opens</td></tr>
          <tr><td>ENVIR OFF</td><td>Closed, so no bleed air to the cabin</td></tr>
          <tr><td>PNEU &amp; ENVIR OFF</td><td>Closed, plus the pneumatic valve closes (no vacuum source from that side)</td></tr>
        </tbody></table></div>
        <div class="card"><h3>ENVIR BLEED AIR — NORMAL / LOW</h3><p>LOW almost closes the bypass, slightly closes the bleed valve and biases the motor signals: about <b>half</b> the inflow. Required for takeoff and landing above +10 °C and usually used on the ground. Select NORMAL shortly after takeoff for cruise. A small bump follows if the differential is low.</p></div>
      </div>
    </div>
  </section>

  <section class="block" id="pr-valves">
    <h2>Outflow &amp; safety valves <span class="ref">Figures 12-8, 12-9</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Both are on the aft pressure bulkhead, each with a silencer.</p>
        <p><b>Outflow valve.</b> Controller pressure, metered suction from the vacuum system, acts on its center chamber against a closing spring. More suction opens it, less closes it. Once the cabin is stable, that chamber sits about <b>0.05 psi</b> below cabin pressure, holding the valve open just enough to match inflow.</p>
        <p>Three functions:</p>
        <ul class="tight">
          <li>It meters outflow, on the 350 up to about 13,500 ft cabin altitude, set by the altitude limit controller.</li>
          <li>A Schrader relief valve bleeds controller pressure to static at <b>6.6 psid</b>, so the valve opens.</li>
          <li>A negative-relief diaphragm opens it whenever outside pressure exceeds cabin pressure.</li>
        </ul>
        <p><b>Safety valve.</b> The same relief and negative-relief functions. It is also the <b>dump valve</b>. When the dump solenoid admits vacuum to its main chamber it opens fully, up to about 13,500 ft cabin altitude on the 350. Because its controller pressure is slightly lower, it usually reaches maximum differential first. One valve relieving is enough.</p>
      </div>
      <div class="card"><h3>See it</h3><p>Load "Situation 2" and watch the system schematic at the top of the climb. The safety valve takes over at maximum differential and the cabin is pushed up with the airplane.</p><button class="show" type="button" data-prset2="1">Situation 2 →</button></div>
    </div>
  </section>

  <section class="block" id="pr-ctl">
    <h2>Controller &amp; CABIN PRESS switch <span class="ref">Figures 12-10 to 12-12, 12-15</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>The controller compares cabin pressure with the selected value using an aneroid bellows. A rate diaphragm and metering valve set the suction sent to the outflow valve. <b>CABIN ALT</b> sets the cabin altitude to hold. The inner <b>ACFT ALT</b> scale turns with it, fixed at <b>6.5 psid</b>, and shows the highest airplane altitude that still lets the cabin hold that value. <b>RATE</b> sets a needle valve: about 150–2,000 ft/min. Between the 12 and 1 o'clock positions is the most comfortable.</p>
        <p>The <b>cabin preset solenoid</b> (normally open) cuts vacuum to the controller on the ground so the outflow valve springs closed, and lets you preset the controller. The <b>dump solenoid</b> (normally closed) admits vacuum to the safety valve to open it.</p>
      </div>
      <div class="bus-table-wrap"><table><thead><tr><th>CABIN PRESS</th><th>On the ground</th><th>In flight</th></tr></thead><tbody>
        <tr><td><b>PRESS</b></td><td>Squat switch energizes preset, dump and door seal solenoids. Outflow closed, safety open, door seal deflated: cabin <b>unpressurized</b>.</td><td>Solenoids de-energized. Safety closes, outflow modulates, seal inflates: cabin <b>pressurized</b> as set.</td></tr>
        <tr><td><b>DUMP</b> (lever-lock)</td><td colspan="2">Solenoids energized regardless of the squat switch. The safety valve opens fully and the cabin depressurizes (350: up to about 13,500 ft cabin). The ram air door isn't held closed.</td></tr>
        <tr><td><b>TEST</b> (spring to PRESS)</td><td>Overrides the squat switch: in-flight configuration, so the cabin pressurizes. Used for the runup check.</td><td>No effect.</td></tr>
        <tr><td colspan="3">With the <b>PRESS CONTROL</b> circuit breaker pulled, all electrical functions are lost. That gives normal pressurization control but no dump, either with the switch or at touchdown.</td></tr>
      </tbody></table></div>
    </div>
  </section>

  <section class="block" id="pr-ind">
    <h2>Indicators &amp; annunciators <span class="ref">Figures 12-13, 12-14, 12-17</span></h2>
    <div class="two-col">
      <div class="prose">
        <p><b>Cabin altimeter</b> (forward of the condition levers): cabin pressure altitude on the outer scale, differential on the inner scale. <b>Cabin climb</b> indicator, just to its left: the rate of change of cabin altitude.</p>
        <p><b>King Air 350 annunciators:</b></p>
        <ul class="tight">
          <li><b>CABIN ALTITUDE</b> (white status) plus a tone at about 10,000–10,500 ft cabin.</li>
          <li><b>CABIN ALT HI</b> (red warning) plus a tone at about 11,500–12,000 ft cabin. Oxygen required.</li>
          <li><b>CABIN DIFF HI</b> (red) above 6.9 psid: the 6.6 psid maximum has been exceeded.</li>
        </ul>
        <p>The tones can be canceled. The <b>CABIN ALT TEST / CABIN DIFF WARN TEST</b> switch on the copilot's left subpanel tests them. Passenger masks should drop as the cabin passes 12,500 ft. If they don't, pull the manual dropout handle.</p>
      </div>
      <div class="card"><h3>Try it</h3><p>Load "Dump at FL250" and watch the cabin climb through both annunciator thresholds, then stop at about 13,500 ft. That's the 350's altitude limit controller.</p><button class="show" type="button" data-prset2="5">Dump at FL250 →</button></div>
    </div>
  </section>

  <section class="block" id="pr-ops">
    <h2>Using the system <span class="ref">Figures 12-18 to 12-23</span></h2>
    <div class="two-col">
      <div class="prose">
        <ul class="tight">
          <li><b>Runup check:</b> bleed valves OPEN, CABIN ALT about 1,000 ft <b>below</b> field, rate at 12–1 o'clock. Hold TEST and look for a cabin descent within 20–40 s.</li>
          <li><b>Before takeoff:</b> ACFT ALT 500–1,000 ft above planned cruise, and CABIN ALT at least 500 ft above field. CABIN PRESS in PRESS, bleed valves OPEN. ENVIR BLEED AIR LOW above +10 °C.</li>
          <li><b>Climb:</b> NORMAL when time permits. The cabin climbs at the selected rate. For a higher cruise, reset ACFT ALT to the new altitude plus 500–1,000 ft.</li>

        </ul>
