  ["Situation 1: set correctly", "Climb to FL310 (2,000 then 1,000 ft/min), cruise, descend at 1,500 ft/min to a 1,500 ft field. ACFT ALT set to FL315, rate 500 ft/min. At the top of descent the controller is reset to 2,000 ft cabin.", P => { P.set = Math.round(prCabFor(31500) / 100) * 100; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 20000; P.vs = 2000; } , msg: "takeoff, climbing at 2,000 ft/min." }, { until: P => P.alt >= 20000, do: P => { P.tgt = 31000; P.vs = 1000; }, msg: "passing FL200, 1,000 ft/min to FL310." }, { until: P => P.alt >= 31000, do: () => {}, msg: "level at FL310." }, { wait: 300, do: P => { P.set = 2000; P.field = 1500; P.tgt = 1500; P.vs = 1500; }, msg: "top of descent: CABIN ALT reset to 2,000 ft (500 above the 1,500 ft field), descending at 1,500 ft/min." }]],
  ["Situation 2: ACFT ALT = cruise", "Same flight, but ACFT ALT set to FL310, the cruise altitude itself. The cabin reaches maximum differential at the top and rides the relief valves (bumps).", P => { P.set = Math.round(prCabFor(31000) / 100) * 100; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 20000; P.vs = 2000; }, msg: "takeoff." }, { until: P => P.alt >= 20000, do: P => { P.tgt = 31000; P.vs = 1000; }, msg: "passing FL200." }, { until: P => P.alt >= 31000, do: () => {}, msg: "level at FL310." }, { wait: 300, do: P => { P.set = 2000; P.field = 1500; P.tgt = 1500; P.vs = 1500; }, msg: "descent: reset to 2,000 ft cabin." }]],
  ["Situation 3: set for landing", "CABIN ALT set to the 1,500 ft landing field before takeoff and never reset. Maximum differential is reached around FL190, and the cabin is then pushed up with the airplane.", P => { P.set = 1500; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 20000; P.vs = 2000; }, msg: "takeoff." }, { until: P => P.alt >= 20000, do: P => { P.tgt = 31000; P.vs = 1000; }, msg: "passing FL200." }, { until: P => P.alt >= 31000, do: () => {}, msg: "level at FL310." }, { wait: 300, do: P => { P.field = 1500; P.tgt = 1500; P.vs = 1500; }, msg: "descent, no controller reset." }]],
  ["Situation 5: 6,000 ft departure", "Depart a 6,000 ft field with CABIN ALT at 6,500 ft (500 above field), climb at 2,000 ft/min to 16,000 ft. Once the cabin is stable, reset for the sea-level destination (500 ft).", P => { P.field = 6000; P.alt = 6000; P.cab = 6000; P.set = 6500; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 16000; P.vs = 2000; }, msg: "takeoff from 6,000 ft." }, { until: P => P.cab >= 6480, do: P => { P.set = 500; }, msg: "cabin stable at 6,500 ft: CABIN ALT reset to 500 ft for the sea-level destination." }, { until: P => P.alt >= 16000, do: () => {}, msg: "level at 16,000 ft." }, { wait: 300, do: P => { P.field = 0; P.tgt = 0; P.vs = 1500; }, msg: "descending to the sea-level airport." }]],
  ["Runup check (TEST)", "On the ground at a 1,000 ft field, bleed valves OPEN, NORMAL, CABIN ALT 1,000 ft below field. Hold CABIN PRESS to TEST and look for a cabin descent in 20–40 s.", P => { P.field = 1000; P.alt = 1000; P.cab = 1000; P.set = 0; P.rate = 500; P.speed = 1; }, null],
  ["Dump at FL250", "Cruising at FL250, pressurized. After a few seconds CABIN PRESS is put to DUMP. Watch the safety valve open, the cabin pass the annunciator thresholds, and stop near 13,500 ft (350).", P => { P.flight = true; P.alt = P.tgt = 25000; P.set = 5000; P.cab = Math.max(prCabFor(25000), 5000); P.ref = P.cab; P.speed = 5; },
    [{ wait: 15, do: P => { P.sw = "DUMP"; }, msg: "CABIN PRESS to DUMP." }]],
  ["Squat switch fails (no pressurization)", "The left squat switch stays in ground mode. After takeoff the safety valve stays open and the cabin climbs with the airplane. Fix: hold TEST to override it, then pull PRESS CONTROL once above 0.5 psid.", P => { P.fault.squat = true; P.set = 6000; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 15000; P.vs = 1500; }, msg: "takeoff." }]],
  ["Preset solenoid stuck (rapid pressurization)", "The preset solenoid sticks closed after takeoff. With no controller pressure the outflow valve stays shut and the cabin descends fast toward maximum differential. Fix: turn off both bleed air valves, then cycle TEST to free the solenoid.", P => { P.fault.preset = true; P.set = 8000; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 15000; P.vs = 1500; }, msg: "takeoff." }]],
  ["Bleed valves left at ENVIR OFF (leakdown)", "Both BLEED AIR VALVE switches left at ENVIR OFF. No inflow, so the cabin can't pressurize and leaks up with the airplane. Fix: set them to OPEN.", P => { P.bleed.L = P.bleed.R = "ENVIR"; P.set = 6000; P.rate = 500; },
    [{ wait: 3, do: P => { prTakeoff(P); P.tgt = 15000; P.vs = 1500; }, msg: "takeoff." }]]
];
function prLoadSetup(i) {
  const s = PR_SETUPS[i]; PR = prFresh(); prLogArr = []; s[2](PR); PR.cap = s[1];
  if (!PR.flight) PR.cab = PR.alt = PR.field; PR.ref = PR.cab; PR.script = s[3] ? s[3].map(x => Object.assign({}, x)) : null; PR.scriptT0 = 0;
  ["L", "R"].forEach(k => PR.seq[k] = PR.bleed[k] === "OPEN" ? 9 : 0);
  prLog(`Setup: ${s[0]}.`); prStep(0.001);
}

function initPressurization() {
  PR = prFresh(); prLogArr = []; prSel = null; prSide = "L";
  prSvgs(); prGauges(); prShowTab("sys");
  $("#prSubnav").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) document.getElementById(b.dataset.go).scrollIntoView({ behavior: "smooth", block: "start" }); });
  $("#prSetups").innerHTML = PR_SETUPS.map((s, i) => `<button type="button" class="pbtn" data-prset2="${i}">${esc(s[0])}</button>`).join("");
  $("#main .view").addEventListener("click", e => { const b = e.target.closest("[data-prset2]"); if (b) { prLoadSetup(+b.dataset.prset2); if (!b.closest("#prSetups")) $("#pr-sim").scrollIntoView({ behavior: "smooth", block: "start" }); } });
  $("#prTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) prShowTab(b.dataset.tab); });
  $$("[data-prside]").forEach(b => b.addEventListener("click", () => { prSide = b.dataset.prside; if (prTab !== "fcu") prShowTab("fcu"); prStep(0.001); }));
  // controller
  $("#prSet").addEventListener("input", e => { PR.set = +e.target.value; PR.cap = ""; prStep(0.001); });
  $("#prRate").addEventListener("input", e => { PR.rate = +e.target.value; prStep(0.001); });
  $$("[data-prset]").forEach(b => b.addEventListener("click", () => { PR.set = Math.max(-1000, Math.min(15000, PR.set + +b.dataset.prset)); prStep(0.001); }));
  $$("[data-prsw]").forEach(b => b.addEventListener("click", () => { const v = b.dataset.prsw; if (PR.sw !== v) { PR.sw = v; prLog(`CABIN PRESS: ${v}${v === "DUMP" ? ". Safety valve opens and the cabin depressurizes (350: up to about 13,500 ft)." : "."}`, v === "DUMP" ? "warn" : ""); } prStep(0.001); }));
  icHold($("#prTest"), () => { if (!PR.test) { PR.test = true; if (PR.fault.preset && PR.flight) { PR.fault.preset = false; prLog("Cycling CABIN PRESS to TEST freed the stuck preset solenoid.", "ok"); } prLog(PR.flight ? (PR.fault.squat ? "TEST held: overriding the failed squat switch. Safety valve closes, outflow valve modulates." : "TEST in flight: no effect.") : "CABIN PRESS held in TEST: squat switch overridden, in-flight configuration. Cabin should pressurize."); prStep(0.001); } },
    () => { if (PR.test) { PR.test = false; prLog("TEST released: switch back to PRESS."); prStep(0.001); } });
  // copilot subpanel
  const tog = (title, items) => `<div class="sw-group"><div class="gname">${title}</div><div class="sws">${items.map(([name, key, opts]) => `<div class="tog"><div class="name">${name}</div><div class="pos" role="group" aria-label="${title} ${name}">${opts.map(o => `<button type="button" data-prbsw="${key}" data-val="${o[0]}" aria-pressed="false">${o[1]}</button>`).join("")}</div></div>`).join("")}</div></div>`;
  $("#prSw").innerHTML = tog("Envir bleed air", [["", "low", [["false", "Normal"], ["true", "Low"]]]]) + tog("Bleed air valves", [["Left", "bleed:L", [["OPEN", "Open"], ["ENVIR", "Envir off"], ["PNEU", "Pneu &amp; envir off"]]], ["Right", "bleed:R", [["OPEN", "Open"], ["ENVIR", "Envir off"], ["PNEU", "Pneu &amp; envir off"]]]]);
  $("#prSw").addEventListener("click", e => { const b = e.target.closest("[data-prbsw]"); if (!b) return; const [g, k] = b.dataset.prbsw.split(":"); let v = b.dataset.val; if (v === "true" || v === "false") v = v === "true"; if ((k ? PR[g][k] : PR[g]) === v) return; if (k) PR[g][k] = v; else PR[g] = v; prLog(g === "low" ? `ENVIR BLEED AIR ${v ? "LOW: inflow about halved" : "NORMAL"}.` : `${SIDE[k]} BLEED AIR VALVE: ${{ OPEN: "OPEN", ENVIR: "ENVIR OFF", PNEU: "PNEU & ENVIR OFF" }[v]}.`); prStep(0.001); });
  $("#prTests").innerHTML = `<span class="gname">Warning test (hold)</span><button type="button" class="pbtn" id="prAltTest">CABIN ALT TEST</button><button type="button" class="pbtn" id="prDiffTest">CABIN DIFF WARN TEST</button>`;
  icHold($("#prAltTest"), () => { if (!PR.altTest) { PR.altTest = true; prLog("CABIN ALT TEST: CABIN ALTITUDE and CABIN ALT HI light, tone sounds."); prStep(0.001); } }, () => { if (PR.altTest) { PR.altTest = false; prStep(0.001); } });
  icHold($("#prDiffTest"), () => { if (!PR.diffTest) { PR.diffTest = true; prLog("CABIN DIFF WARN TEST: CABIN DIFF HI lights."); prStep(0.001); } }, () => { if (PR.diffTest) { PR.diffTest = false; prStep(0.001); } });
  $("#prAnns").innerHTML = [["CALT", "CABIN ALTITUDE"], ["CHI", "CABIN ALT HI"], ["DHI", "CABIN DIFF HI"], ["LBL", "L BL AIR OFF"], ["RBL", "R BL AIR OFF"]].map(a => `<div class="ann" id="pra-${a[0]}">${a[1]}</div>`).join("");
  $("#prMW").addEventListener("click", () => { PR.mw = false; prStep(0.001); });
  $("#prTone").innerHTML = `<span class="pr-tonebadge" id="prToneOn" hidden>♪ WARNING TONE</span><button type="button" class="pbtn" id="prToneOff" hidden>Cancel tone</button><span class="ac-stat" id="prToneNo">Tone silent</span>`;
  $("#prToneOff").addEventListener("click", () => { PR.toneOff = true; prLog("Tone canceled."); prStep(0.001); });
  prDial.last = null;
  // airplane
  $("#prFlt").innerHTML = `<div class="seg" role="group" aria-label="Airplane"><button type="button" id="prFl-g">On ground</button><button type="button" id="prFl-f">Take off</button></div>${["L", "R"].map(k => `<button type="button" class="pbtn envb" id="prEng${k}" aria-pressed="true"></button>`).join("")}<button type="button" class="pbtn" id="prCb" aria-pressed="false"></button>`;
  $("#prAlt").innerHTML = `<label for="prTgt">Target altitude</label><input type="range" id="prTgt" min="0" max="35000" step="500"><span class="flowread" id="prTgtV"></span><div class="seg" role="group" aria-label="Vertical speed">${[500, 1000, 1500, 2000].map(v => `<button type="button" data-prvs="${v}">${v}</button>`).join("")}</div>`;
  $("#prEnv").innerHTML = `<label for="prField">Field elevation</label><input type="range" id="prField" min="0" max="8000" step="500"><span class="flowread" id="prFieldV"></span><label for="prOat">OAT</label><input type="range" id="prOat" min="-30" max="40" step="1"><span class="flowread" id="prOatV"></span>`;
  $("#prClock").innerHTML = `<span class="gname">Clock</span><div class="seg" role="group" aria-label="Simulation speed">${[1, 5, 10, 30, 60].map(v => `<button type="button" data-prspd="${v}">×${v}</button>`).join("")}</div><button type="button" class="pbtn" id="prReset">Reset</button>`;
  $("#prFaults").innerHTML = `<button type="button" class="pbtn" id="prf-squat" aria-pressed="false">L squat switch stuck in ground</button><button type="button" class="pbtn" id="prf-preset" aria-pressed="false">Preset solenoid stuck closed</button><button type="button" class="pbtn" id="prf-stuck" aria-pressed="false">Safety valve stuck open</button>`;
  $("#prFl-g").addEventListener("click", () => { if (PR.flight) { PR.tgt = PR.field; prLog("Descending to land."); } prStep(0.001); });
  $("#prFl-f").addEventListener("click", () => { prTakeoff(PR); if (PR.tgt <= PR.field) PR.tgt = PR.field + 10000; PR.cap = ""; prStep(0.001); });
  ["L", "R"].forEach(k => $("#prEng" + k).addEventListener("click", () => { PR.eng[k] = !PR.eng[k]; prLog(`${SIDE[k]} engine ${PR.eng[k] ? "started" : "shut down"}.`); prStep(0.001); }));
  $("#prCb").addEventListener("click", () => { PR.cb = !PR.cb; prLog(PR.cb ? "PRESS CONTROL circuit breaker reset." : "PRESS CONTROL circuit breaker pulled: electrical functions lost. Normal pressurization control, but no dump with the switch or at touchdown.", PR.cb ? "" : "warn"); prStep(0.001); });
  $("#prTgt").addEventListener("input", e => { PR.tgt = +e.target.value; if (!PR.flight && PR.tgt > PR.field) prTakeoff(PR); PR.cap = ""; prStep(0.001); });
  $$("[data-prvs]").forEach(b => b.addEventListener("click", () => { PR.vs = +b.dataset.prvs; prStep(0.001); }));
  $("#prField").addEventListener("input", e => { PR.field = +e.target.value; if (!PR.flight) { PR.alt = PR.field; PR.cab = PR.field; PR.ref = PR.field; } prStep(0.001); });
  $("#prOat").addEventListener("input", e => { PR.oat = +e.target.value; prStep(0.001); });
  $$("[data-prspd]").forEach(b => b.addEventListener("click", () => { PR.speed = +b.dataset.prspd; prStep(0.001); }));
  $("#prReset").addEventListener("click", () => { PR = prFresh(); prLogArr = []; prLog("Reset: on the ground at sea level, engines running, bleed air valves OPEN."); prStep(0.001); });
  $("#prFaults").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const k = { "prf-squat": "squat", "prf-preset": "preset", "prf-stuck": "stuckOpen" }[b.id]; PR.fault[k] = !PR.fault[k]; prLog(`${PR.fault[k] ? "Failure" : "Repaired"}: ${b.textContent.toLowerCase()}.`, PR.fault[k] ? "warn" : ""); prStep(0.001); });
  const sv = $("#prSvgs");
  sv.addEventListener("click", e => { const g = e.target.closest(".comp"); if (g) prSelect(g.dataset.prcomp); });
  sv.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".comp")) { e.preventDefault(); prSelect(e.target.closest(".comp").dataset.prcomp); } });
  $("#prInfo").innerHTML = `<h3>Component details</h3><p>Select any solenoid, valve, line or the controller.</p>`;
  prLog("On the ground at sea level. Engines running, bleed air valves OPEN, CABIN PRESS in PRESS: the safety valve is open, so the cabin is unpressurized.");
  prStep(0.001);
  prTimer = setInterval(() => prStep(0.1), 100);
}

/* ================= boot ================= */
buildToc();
$("#menuBtn").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); });
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
