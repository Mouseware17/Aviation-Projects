<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King Air 350 Systems</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: chapter rail on the left (the manual's table of contents), study content on the right;
   the electrical chapter centers on a live schematic with a cockpit subpanel beneath it. */
:root {
  --bg: #e8ecf0;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --fg: #15202b;
  --muted: #586675;
  --line: #ccd4dc;
  --accent: #1c4f8c;
  --accent-ink: #ffffff;
  --accent-soft: #dbe6f3;

  --panel: #3b4148;        /* King Air instrument-panel grey, same in both themes */
  --panel-2: #2e3339;
  --panel-line: #59616a;
  --placard: #f1f3f5;
  --placard-dim: #aab2bb;

  --canvas: #f9fafb;
  --wire-dead: #a2adb8;
  --wire-case: #27313b;
  --sym: #27313b;
  --sym-fill: #ffffff;

  --pw-bat: #d4382c;
  --pw-gen: #2a73c4;
  --pw-ext: #23904e;
  --pw-ctl: #e2b714;
  --fault: #e0321f;

  --ann-amber: #f4b322;
  --ann-green: #33b864;
  --ann-off: #1c2025;
  --ann-off-ink: #5d666f;

  --ok: #23804a;
  --warn: #a8690f;
  --bad: #c3352a;

  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #161c22; --surface-2: #1c232a; --fg: #e3e8ed; --muted: #93a1ae;
    --line: #2b343d; --accent: #82b4ee; --accent-ink: #0c1621; --accent-soft: #1d2f45;
    --canvas: #11171c; --wire-dead: #4b5662; --wire-case: #05080a; --sym: #c7d0d9; --sym-fill: #1b2229;
    --pw-bat: #ef5749; --pw-gen: #4d95e8; --pw-ext: #3dbf6d; --pw-ctl: #f0cb35; --fault: #ff5a43;
    --ok: #4cc27c; --warn: #e3a643; --bad: #f06a5d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #161c22; --surface-2: #1c232a; --fg: #e3e8ed; --muted: #93a1ae;
  --line: #2b343d; --accent: #82b4ee; --accent-ink: #0c1621; --accent-soft: #1d2f45;
  --canvas: #11171c; --wire-dead: #4b5662; --wire-case: #05080a; --sym: #c7d0d9; --sym-fill: #1b2229;
  --pw-bat: #ef5749; --pw-gen: #4d95e8; --pw-ext: #3dbf6d; --pw-ctl: #f0cb35; --fault: #ff5a43;
  --ok: #4cc27c; --warn: #e3a643; --bad: #f06a5d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--panel); color: var(--placard);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--panel-2);
}
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 1.45rem; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.brand span { font-family: var(--f-mono); font-size: .72rem; color: var(--placard-dim); letter-spacing: .08em; white-space: nowrap; }
.menu-btn { display: none; margin-left: auto; background: var(--panel-2); border: 1px solid var(--panel-line); border-radius: var(--r); padding: 6px 12px; font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; color: var(--placard); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); height: calc(100vh - 56px - env(safe-area-inset-top, 0px)); overflow-y: auto;
}
.rail h2 { font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a {
  display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: var(--r); text-decoration: none; color: var(--fg);
  font-family: var(--f-display); font-size: 1.02rem; letter-spacing: .02em; text-transform: uppercase;
}
.toc a .n { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.toc a .st { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.toc a .st.ready { background: var(--ok); }
.toc a:hover { background: var(--surface-2); }
.toc a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.toc a[aria-current="page"] .n { color: var(--accent); }
.rail .home-link { display: block; margin-bottom: 14px; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; text-decoration: none; padding: 6px 8px; border-radius: var(--r); color: var(--fg); }
.rail .home-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail .note { margin-top: 18px; font-size: .8rem; color: var(--muted); }

main {
  min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.view { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
.view > *, section.block > *, .mw-stack > * { min-width: 0; }
.prose { max-width: 68ch; display: grid; gap: 12px; }
.eyebrow { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.chapter-head { display: grid; gap: 10px; }
.chapter-head h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); text-transform: uppercase; letter-spacing: .01em; font-weight: 700; }
.lede { font-size: 1.12rem; max-width: 64ch; color: var(--fg); }
.disclaimer { font-size: .85rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; max-width: 70ch; }

section.block { display: grid; gap: 16px; scroll-margin-top: 80px; }
section.block > h2 { font-size: 1.9rem; text-transform: uppercase; letter-spacing: .02em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
section.block > h2 .ref { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); letter-spacing: .06em; font-weight: 500; }
h3 { font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; }

.subnav { display: flex; flex-wrap: wrap; gap: 6px; }
.subnav button {
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: .92rem; cursor: pointer;
}
.subnav button:hover { border-color: var(--accent); color: var(--accent); }

/* spec strip */
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.spec { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.spec .v { font-family: var(--f-mono); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.spec .k { font-size: .85rem; color: var(--muted); line-height: 1.35; }

/* ---------- simulator ---------- */
.sim { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start; }
.diagram-card { background: var(--canvas); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.diagram-card > * { min-width: 0; }
.scen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.scen > * { min-width: 0; }
.scen-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.scen label { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; font-size: .95rem; }
.scen select { flex: 1 1 260px; min-width: 0; font: inherit; font-size: .95rem; padding: 6px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; cursor: pointer;
  font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: .95rem;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }
.scen-cap { font-size: .95rem; color: var(--fg); min-height: 3em; }
.scen-cap b { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-weight: 500; margin-right: 6px; }
.svg-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.svg-wrap svg { display: block; width: 100%; min-width: 680px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 22px; height: 5px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }

.side { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.card > h3 { font-size: 1.05rem; letter-spacing: .08em; }
.info h4 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .02em; }
.info .now { font-family: var(--f-mono); font-size: .8rem; background: var(--surface-2); border-radius: 4px; padding: 6px 8px; line-height: 1.45; }
.info ul { margin: 0; padding-left: 18px; font-size: .9rem; }
.info .eq { max-height: 220px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.info .eq h5 { margin: 6px 0 2px; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: .9rem; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; font-size: .86rem; }
.log li { display: grid; grid-template-columns: 3.4em 1fr; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.log li .t { font-family: var(--f-mono); color: var(--muted); font-size: .75rem; padding-top: 2px; }
.log li.warn .m { color: var(--warn); }
.log li.bad .m { color: var(--bad); }

/* SVG symbols */
svg text { font-family: var(--f-display); fill: var(--fg); }
.lbl { font-size: 12px; letter-spacing: .04em; fill: var(--muted); }
.lbl-b { font-size: 13px; letter-spacing: .05em; font-weight: 600; }
.w-case { fill: none; stroke: var(--wire-case); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .0; }
.w { fill: none; stroke: var(--wire-dead); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .25s, stroke-width .25s; }
.w.p1, .w.p2, .w.p3 { stroke-width: 4.5; }
.w-case.on { opacity: .9; }
.w.p1 { stroke: var(--pw-bat); } .w.p2 { stroke: var(--pw-gen); } .w.p3 { stroke: var(--pw-ext); }
.w.short { stroke: var(--wire-dead); stroke-dasharray: 2 5; }
.c { fill: none; stroke: var(--wire-dead); stroke-width: 1.6; transition: stroke .25s; }
.c.on { stroke: var(--pw-ctl); stroke-width: 3; }
.c.dash { stroke-dasharray: 5 4; }
.bus-fill { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.5; transition: fill .25s; }
.bus-fill.p1 { fill: var(--pw-bat); } .bus-fill.p2 { fill: var(--pw-gen); } .bus-fill.p3 { fill: var(--pw-ext); }
.bus-fill.short { fill: var(--sym-fill); stroke: var(--fault); stroke-dasharray: 4 3; }
.bus-txt { font-size: 13px; font-weight: 700; letter-spacing: .06em; pointer-events: none; }
.bus-txt.lit { fill: #ffffff; }
.sym { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.6; }
.sym-l { fill: none; stroke: var(--sym); stroke-width: 2.2; stroke-linecap: round; }
.sym-solid { fill: var(--sym); stroke: none; }
.term { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.6; }
.blade { stroke: var(--sym); stroke-width: 3; stroke-linecap: round; transition: transform .2s; }
.lim { fill: var(--sym); stroke: var(--sym); stroke-width: 1; transition: fill .2s; }
.lim.blown { fill: var(--fault); stroke: var(--fault); }
.coil { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.6; transition: fill .2s; }
.coil.on { fill: var(--pw-ctl); }
.hed { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.6; transition: fill .2s; }
.hed.trip { fill: var(--pw-ctl); }
.hed-t { font-size: 10px; font-weight: 700; pointer-events: none; }
.gcu { fill: var(--sym-fill); stroke: var(--sym); stroke-width: 1.6; transition: fill .2s; }
.gcu.on { fill: var(--pw-ctl); }
.gcu-t { font-size: 11px; font-weight: 700; pointer-events: none; letter-spacing: .04em; }
.gcu.on + .gcu-t, .gcu-t.dark { fill: #1b1f24; }
.bolt { fill: var(--fault); }
.rotor { transform-box: fill-box; transform-origin: center; }
.rotor.spin { animation: spin .6s linear infinite; }
.rotor.slow { animation-duration: 1.6s; }
@keyframes spin { to { transform: rotate(360deg); } }
.comp { cursor: pointer; }
.comp .hit { fill: transparent; stroke: none; }
.comp:hover .hit { fill: var(--accent); opacity: .08; }
.comp.sel .hit { fill: var(--accent); opacity: .16; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
.comp:focus { outline: none; }
.comp:focus-visible .hit { fill: var(--accent); opacity: .2; }
.n1t { font-family: var(--f-mono); font-size: 12px; font-weight: 700; fill: var(--fg); }
.flowtag { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }

/* ---------- cockpit controls ---------- */
.cockpit { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; }
.panel {
  background: var(--panel); color: var(--placard); border-radius: 8px; padding: 14px;
  box-shadow: inset 0 0 0 1px var(--panel-2), inset 0 2px 0 rgba(255,255,255,.04);
  display: grid; gap: 12px; min-width: 0;
}
.panel > h3 { font-size: .95rem; letter-spacing: .18em; color: var(--placard-dim); font-weight: 600; }
.sw-row { display: flex; flex-wrap: wrap; gap: 14px 12px; align-items: flex-start; }
.sw-group { display: grid; gap: 6px; padding: 8px 10px 10px; border: 1px solid var(--panel-line); border-radius: 6px; position: relative; }
.sw-group > .gname { font-family: var(--f-display); font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--placard-dim); text-align: center; }
.sw-group .sws { display: flex; gap: 10px; }
.tog { display: grid; justify-items: center; gap: 4px; min-width: 64px; }
.tog .name { font-family: var(--f-display); font-weight: 700; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; text-align: center; line-height: 1.05; }
.tog .pos { display: grid; gap: 3px; width: 100%; }
.tog .pos button {
  display: flex; align-items: center; gap: 6px; justify-content: flex-start;
  background: var(--panel-2); border: 1px solid var(--panel-line); color: var(--placard-dim);
  border-radius: 4px; padding: 3px 7px; cursor: pointer; font-family: var(--f-display); font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
}
.tog .pos button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--placard-dim); flex: none; }
.tog .pos button[aria-pressed="true"] { background: var(--placard); color: #1d2228; border-color: var(--placard); }
.tog .pos button[aria-pressed="true"]::before { background: #1d2228; border-color: #1d2228; }
.tog .pos button.mom { border-style: dashed; }
.tog .pos button.mom::after { content: "↺"; margin-left: auto; font-size: .8rem; opacity: .7; }
.tog.ring .name::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--placard); margin-right: 5px; vertical-align: 1px; }
.eng-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.eng { display: grid; gap: 6px; border: 1px solid var(--panel-line); border-radius: 6px; padding: 8px 10px; }
.eng .hd { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.eng .n1v { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 700; }
.bar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--panel-line); }
.bar > span { display: block; height: 100%; width: 0; background: var(--placard); transition: width .2s linear; }
.eng .hint { font-size: .78rem; color: var(--placard-dim); min-height: 2.4em; line-height: 1.3; }
.pbtn { background: var(--panel-2); border: 1px solid var(--panel-line); color: var(--placard); border-radius: 4px; padding: 4px 10px; font-family: var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; font-size: .85rem; }
.pbtn:hover { border-color: var(--placard); }
.pbtn[aria-pressed="true"] { background: var(--fault); border-color: var(--fault); color: #ffffff; }
.pbtn.gpu[aria-pressed="true"] { background: var(--pw-ext); border-color: var(--pw-ext); }

.gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.gauge { display: grid; justify-items: center; gap: 2px; }
.gauge svg { width: 100%; max-width: 120px; height: auto; }
.gauge svg text { fill: var(--placard); font-family: var(--f-mono); }
.gauge .gl { font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; color: var(--placard-dim); text-align: center; }
.gauge .gv { font-family: var(--f-mono); font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.gauge .gv.over { color: #ff8a7a; }
.vsel { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.vsel button { background: var(--panel-2); border: 1px solid var(--panel-line); color: var(--placard-dim); border-radius: 3px; padding: 1px 6px; font-family: var(--f-display); font-size: .74rem; letter-spacing: .05em; cursor: pointer; text-transform: uppercase; }
.vsel button[aria-pressed="true"] { background: var(--placard); color: #1d2228; }
.endur { font-size: .82rem; color: var(--placard-dim); text-align: center; }

.ann-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #121518; padding: 6px; border-radius: 4px; }
.ann {
  font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; line-height: 1.05;
  text-align: center; padding: 7px 4px; border-radius: 2px; background: var(--ann-off); color: var(--ann-off-ink);
  border: 1px solid #000000; min-height: 38px; display: grid; place-items: center;
}
.ann.amber { background: var(--ann-amber); color: #241a00; box-shadow: 0 0 10px rgba(244,179,34,.45); }
.ann.green { background: var(--ann-green); color: #04220f; box-shadow: 0 0 10px rgba(51,184,100,.45); }
.ann.flash { animation: flash .6s steps(1) infinite; }
@keyframes flash { 50% { background: var(--ann-off); color: var(--ann-off-ink); box-shadow: none; } }
.ann-note { font-size: .78rem; color: var(--placard-dim); }

    <span>B300 · Pilot study guide</span>
  </a>

</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Chapters">
    <a class="home-link" href="#" id="homeLink">Contents</a>
    <h2>Chapters</h2>
    <ol class="toc" id="toc"></ol>

  <main id="main"></main>

<template id="tpl-electrical">
<div class="view">
  <header class="chapter-head">
    <div class="eyebrow">Chapter 2</div>
    <h1>Electrical Power Systems</h1>
    <p class="lede">The King Air 350 runs on a 28-volt DC, negative-ground, multi-bus system. A battery and two engine-driven starter/generators feed six buses, and current sensors, bus ties and current limiters isolate a fault before it can take the whole system down.</p>
    <p class="disclaimer">Study aid built from a King Air 300/350 pilot training manual chapter, King Air 350 content only. It is not an approved document. The Pilot's Operating Handbook / AFM governs all procedures and limitations.</p>
    <div class="subnav" id="subnav">
      <button data-go="glance">At a glance</button>
      <button data-go="sim">Interactive schematic</button>
      <button data-go="buses">Buses</button>
      <button data-go="components">Components</button>
      <button data-go="operation">How it operates</button>
      <button data-go="gcu">Generator control</button>
      <button data-go="protection">Bus ties &amp; protection</button>
      <button data-go="extpwr">External power</button>
      <button data-go="ac">AC &amp; avionics power</button>
      <button data-go="cb">Circuit breakers</button>
      <button data-go="abnormal">Abnormal indications</button>
      <button data-go="loadmgmt">Load management</button>
    </div>
  </header>

  <section class="block" id="glance">
    <h2>At a glance</h2>
    <div class="specs">
      <div class="spec"><span class="v">28.25 ±0.25 V</span><span class="k">Regulated generator / system voltage</span></div>
      <div class="spec"><span class="v">2 × 300 A</span><span class="k">Starter/generators, 28 V, max continuous load each</span></div>
      <div class="spec"><span class="v">24 V</span><span class="k">Battery: Ni-Cad 34 or 36 Ah, or 42 Ah sealed lead-acid</span></div>
      <div class="spec"><span class="v">275 ±5 A</span><span class="k">Hall-effect sensor trip, opens the associated bus tie</span></div>
      <div class="spec"><span class="v">250 A</span><span class="k">Current limiters between each gen bus and the center bus</span></div>
      <div class="spec"><span class="v">3 × 60 A</span><span class="k">Limiters feeding the triple-fed bus (battery, L gen bus, R gen bus)</span></div>
      <div class="spec"><span class="v">400 A</span><span class="k">GCU output limit on the operating generator during a cross-generator start</span></div>
      <div class="spec"><span class="v">32 V</span><span class="k">Overvoltage: GCU takes the generator off line</span></div>
      <div class="spec"><span class="v">&gt;7 A for 6 s</span><span class="k">Battery charge current that lights BATTERY CHARGE</span></div>
      <div class="spec"><span class="v">30 / 5 / 30 / 5 / 30 / 30</span><span class="k">Starter limit: seconds ON / minutes OFF, ending with 30 minutes off</span></div>
    </div>
  </section>

  <section class="block" id="sim">
    <h2>Interactive power distribution <span class="ref">Figures 2-42 to 2-57</span></h2>
    <p class="prose">This is the King Air 350 power distribution schematic, and it runs live. Use the subpanel switches below to power up and start the airplane, or load one of the manual's figures. You can also inject a fault and watch the protection devices isolate it. Select any component on the schematic to see what it does and what state it is in.</p>

    <div class="sim">
      <div class="diagram-card">
        <div class="scen">
          <div class="scen-row">
            <label for="scenSel">Manual figure</label>
            <select id="scenSel"></select>
            <button class="btn" id="scenPrev" aria-label="Previous figure">◀ Prev</button>
            <button class="btn" id="scenNext" aria-label="Next figure">Next ▶</button>
            <button class="btn" id="coldBtn" title="Everything off, faults cleared">Cold &amp; dark</button>
          </div>
          <p class="scen-cap" id="scenCap"></p>
        </div>
        <div class="svg-wrap"><svg id="schem" viewBox="0 0 1040 880" role="img" aria-label="King Air 350 DC power distribution schematic"></svg></div>
        <div class="legend">
          <span><i style="background:var(--pw-ctl)"></i>Control power</span>
          <span><i style="background:var(--pw-bat)"></i>Battery power</span>
          <span><i style="background:var(--pw-gen)"></i>Generator power</span>
          <span><i style="background:var(--pw-ext)"></i>External power</span>
          <span><i style="background:var(--wire-dead)"></i>Unpowered</span>
          <span><i style="background:var(--fault)"></i>Fault / open limiter</span>
        </div>
      </div>

      <div class="side">
        <div class="card info" id="info" aria-live="polite"></div>
        <div class="card">
          <h3>System events</h3>
          <ol class="log" id="log"></ol>
        </div>
      </div>
    </div>

    <div class="cockpit">
      <div class="panel">
        <h3>Pilot's left subpanel</h3>
        <div class="sw-row" id="switches"></div>
        <div class="eng-row" id="engines"></div>
        <div class="sw-row">
          <button class="pbtn gpu" id="gpuBtn" aria-pressed="false">Ground power unit: disconnected</button>
        </div>
      </div>
      <div class="panel">
        <h3>Overhead meter panel</h3>
        <div class="gauges" id="gauges"></div>
        <p class="endur" id="endur"></p>
        <h3>Caution / advisory annunciators</h3>
        <div class="ann-grid" id="anns"></div>
        <p class="ann-note">Annunciator power comes from the triple-fed bus, so the panel goes dark whenever that bus is unpowered.</p>
        <h3>Inject a fault</h3>
        <div class="faults" id="faults"></div>
      </div>
    </div>
  </section>

  <section class="block" id="buses">
    <h2>Buses <span class="ref">Figure 2-6</span></h2>
    <div class="prose">
      <p>Loads are spread across six DC buses. Equipment with a duplicate (left and right landing lights, for example) is placed on different buses, so one bus failure never removes both. Each bus is split into feeder subbuses, and on the copilot's circuit breaker panel the breakers on the same feeder are joined by white lines.</p>
      <p>In normal operation every bus is tied together into one system and all sources share the load through their own protective devices. Switches whose power comes from the center or triple-fed buses have a <b>white ring</b> painted around them on the panel. That equipment stays usable after a dual-generator failure.</p>
    </div>
    <div class="bus-table-wrap">
      <table>
        <thead><tr><th>Bus</th><th>Fed from</th><th>Protection on its feeds</th><th>Role</th></tr></thead>
        <tbody>
          <tr><td><span class="chip busc">Left gen bus</span></td><td>Left generator through its line contactor; center bus through the left gen tie</td><td>250 A limiter + Hall-effect sensor toward center bus; 60 A limiter + diode toward triple-fed</td><td>Left-side and non-essential loads. Shed automatically when both generators are lost.</td></tr>
          <tr><td><span class="chip busc">Right gen bus</span></td><td>Right generator through its line contactor; center bus through the right gen tie</td><td>Same as left</td><td>Right-side and non-essential loads, No. 2 inverter. Shed with the left.</td></tr>
          <tr><td><span class="chip busc">Center bus</span></td><td>Both gen buses (gen ties), battery (battery bus tie), external power relay</td><td>Battery tie Hall-effect sensor; 250 A limiters on each gen side</td><td>Ties the system together. Feeds both starter relays, gear motor, electric heat, No. 1 inverter.</td></tr>
          <tr><td><span class="chip busc">Triple-fed bus</span></td><td>Battery (battery relay) and both gen buses</td><td>Three 60 A limiters, each followed by a diode</td><td>Receives power only and never passes it on. Carries most essential items: annunciators, engine instruments, start control, gear control.</td></tr>
          <tr><td><span class="chip busc">Battery bus</span></td><td>Battery, directly, through the remote control circuit breaker (RCCB)</td><td>RCCB, controlled by the BATTERY BUS switch</td><td>Live whether or not the BAT switch is on. Also powers the BAT switch relay circuit.</td></tr>
          <tr><td><span class="chip busc">Dual-fed bus</span></td><td>Battery bus, and the triple-fed bus No. 2 fuel panel feeder (20 A)</td><td>Diodes on both feeds</td><td>Engine fire extinguishers and cabin entry lighting. Usable with the BAT switch off.</td></tr>

    <details class="eqlist"><summary>Equipment on each bus (typical King Air 350)</summary><div class="cols" id="eqcols"></div></details>

  <section class="block" id="components">
    <h2>Components and what they do</h2>
    <div class="comp-grid" id="compGrid"></div>
  </section>

  <section class="block" id="operation">
    <h2>How the system operates <span class="ref">Before start → start → before taxi</span></h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="block" id="gcu">
    <h2>Generator control units</h2>
    <div class="prose">
      <p>Each generator has its own GCU, mounted below the center aisle floor. It keeps bus voltage constant as engine speed and electrical load change. The generator is self-exciting: it builds up from its own residual magnetism and needs no aircraft power to come on line. The GEN switches (OFF – ON – RESET) are next to the BAT switch under the master switch gang bar.</p>
    </div>
    <div class="two-col">
      <div class="card">
        <h3>Voltage regulation &amp; line contactor control</h3>
        <p>Holding the switch at RESET routes residual voltage through the GCU to the shunt field and output rises. When the switch is released to ON, the regulator holds 28.25 V across all rated speed, load and temperature conditions. The GCU closes the line contactor only when generator voltage is within 0.5 V of bus voltage. That puts the generator on line and closes both gen ties. A failed or switched-off generator has its line contactor opened.</p>
      </div>
      <div class="card">
        <h3>Overvoltage &amp; overexcitation</h3>
        <p>At 32 V the overexcitation circuit identifies which generator is running high and trying to take the whole load, and disconnects it. Overexcitation protection also trips a generator whose field reaches its design limit while voltage is rising out of control but has not yet reached overvoltage.</p>
      </div>
      <div class="card">
        <h3>Paralleling / load sharing</h3>
        <p>With both generators on line, each GCU senses the interpole winding voltage of both machines and biases its regulator up or down. The result is equal load sharing within 10%. When the gen ties are open, paralleling is lost and the loadmeters need not match. Watch that neither exceeds 100%.</p>
      </div>
      <div class="card">
        <h3>Reverse-current protection</h3>
        <p>An underexcited or slowing generator, for example during engine shutdown, starts drawing current from the bus. The GCU compares generator output to bus voltage. When the bus is higher, it opens the line contactor.</p>
      </div>
      <div class="card">
        <h3>Cross-generator-start current limiting</h3>
        <p>Selecting ON with the second engine's start switch signals the operating generator's GCU to limit output to 400 A. That protects the 250 A limiter on the operating side from start transients. While a starter is selected, the bus-tie current sensors are disabled so they cannot open their ties. STARTER ONLY does the same.</p>
      </div>
      <div class="card">
        <h3>Starter function</h3>
        <p>The same machine is a starter (series winding) and a generator (shunt field). A start switch at ON or STARTER ONLY energizes the starter relay. It also disables the shunt field through the field sense relay, so the unit cannot generate during the start. Starter power comes from the center bus.</p>
      </div>
    </div>
    <div class="callout"><b>Caution</b>Starter limits: 30 s ON, 5 min OFF, 30 s ON, 5 min OFF, 30 s ON, then 30 min OFF. They apply only while the starter is driving the engine, not when the engine is driving the starter.</div>
  </section>

  <section class="block" id="protection">
    <h2>Bus ties, sensors &amp; fault protection</h2>
    <div class="two-col">
      <div class="card">
        <h3>Bus tie relays</h3>
        <p>Three bus tie relays connect to the center bus: left gen tie, right gen tie and battery tie. With no power applied, all three are open. The BAT switch closes the battery tie and battery relay without affecting the gen ties. Either generator coming on line, or external power, closes both gen ties. External power and generators have no effect on the battery tie.</p>
      </div>
      <div class="card">
        <h3>Hall-effect sensors (HED)</h3>
        <p>Solid-state sensors that read the magnetic field around a conductor, which is proportional to current. They are one-directional and only see current flowing the way the arrow points: from the center bus toward each gen bus, and from the battery toward the center bus. At 275 ±5 A the sensor opens its tie and latches it open (about 0.010 s for the generator sensors, 0.120 s for the battery sensor). The 250 A limiters cover the opposite direction.</p>
      </div>
      <div class="card">
        <h3>GEN TIES switch</h3>
        <p>MAN CLOSE – NORM – OPEN, lever-locked out of center. It locks in OPEN and springs back from MAN CLOSE. MAN CLOSE closes both gen ties and latches them, lighting MAN TIES CLOSE, which goes out once a generator comes on line and the GCUs take over holding the ties. OPEN opens both gen ties at any time. A tie that a fault tripped open cannot be closed manually. It needs BUS SENSE RESET first.</p>
      </div>
      <div class="card">
        <h3>BUS SENSE switch</h3>
        <p>RESET – NORM – TEST, spring-loaded to NORM. TEST sends bus voltage into all three sensor test circuits and simulates an overcurrent, so all three ties open and latch. RESET powers the tie coils and unlatches them. Use both positions only momentarily. Holding TEST can destroy the sensor modules. Holding RESET latches out overcurrent sensing, which risks welding tie contacts or opening a 250 A limiter into a grounded bus.</p>
      </div>
      <div class="card">
        <h3>Bus isolation</h3>
        <p>A short on one bus opens that bus's tie and the rest of the system keeps running. All sensors are desensitized during engine starts so starter current doesn't trip them. The battery tie sensor is also desensitized, and the tie held closed, during landing gear operation. The triple-fed bus is protected only by its three 60 A limiters. It is isolated only when all three open.</p>
      </div>
      <div class="card">
        <h3>Load shedding</h3>
        <p>When both generators fail or are switched off, the gen ties open and the generator bus loads drop off automatically. The battery keeps the center, triple-fed, battery and dual-fed buses powered. You can restore the gen buses with GEN TIES MAN CLOSE, but that cuts battery duration severely. In flight, land as soon as practical unless a generator can be brought back.</p>
      </div>
    </div>
  </section>

  <section class="block" id="extpwr">
    <h2>External power</h2>
    <div class="two-col">
      <div class="prose">
        <p>The receptacle is under the right wing, outboard of the nacelle, and takes a standard AN plug. The external power relay closes only when polarity is correct and the EXT PWR switch is ON. As external power comes in, both gen ties close, so every bus, including the starters, is powered.</p>
        <p>With the plug connected and BAT on, the EXT PWR annunciator flashes if the power unit or the EXT PWR switch is off, or if voltage is low. It is steady when external power is on line and adequate. Check GPU voltage before switching on by selecting EXT PWR on the voltmeter.</p>
      </div>
      <ul class="tight card">
        <li>Over-voltage sensor opens the relay above <b class="mono">31 ±0.5 V</b>.</li>
        <li>EXT PWR flashes below <b class="mono">24 ±1.5 V</b>.</li>
        <li>GPU must supply up to <b class="mono">1000 A</b> momentarily and <b class="mono">300 A</b> continuous for starts. A weak unit can make the starter relay chatter and weld its contacts.</li>
        <li>Prolonged exposure above <b class="mono">30 V</b> can damage the battery.</li>
        <li>Reduce electrical load to the practical minimum before an external power start.</li>
      </ul>
    </div>
    <div class="callout warning"><b>Caution</b>Recommended minimum battery voltage before connecting external power is 23 V. Never connect external power unless the installed battery shows at least 20 V. Always apply battery power first, because the avionics master relays need voltage to remove power from the avionics.</div>
  </section>

  <section class="block" id="ac">
    <h2>AC &amp; avionics power</h2>
    <div class="two-col">
      <div class="card">
        <h3>Avionics master</h3>
        <p>The AVIONICS MASTER POWER switch on the pilot's left subpanel controls the three avionics buses together. No. 1 is fed from the triple-fed bus, No. 2 from the left gen bus and No. 3 from the right gen bus. If every radio drops off line without a breaker tripping, the master switch is the likely cause. Pull the AVIONICS MASTER breaker on the copilot's panel to bypass it.</p>
      </div>
      <div class="card">
        <h3>Inverters (summary)</h3>
        <p>Two solid-state inverters in the wings, outboard of each nacelle, produce 115 V and 26 V AC at 400 Hz. Each feeds its own 115 V and 26 V AC buses and is typically rated 750 VA. Both are used for flight. No. 1 takes DC from the center bus and No. 2 from the right gen bus. Each switch is ON – OFF – BUS TRANSFER. An inverter monitor lights #1 or #2 AC BUS when voltage or frequency goes out of tolerance. BUS TRANSFER moves a failed inverter's buses to the other inverter. The inverter schematics are not part of the interactive diagram.</p>
      </div>
    </div>
  </section>

  <section class="block" id="cb">
    <h2>Circuit breakers</h2>
    <div class="prose">
      <p>Two breaker panels are in the cockpit. The smaller one, left of the pilot below the fuel management panel, holds the fuel system, AC electrical, battery bus and dual-fed bus breakers. The larger one on the copilot's sidewall covers engine systems, avionics, environmental, lighting, annunciators, bus ties and avionics bus feeders. Some loads, such as exterior lighting and ice protection, use circuit-breaker switches on the pilot's right subpanel, with the rating stamped on the switch.</p>
    </div>
    <div class="callout"><b>Tripped breaker</b>Non-essential circuit: do not reset in flight. Essential circuit, such as avionics: let it cool, then push once to reset. If it trips again, do not reset it. Use the bus chart to work out what equipment is lost.</div>
  </section>

  <section class="block" id="abnormal">
    <h2>Abnormal indications</h2>
    <p class="prose">Gen bus and center bus faults show up as bus-tie annunciators. A triple-fed bus fault has no tie annunciation, so confirm any bus problem with lost equipment, the voltmeter and the loadmeters. Summary only. Fly the POH/AFM procedures.</p>
    <div class="bus-table-wrap">
      <table>
        <thead><tr><th>Indication</th><th>Meaning</th><th>Pilot response (summary)</th></tr></thead>
        <tbody>
          <tr><td><span class="chip amber">L / R DC GEN</span></td><td>Generator off line</td><td>Confirm on the loadmeter. GEN switch to RESET for about 1 s, then ON. If it won't reset, turn it OFF, run on the other generator at or below 100% load, and shed non-essential equipment.</td></tr>
          <tr><td><span class="chip amber">L / R GEN TIE OPEN</span></td><td>That gen tie is open, possibly a gen bus fault</td><td>Check that loadmeter. Below 100% and normal: BUS SENSE to RESET. Above 100% or abnormal: that generator OFF, and keep the other at or below 100%. If the tie won't reset, monitor the loadmeters. Paralleling is lost, so loads won't match.</td></tr>
          <tr><td><span class="chip amber">BAT TIE OPEN</span></td><td>Battery tie open, possibly a center bus fault</td><td>Check center bus voltage. At 24–28 V, BUS SENSE RESET (a transient tripped the sensor). At 0 V, a center bus fault: GEN TIES OPEN and confirm both GEN TIE OPEN lights, pull the LANDING GEAR RELAY breaker, extend the gear manually, turn air conditioning off before gear extension, No. 1 inverter to BUS TRANSFER. The battery cannot charge.</td></tr>
          <tr><td><span class="chip amber">BATTERY CHARGE</span></td><td>Charge current above 7 A for 6 s</td><td>Normal for a few minutes after a start, and it acts as the system self-test. In flight: positive and decreasing on the ammeter, keep monitoring. Steady or increasing, BAT switch OFF. If it still shows charge with BAT off, land as soon as practical. GEN TIES OPEN stops current reaching the battery through the center bus.</td></tr>
          <tr><td><span class="chip amber">EXT PWR</span></td><td>Plug connected (BAT on)</td><td>Flashing: power unit off, EXT PWR switch off, or voltage low. Steady: external power on line.</td></tr>
          <tr><td><span class="chip green">MAN TIES CLOSE</span></td><td>Gen ties manually latched closed</td><td>Goes out when a generator comes on line. Do not use after a dual-generator failure.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="callout"><b>Ni-Cad condition check (ground)</b>After start the charge current is high and BATTERY CHARGE comes on. Within five minutes the ammeter should drop below 7 A and the light should go out. If the current holds steady or rises, turn the battery OFF and have it checked by a nickel-cadmium battery shop. The same check works before shutdown.</div>
  </section>

  <section class="block" id="loadmgmt">
    <h2>Load management after dual generator failure <span class="ref">Table 2-2</span></h2>
    <p class="prose">With only the "continuous" items running, the main battery lasts about <b>30 minutes</b>, based on a 50 A load and 75% battery capacity. Items with a set operating time cut battery duration by the amounts listed, and the reductions add up. Do not place GEN TIES to MAN CLOSE, because that reconnects both gen bus loads.</p>
    <div class="bus-table-wrap">
      <table id="lmTable">
        <thead><tr><th>Equipment</th><th>Operating time (min)</th><th class="num">Reduction in battery duration (min)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="disclaimer">* Optional equipment, powered by an auxiliary battery. Which attitude instruments remain depends on the specific panel installation.</p>
  </section>

    <h1>Master Warning System</h1>
    <p class="lede">Warning and caution annunciators are the first sign of trouble in a system or component. The King Air 350 sorts them by urgency. Red needs immediate action, yellow needs attention, green confirms something you selected, and white reports a condition that may be normal or not.</p>
    <p class="disclaimer">Study aid built from a King Air 300/350 pilot training manual chapter, King Air 350 content only. It is not an approved document. The POH/AFM governs.</p>

  <section class="block" id="mw-panels">

    <p class="prose">Click any annunciator to light it. The cause appears underneath. A red warning sets off both MASTER WARNING flashers and a yellow caution sets off MASTER CAUTION. Press a flasher to reset it, as you would in the airplane. Click a lit annunciator again to clear the fault.</p>

  <section class="block" id="mw-how">
    <h2>How the system works</h2>
    <div class="two-col">
      <div class="card"><h3>Layout</h3><p>The red warning annunciator panel sits in the center of the glareshield, with a PRESS TO TEST button immediately to its right. The caution/advisory/status panel is on the center subpanel. Two red MASTER WARNING flashers, one in front of each pilot, are in the glareshield, with a yellow MASTER CAUTION flasher just inboard of each. All annunciators are the word-readout type.</p></div>
      <div class="card"><h3>Warning (red)</h3><p>A fault that needs the pilot's immediate attention and reaction lights its red annunciator and starts both MASTER WARNING flashers. The annunciator stays on until the fault is corrected. Pressing either flasher silences both, even with the fault still present. A new warning reactivates them. When the fault clears, the annunciator goes out but the flashers keep flashing until one is pressed.</p></div>
      <div class="card"><h3>Caution (yellow)</h3><p>A fault that needs the pilot's attention, but not an immediate reaction, lights a yellow caution and both MASTER CAUTION flashers. Pressing a flasher resets the circuit, and any new caution sets it off again. The caution annunciator itself goes out only when the condition is corrected.</p></div>
      <div class="card"><h3>Advisory (green) &amp; status (white)</h3><p>On the 350, green advisories confirm that an operation the pilot selected actually happened. White status annunciators show a condition that may be normal or abnormal and may or may not have been pilot-initiated. Neither has a master flasher, and they go out only when the condition changes.</p></div>
      <div class="card"><h3>Autofeather lights</h3><p>Two green AUTOFEATHER annunciators sit on the pilot's glareshield next to the left fire extinguisher switch on airplanes prior to FL-120. From FL-120 they are next to the torquemeters on the instrument panel.</p></div>
    </div>
  </section>

  <section class="block" id="mw-dim">
    <h2>Dimming &amp; testing</h2>
    <div class="two-col">
      <div class="card">
        <h3>King Air 350 dimming</h3>
        <p>The flashers, all annunciators, the firewall fuel valve pushbutton lights, the gear handle lights and the gear position lights have BRIGHT and DIM modes, with intensity set by a photoelectric cell. DIM is selected automatically only when <b>all</b> of these are true:</p>
        <ul class="tight"><li>A generator is on line.</li><li>Pilot's or copilot's overhead floodlights are OFF.</li><li>MASTER PANEL LIGHTS switch is ON.</li><li>Pilot's flight lights are ON.</li><li>Cockpit ambient light, sensed by the photocell in the overhead light control panel, is below a preset level.</li></ul>
        <p>Otherwise BRIGHT is used. Fire extinguisher pushbutton lights never dim. The glareshield AUTOFEATHER lights use their own rheostat.</p>
      </div>
      <div class="card">
        <h3>Test &amp; lamp replacement</h3>
        <p>Test the lamps before every flight, and any time you doubt a lamp. PRESS TO TEST lights every annunciator and both pairs of flashers. Replace any lamp that stays dark.</p>
        <p>To replace one, press the center of the annunciator and release so the lens pops out, then pull it from the panel. Swap the failed bulb for a spare taken from an unused annunciator position, and press the lens back in until it locks.</p>
      </div>
    </div>
  </section>

  <section class="block" id="f-tanks">
    <h2>Tanks &amp; capacity <span class="ref">Figures 5-2, 5-3</span></h2>
    <div class="two-col">
      <div class="prose">
        <p><b>Main system (each wing).</b> Two leading-edge bladder cells, two box-section bladder cells, one integral wet-wing cell and the nacelle tank. All are joined by gravity feed lines that drain into the nacelle tank, and each engine pumps directly from its own nacelle tank. The main filler is near the wingtip on the leading edge, with an anti-siphon valve that prevents fuel loss or bladder collapse if the cap is left improperly installed.</p>
        <p><b>Auxiliary system.</b> One tank each side in the wing center section, with its own filler and anti-siphon valve on top of the center section, inboard of each nacelle. The aux tanks sit lower than the nacelle tanks and cannot gravity-feed. A jet pump in each aux sump moves the fuel instead. Because that transfer keeps the nacelle tank full, aux fuel is used first.</p>
      </div>
      <div class="bus-table-wrap">
        <table class="cap-table">
          <thead><tr><th>Cell (each wing)</th><th>Usable gal</th></tr></thead>
          <tbody>
            <tr><td>Wing leading edge, outboard</td><td>13</td></tr>
            <tr><td>Wing leading edge, inboard</td><td>40</td></tr>
            <tr><td>Integral (wet wing) cell</td><td>35</td></tr>
            <tr><td>Box section cell</td><td>25</td></tr>
            <tr><td>Box section cell</td><td>23</td></tr>
            <tr><td>Nacelle tank</td><td>54</td></tr>
            <tr><td><b>Main system total</b></td><td><b>190 (≈1,273 lb)</b></td></tr>
            <tr><td>Auxiliary tank</td><td>79.5 (≈533 lb)</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="block" id="f-path">
    <h2>Fuel path to the engine</h2>
    <p class="prose">Outer wing and aux fuel reach the nacelle tank automatically, with no pilot action. The outer cells gravity-feed through a line from the aft inboard cell, forward along the outboard side of the nacelle tank. A gravity flow check valve at its end stops fuel from flowing back into the wing. From the nacelle tank:</p>
    <ol class="steps" id="fSteps"></ol>
  </section>

  <section class="block" id="f-pumps">
    <h2>Pumps &amp; firewall valves</h2>
    <div class="two-col">
      <div class="card"><h3>Engine-driven high-pressure pump</h3><p>Mounted with the FCU on the accessory case and protected by an internal strainer. Output is up to 1,050 psi, varying with N1 and FCU operation. If it fails, the engine flames out.</p></div>
      <div class="card"><h3>Engine-driven boost pump</h3><p>Turns whenever N1 turns and supplies the high-pressure pump in all conditions except crossfeed or aviation gasoline. Capacity is 1,250 pph at 30 psi. Its pressure also provides motive flow for aux transfer.</p></div>
      <div class="card"><h3>Electric standby boost pump</h3><p>In the bottom of each nacelle tank. It backs up the engine-driven boost pump and provides the pressure for crossfeed. A lever-lock switch on the fuel panel controls it. Power comes from the respective gen bus (two 10 A breakers below the fuel panel) and from the triple-fed bus, with a diode network keeping the two sources apart. Either boost pump alone meets the engine's minimum inlet pressure. The engine keeps running with one or both boost pumps failed.</p></div>
      <div class="card"><h3>Firewall fuel valves</h3><p>Motorized valves just behind each firewall, operated by alternate-action pushbuttons in the glareshield below each end of the warning panel. Push to close, push again to open. The <b>FW VALVE CLOSED</b> light is on with the valve closed, out with it open, and flashing while it travels or isn't in the selected position. Closing a valve also arms that side's fire extinguisher (EXTINGUISHER PUSH lights) regardless of the battery switch.</p></div>
    </div>
    <div class="callout"><b>Caution</b>Operation with FUEL PRES LO on, or on suction lift after both boost pumps fail, is limited to 10 hours total between overhaul or replacement of the engine-driven high-pressure pump. Windmilling time does not count toward the 10 hours.</div>
  </section>

  <section class="block" id="f-xfer">
    <h2>Auxiliary fuel transfer (motive flow) <span class="ref">Figures 5-6 to 5-9</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>Boost pump pressure, from the engine-driven or the standby pump, is the motive flow that drives the jet transfer pump. The line runs along the outboard side of the nacelle, through the normally closed <b>motive flow valve</b> just aft of the firewall, past a check valve that keeps the engine from drawing air when no boost pump runs, and on to the jet pump in the aux tank sump.</p>
        <p>Transfer is faster than the engine burns fuel, so the excess leaves an overflow tube at the top of the nacelle tank. It passes a 1½ psi relief valve and returns to the aux tank.</p>
        <p>A 6 ±1 psi switch beyond the motive flow valve confirms motive pressure. <b>L/R NO FUEL XFR</b> lights when pressure is below that while the float switch still senses fuel in the aux tank. An 11 s delay filters out transients. If the light stays on, AUX TRANSFER to <b>OVERRIDE</b> bypasses the transfer module and powers the valve directly. Override cannot help if both boost pumps or the motive flow valve itself have failed.</p>
      </div>
      <div class="card">
        <h3>With the switch in AUTO, the transfer module…</h3>
        <ul class="tight">
          <li><b>Opens</b> the motive flow valve when the boost pump pressure switch senses pressure <i>and</i> the float switch senses aux fuel.</li>
          <li><b>Closes</b> it 6–7 s after the float switch senses an empty aux tank. The delay prevents cycling from sloshing.</li>
          <li><b>Closes</b> it when boost pressure drops below 10 psi (FUEL PRES LO).</li>
          <li><b>Closes</b> it whenever that engine's ignition is powered (start switch or auto-ignition), which lights NO FUEL XFR.</li>
          <li><b>Closes</b> it on the side <i>receiving</i> crossfeed. The supplying (dead-engine) side keeps transferring.</li>
        </ul>
        <p class="ann-note" style="color:var(--muted)">The jet pump isn't harmed by running dry, but it draws moist air into the main system from the vented aux tank.</p>
      </div>
    </div>
  </section>

  <section class="block" id="f-xfeed">
    <h2>Crossfeed <span class="ref">Figure 5-10</span></h2>
    <div class="two-col">
      <div class="prose">
        <p>A crossfeed line joins each nacelle tank to the opposite engine. It runs from the inboard side of each nacelle, aft through the center section, controlled by a valve at the aft inboard corner of the left nacelle. Crossfeed is for <b>single-engine operation only</b>. It supplies the operating engine from the other side and does not move fuel from tank to tank.</p>
        <p>Selecting CROSSFEED draws power from a 5 A breaker on the fuel panel to open the crossfeed valve. At the same time the transfer module turns on the standby pump on the supplying side and closes the motive flow valve on the receiving side. On the 350 the green <b>FUEL CROSSFEED</b> light confirms the valve has opened. With both standby pumps running and the valve open, each engine feeds normally because the pressures balance.</p>
      </div>
      <div class="mw-stack">
        <div class="callout"><b>Precaution</b>AUX TRANSFER must be in AUTO on the receiving side. In OVERRIDE its motive flow valve stays open, and incoming crossfeed fuel starts filling the receiving side's tanks through the transfer line. That fuel can be dumped overboard.</div>
        <div class="callout"><b>Precaution</b>Leave both standby pump switches OFF. Crossfeed turns on the pump it needs.</div>
        <div class="callout"><b>Precaution</b>If the dead engine's firewall valve was closed at shutdown, its FUEL PRES LO stays on and its aux fuel is unusable, because there is no motive flow pressure.</div>
      </div>
    </div>
  </section>

  <section class="block" id="f-qty">
    <h2>Quantity indication</h2>
    <div class="two-col">
      <div class="prose">
        <p>Capacitance gaging, compensated for specific gravity, reads in pounds on a linear scale (×100). Each side is independent. There is one probe in the nacelle cell, one in the aft inboard cell, two in the wet-wing cell, two in the inboard leading-edge cell and two in the center-section (aux) tank. Each probe is two concentric tubes. Fuel, with a dielectric constant of about 2, displaces air (constant 1) between them, so capacitance rises in direct proportion to fuel volume.</p>
        <p>The FUEL QUANTITY switch is spring-loaded to <b>MAIN</b>. Hold <b>AUXILIARY</b> to read the aux tanks. Hold <b>TEST</b> to test the low-fuel sensing.</p>
      </div>
      <div class="card">
        <h3>Low fuel: L/R FUEL QTY</h3>
        <p>Fiber-optic sensors in each nacelle tank light FUEL QTY, with MASTER CAUTION, when a side's main system drops below about 300 lb. That's 45 gal, about 30 minutes at maximum continuous power. A 5–7 s delay screens out sloshing, and a holding circuit keeps the light on 3–5 s once lit. Holding TEST lights both after about 5 s. On release they go out after about 5 s.</p>
      </div>
    </div>
  </section>

  <section class="block" id="f-vents">
    <h2>Vents, drains &amp; manifold purge <span class="ref">Figures 5-11, 5-13, 5-14</span></h2>
    <div class="two-col">
      <div class="card"><h3>Vents</h3><p>Each side vents through a recessed vent, which resists icing, coupled to a heated ram vent under the wing beside the nacelle. Vent float valves in the integral cell and nacelle tank, plus a float check valve in the line to the aux tank, pass air both ways but seal against fuel. Wingtip air inlets with check valves are backup paths and a siphon break. Cold fuel that expands on the ground travels wing → nacelle → return line → aux tank → wingtip → leading-edge vent line, and out the ram vents.</p></div>
      <div class="card"><h3>Fuel manifold purge</h3><p>Uses P3 air stored in a purge tank to blow residual fuel out of the fuel manifold into the combustion chamber at shutdown, where it is consumed. Covered in the Powerplant chapter.</p></div>
    </div>
    <div class="bus-table-wrap">
      <table><thead><tr><th>Drain (each wing)</th><th>Location</th></tr></thead><tbody>
        <tr><td>Flush fuel drain (wet-wing cell sump)</td><td>Underside of wing, forward of aileron</td></tr>
        <tr><td>Gravity line drain</td><td>Outboard of nacelle, underside of wing (just aft of wheel well)</td></tr>
        <tr><td>Fuel drain (leading-edge tank)</td><td>Outboard of nacelle, underside of wing</td></tr>
        <tr><td>Strainer drain (nacelle sump)</td><td>Bottom of nacelle, outboard of the two nacelle drains</td></tr>
        <tr><td>Filter drain (firewall fuel filter)</td><td>Forward of wheel well, right of the filter</td></tr>
        <tr><td>Inboard fuel tank drain (aux tank)</td><td>Underside of wing by the wing root</td></tr>
      </tbody></table>
    </div>
    <div class="callout"><b>Note</b>The inboard nacelle drain is the standby pump drain. Do not drain it on preflight. Never twist the drain tool on flush drains, because twisting unseats the O-ring and causes a leak. Water settles slowly in jet fuel. Let the airplane sit about four hours after fueling before sampling.</div>
  </section>

  <section class="block" id="f-limits">
    <h2>Limitations &amp; fuel handling</h2>
    <div class="two-col">
      <ul class="tight card">
        <li>FUEL PRES LO on, or suction lift: 10 hours maximum before high-pressure pump overhaul or replacement.</li>
        <li>King Air 350 maximum zero fuel weight: 12,500 lb.</li>
        <li>Aviation gasoline: 150 hours maximum between engine overhauls. Roughly every 55 gal of avgas added uses one hour per engine.</li>
        <li>With avgas aboard, operation is prohibited with either standby pump inoperative. Crossfeed capability is required for climbs above 20,000 ft pressure altitude.</li>
        <li>Fill the main tanks before the aux tanks, to limit wing bending moment.</li>
        <li>Maximum fuel imbalance: 300 lb.</li>
        <li>No takeoff with fuel gauges in the yellow arc, or with less than 265 lb in each main system.</li>
        <li>Crossfeed only with one engine inoperative.</li>
        <li>Fuel anti-icing additive required below −45 °C OAT.</li>
      </ul>
      <div class="mw-stack">
        <div class="callout warning"><b>Warning</b>One operative standby pump is required for takeoff with recommended fuels. Crossfeed is then unavailable from the side with the inoperative standby pump.</div>
        <div class="card"><h3>Fuels &amp; additives</h3><p>Jet A, Jet A-1, Jet B, JP-4, JP-5 and JP-8 mix in any ratio. Avgas grades 80/87 through 115/145 are emergency fuels. Use the lowest octane available, because it has the least lead. Anti-icing additive is MIL-I-27686. BIOBOR JF biocide at 135 or 270 ppm may be used alone or with the anti-icing additive.</p></div>
        <div class="card"><h3>Handling</h3><p>Dissolved water is the main contamination problem. Cooling in flight releases it as supercooled droplets that can ice a filter, with the worst range at 0 to −2 °F. Know your supplier, insist on filtered fuel, inspect filters for sludge, use clean equipment, allow settling, and drain every sump. Ground the airplane to the servicing unit and the ramp when fueling.</p></div>
      </div>
    </div>
  </section>
</div>

/* ================= Electrical: simulation ================= */
function fresh() {
  return { bat: false, batBus: "NORMAL", gen: { L: "OFF", R: "OFF" }, genTies: "NORM", start: { L: "OFF", R: "OFF" }, extSw: false, gpu: false,
    n1: { L: 0, R: 0 }, lit: { L: false, R: false }, excited: { L: false, R: false }, fail: { L: false, R: false },
    short: { LGB: false, RGB: false, CTR: false, TF: false }, trip: { L: false, R: false, B: false }, manLatch: false,
    blown: { L250: false, R250: false, L60: false, R60: false, B60: false },
    deficit: 0, chgT: 0, strT: { L: 0, R: 0 }, strWarned: { L: false, R: false }, volt: "CTR", t: 0 };
}
let S = fresh();
let D = null;          // derived state from evaluate()
let M = { genA: { L: 0, R: 0 }, batA: 0, batV: 24.4, gpuA: 0 };   // meters
let timer = null;
let selected = null;
let scenIdx = 0;
let momentary = {};    // visual hold for spring-loaded positions

const NETS = ["LGEN", "RGEN", "LGB", "RGB", "LTA", "RTA", "CTR", "GPU", "BATN", "BATBUS", "DFB", "BRL", "B60", "TF", "L60", "R60", "TF20", "LSTR", "RSTR"];
const SHORTABLE = { LGB: "LGB", RGB: "RGB", CTR: "CTR", TF: "TF" };

function genOut(k) { return S.n1[k] >= 45 && (S.gen[k] === "ON" || S.gen[k] === "RESET") && S.excited[k] && !S.fail[k] && S.start[k] === "OFF"; }
function genOnline(k) { return genOut(k) && S.gen[k] === "ON"; }

function relays() {
  const r = {};
  r.rccb = S.batBus === "NORMAL";
  r.batCtl = r.rccb && S.bat;              // BAT switch control power is taken from the battery bus
  r.batRelay = r.batCtl;
  r.batTie = r.batCtl && !S.trip.B;
  r.ext = S.gpu && S.extSw;
  r.lineL = genOnline("L"); r.lineR = genOnline("R");
  r.tiesCmd = S.genTies !== "OPEN" && (r.lineL || r.lineR || r.ext || S.manLatch);
  r.tieL = r.tiesCmd && !S.trip.L; r.tieR = r.tiesCmd && !S.trip.R;
  r.strL = false; r.strR = false;
  return r;
}

function solve(r) {
  const E = [
    ["LGEN", "LGB", r.lineL, 0], ["LGB", "LTA", !S.blown.L250, 0], ["LTA", "CTR", r.tieL, 0],
    ["RGEN", "RGB", r.lineR, 0], ["RGB", "RTA", !S.blown.R250, 0], ["RTA", "CTR", r.tieR, 0],
    ["GPU", "CTR", r.ext, 1], ["CTR", "BATN", r.batTie, 0], ["BATN", "BATBUS", r.rccb, 0],
    ["BATBUS", "DFB", true, 1], ["BATN", "BRL", r.batRelay, 0], ["BRL", "B60", !S.blown.B60, 0], ["B60", "TF", true, 1],
    ["LGB", "L60", !S.blown.L60, 0], ["L60", "TF", true, 1], ["RGB", "R60", !S.blown.R60, 0], ["R60", "TF", true, 1],
    ["TF", "TF20", true, 0], ["TF20", "DFB", true, 1],
    ["CTR", "LSTR", r.strL, 1], ["CTR", "RSTR", r.strR, 1]
  ];
  const adj = {}; NETS.forEach(n => adj[n] = []);
  E.forEach(([a, b, on, dir]) => { if (!on) return; adj[a].push(b); if (!dir) adj[b].push(a); });
  const srcs = [["BAT", "BATN", 1]];
  if (genOut("L")) srcs.push(["LGEN", "LGEN", 2]);
  if (genOut("R")) srcs.push(["RGEN", "RGEN", 2]);
  if (S.gpu) srcs.push(["GPU", "GPU", 3]);
  const reach = {}, level = {}; NETS.forEach(n => level[n] = 0);
  srcs.forEach(([id, start, lv]) => {
    const seen = new Set([start]), q = [start];
    while (q.length) {
      const n = q.shift();
      if (SHORTABLE[n] && S.short[n]) continue;    // a grounded net passes nothing on
      adj[n].forEach(m => { if (!seen.has(m)) { seen.add(m); q.push(m); } });
    }
    reach[id] = { set: seen, lv };
    seen.forEach(n => { if (!(SHORTABLE[n] && S.short[n])) level[n] = Math.max(level[n], lv); });
  });
  return { reach, level };
}

let evLog = [];
function log(msg, cls) {
  evLog.unshift({ t: S.t, msg, cls: cls || "" });
  if (evLog.length > 40) evLog.pop();
  renderLog();
}

function evaluate(quiet) {
  const prev = D;
  let r, P;
  for (let i = 0; i < 6; i++) {
    r = relays(); P = solve(r);
    let ch = false;
    const desens = S.start.L !== "OFF" || S.start.R !== "OFF";
    ["L", "R"].forEach(k => {
      const net = k + "GB", n = SIDE[k].toLowerCase();
      if (S.short[net]) {
        if (S.excited[k]) { S.excited[k] = false; ch = true; if (!quiet) log(`${SIDE[k]} GCU takes its generator off line (short on ${n} gen bus).`, "bad"); }
        if (r["tie" + k] && !S.blown[k + "250"] && P.level.CTR > 0) {
          if (desens) { S.blown[k + "250"] = true; if (!quiet) log(`Start in progress, sensors desensitized: ${n} 250 A limiter opens.`, "bad"); }
          else { S.trip[k] = true; if (!quiet) log(`${SIDE[k]} Hall-effect sensor sees >275 A flowing toward the ${n} gen bus and opens the ${n} gen tie.`, "bad"); }
          ch = true;
        }
      }
      if (S.fail[k] && S.excited[k]) { S.excited[k] = false; ch = true; if (!quiet) log(`${SIDE[k]} generator fails, GCU opens the line contactor.`, "bad"); }
    });
    if (S.short.CTR) {
      if (r.batTie) { S.trip.B = true; ch = true; if (!quiet) log("Battery Hall-effect sensor sees >275 A flowing toward the center bus and opens the battery tie.", "bad"); }
      ["L", "R"].forEach(k => {
        if (r["tie" + k] && !S.blown[k + "250"] && P.level[k + "GB"] > 0) { S.blown[k + "250"] = true; ch = true; if (!quiet) log(`${SIDE[k]} 250 A limiter opens. The gen tie sensor can't see current flowing toward the center bus.`, "bad"); }
      });
    }
    if (S.short.TF) {
      if (!S.blown.L60 && P.level.LGB > 0) { S.blown.L60 = true; ch = true; if (!quiet) log("Left 60 A triple-fed limiter opens.", "bad"); }
      if (!S.blown.R60 && P.level.RGB > 0) { S.blown.R60 = true; ch = true; if (!quiet) log("Right 60 A triple-fed limiter opens.", "bad"); }
      if (!S.blown.B60 && r.batRelay) { S.blown.B60 = true; ch = true; if (!quiet) log("Battery 60 A triple-fed limiter opens. Triple-fed bus isolated.", "bad"); }
    }
    if (S.manLatch && (r.lineL || r.lineR)) { S.manLatch = false; ch = true; if (!quiet) log("Generator on line: GCU now holds the gen ties, MAN TIES CLOSE goes out."); }
    if (S.manLatch && (S.genTies === "OPEN" || P.level.CTR === 0)) { S.manLatch = false; ch = true; }
    if (!ch) break;
  }
  const tfLive = P.level.TF > 0;
  r.strL = S.start.L !== "OFF" && tfLive && P.level.CTR > 0;
  r.strR = S.start.R !== "OFF" && tfLive && P.level.CTR > 0;
  P = solve(r);
  D = { r, P };

  if (prev && !quiet) {
    const pr = prev.r;
    const msg = (key, on, off, cls) => { if (pr[key] !== r[key]) log(r[key] ? on : off, r[key] ? "" : (cls || "")); };
    msg("batRelay", "Battery relay closes. Battery feeds the triple-fed bus.", "Battery relay opens.");
    msg("batTie", "Battery bus tie closes. Battery connected to the center bus and starter relays.", "Battery bus tie opens.", "warn");
    msg("rccb", "RCCB closes. Battery bus and dual-fed bus powered.", "RCCB opens. Battery bus de-powered.", "warn");
    msg("lineL", "Left line contactor closes. Left generator on line.", "Left line contactor opens. Left generator off line.", "warn");
    msg("lineR", "Right line contactor closes. Right generator on line.", "Right line contactor opens. Right generator off line.", "warn");
    msg("tieL", "Left gen tie closes.", "Left gen tie opens.", "warn");
    msg("tieR", "Right gen tie closes.", "Right gen tie opens.", "warn");
    msg("ext", "External power relay closes. External power on line.", "External power relay opens.");
    msg("strL", "Left starter relay closes. Starter motoring.", "Left starter relay opens.");
    msg("strR", "Right starter relay closes. Starter motoring.", "Right starter relay opens.");
    if (pr.tiesCmd && !r.tiesCmd && (pr.lineL || pr.lineR) && !r.lineL && !r.lineR && S.genTies !== "OPEN")
      log("No generator on line: the gen ties open and the gen bus loads are shed.", "warn");
  }
  render();
}

/* ---------- loads, battery and engines (time step) ---------- */
const LOADS = { LGB: 45, RGB: 55, CTR: 20, TF: 25, BATBUS: 2, DFB: 3 };
const USABLE_AS = 97200;   // 36 Ah × 75% in amp-seconds

function suppliers(net) {
  const lv = D.P.level[net]; if (!lv) return [];
  return Object.keys(D.P.reach).filter(id => D.P.reach[id].lv === lv && D.P.reach[id].set.has(net));
}

function step(dt) {
  S.t += dt;
  let needEval = false;
  ["L", "R"].forEach(k => {
    const turning = D.r["str" + k];
    if (turning) { S.strT[k] += dt; if (S.strT[k] > 30 && !S.strWarned[k]) { S.strWarned[k] = true; log(`${SIDE[k]} starter has run 30 s. Limit is 30 s ON, then 5 min OFF.`, "warn"); } }
    else { S.strT[k] = 0; S.strWarned[k] = false; }
    const before = S.n1[k];
    if (S.lit[k]) S.n1[k] = Math.min(62, S.n1[k] + (turning ? 7 : 5) * dt);
    else if (turning) {
      S.n1[k] = Math.min(20, S.n1[k] + 3.2 * dt);
      if (S.start[k] === "ON" && S.n1[k] >= 12) { S.lit[k] = true; log(`${SIDE[k]} engine light-off at ${S.n1[k].toFixed(0)}% N1.`); }
    } else S.n1[k] = Math.max(0, S.n1[k] - 6 * dt);
    if (before < 62 && S.n1[k] >= 62 && S.lit[k] && S.start[k] !== "OFF") log(`${SIDE[k]} engine stabilized at idle. Set its start switch to OFF, then GEN RESET → ON.`);
    if (S.n1[k] < 45 && S.excited[k]) { S.excited[k] = false; }
    if ((before >= 45) !== (S.n1[k] >= 45)) needEval = true;
  });
  if (needEval) evaluate();
  else evaluate(true);

  // distribute loads
  const genA = { L: 0, R: 0 }; let batDis = 0, gpuA = 0;
  const add = (net, amps) => {
    if (S.short[net] || !D.P.level[net]) return;
    const sup = suppliers(net); if (!sup.length) return;
    const share = amps / sup.length;
    sup.forEach(id => { if (id === "BAT") batDis += share; else if (id === "GPU") gpuA += share; else genA[id.charAt(0)] += share; });
  };
  Object.keys(LOADS).forEach(n => add(n, LOADS[n]));
  ["L", "R"].forEach(k => { if (D.r["str" + k] && D.P.level[k + "STR"]) add(k + "STR", S.n1[k] < 12 ? 380 : 260); });
  // cross-generator start: operating GCU limits to 400 A, the battery supplies the rest
  ["L", "R"].forEach(k => {
    const o = k === "L" ? "R" : "L";
    if (S.start[o] !== "OFF" && genA[k] > 400) { batDis += (D.r.batTie ? genA[k] - 400 : 0); genA[k] = 400; }
  });
  let batA;
  const bl = D.P.level.BATN;
  if (bl >= 2) {
    const I = Math.min(110, 2 + S.deficit * 0.06);
    const sup = suppliers("BATN");
    sup.forEach(id => { if (id === "GPU") gpuA += I / sup.length; else if (id !== "BAT") genA[id.charAt(0)] += I / sup.length; });
    S.deficit = Math.max(0, S.deficit - I * dt * 1.6);
    batA = batDis > 0 ? I - batDis : I;
  } else {
    batA = -batDis;
    S.deficit = Math.min(USABLE_AS * 1.2, S.deficit + batDis * dt);
  }
  if (batA > 7) S.chgT += dt; else S.chgT = 0;
  const restV = 24.6 - 2.2 * Math.min(1, S.deficit / USABLE_AS);
  M = { genA, batA, gpuA, batDis, batV: bl >= 2 ? (bl === 3 ? 28.0 : 28.25) : Math.max(17.5, restV - 0.012 * batDis) };
  renderMeters();
}

const VB_W = 1040;

  const limiter = (key, x, y, ang) => `<g transform="translate(${x},${y}) rotate(${ang || 0})"><path class="lim" data-lim="${key}" d="M-14,-8 L0,0 L-14,8 Z M14,-8 L0,0 L14,8 Z"/></g>`;
  const diode = (x, y, ang) => `<g transform="translate(${x},${y}) rotate(${ang || 0})"><path class="sym-solid" d="M-8,-8 L7,0 L-8,8 Z"/><line class="sym-l" x1="8" y1="-9" x2="8" y2="9"/></g>`;

  syms.push(diode(q(0.35)[0], q(0.35)[1], Math.atan2(-238, -140) * 180 / Math.PI));

  comp("batBusSw", `${ground(205, 400)}${contacts("batBusSw", 230, 400)}<g transform="translate(335,400)"><path class="sym-l" d="M-14,0 A14,14 0 0 1 14,0"/><circle class="term" cx="-14" cy="0" r="2.5"/><circle class="term" cx="14" cy="0" r="2.5"/></g>
    ${T(230, 382, "BAT BUS SW", "lbl")}${T(335, 378, ".5A BAT BUS CTL", "lbl")}`, [192, 366, 172, 58]);
