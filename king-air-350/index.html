    <div class="tog"><div class="name">Auto ign</div><div class="pos">${[["ARM", "ARM"], ["OFF", "OFF"]].map(p => `<button type="button" id="ps-ai-${k}-${p[0]}" data-ps="ai:${k}" data-val="${p[0]}" aria-pressed="false">${p[1]}</button>`).join("")}</div></div></div></div>`).join("");
  $("#ppSwitches").addEventListener("click", e => {

    else { e2.autoIgn = b.dataset.val === "ARM"; ppLog(`${SIDE[k]} auto-ignition ${e2.autoIgn ? "armed: igniters fire whenever torque is below about 17%" : "off"}.`); }

  $("#envRow").innerHTML = `<div class="seg" role="group" aria-label="Phase"><button type="button" id="env-ground" data-env="ground">On ground</button><button type="button" id="env-flight" data-env="flight">In flight</button></div>

    <button type="button" class="pbtn envb" id="env-genL" data-env="genL">L generator load</button><button type="button" class="pbtn envb" id="env-genR" data-env="genR">R generator load</button><button type="button" class="pbtn envb" id="env-ac" data-env="ac">Air conditioner (R N1)</button>`;

    else { const [t, k] = b.dataset.pf.split(":"); PP.fault[t][k] = !PP.fault[t][k]; ppLog(`${PP.fault[t][k] ? "Fault" : "Repaired"}: ${b.textContent}.`, PP.fault[t][k] ? "bad" : ""); }
    ppSyncControls();
  });
}

function engGaugeSVG(g, id) {
  const A = v => -135 + 270 * (Math.max(g.min, Math.min(g.max, v)) - g.min) / (g.max - g.min);
  const P = (a, r) => [60 + r * Math.sin(a * Math.PI / 180), 60 - r * Math.cos(a * Math.PI / 180)];
  const arc = (a1, a2, r, col, w) => { const p1 = P(a1, r), p2 = P(a2, r); return `<path d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} A${r},${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}"/>`; };
  const radial = (v, col, w) => { const a = A(v), p1 = P(a, 52), p2 = P(a, 40); return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${col}" stroke-width="${w}"/>`; };
  let s = `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#141618" stroke="#5b636b" stroke-width="2"/>`;
  for (let i = 0; i <= 20; i++) { const a = -135 + 270 * i / 20, p1 = P(a, 52), p2 = P(a, i % 5 ? 48 : 45); s += `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#cfd5da" stroke-width="1"/>`; }
  if (g.green) s += arc(A(g.green[0]), A(g.green[1]), 49, "#3cbf5c", 4);
  (g.yellow || []).forEach(y => s += arc(A(y[0]), A(y[1]), 49, "#f2c21c", 4));
  (g.red || []).forEach(r => s += radial(r, "#e5483a", 3));
  if (g.white) s += radial(g.white, "#ffffff", 3);
  g.labels.forEach(([v, t]) => { const p = P(A(v), 33); s += `<text x="${p[0].toFixed(1)}" y="${(p[1] + 3).toFixed(1)}" font-size="9" text-anchor="middle">${t}</text>`; });
  s += `<text x="60" y="86" font-size="8" text-anchor="middle" fill="#9aa3ab">${g.unit}</text><line id="${id}N" x1="60" y1="60" x2="60" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" style="transform-origin:60px 60px;transition:transform .12s linear"/><circle cx="60" cy="60" r="5" fill="#cfd5da"/></svg>`;
  return s;
}

  $("#ppAnns").innerHTML = [["LOP", "L OIL PRES LO"], ["LFP", "L FUEL PRES LO"], ["RFP", "R FUEL PRES LO"], ["ROP", "R OIL PRES LO"], ["LCH", "L CHIP DETECT"], ["RVS", "RVS NOT READY"], ["", ""], ["RCH", "R CHIP DETECT"], ["LIG", "L IGNITION ON"], ["LPP", "L PROP PITCH"], ["RPP", "R PROP PITCH"], ["RIG", "R IGNITION ON"]]

function ppRender() {
  if (!$("#instPanel") || !PP) return;
  ["L", "R"].forEach(k => {
    const e = PP.E[k];
    IG.forEach(g => {
      const v = g.val(e), a = -135 + 270 * (Math.max(g.min, Math.min(g.max, v)) - g.min) / (g.max - g.min);
      $(`#ig-${g.id}-${k}N`).style.transform = `rotate(${a}deg)`;
      const t = $(`#ig-${g.id}-${k}V`), l = g.lim(v, e); t.textContent = g.fmt(v); t.className = "iv" + (l === 2 ? " over" : l === 1 ? " warn" : "");
    });
    const chip = $("#mchip-" + k), m = e.mode;
    chip.textContent = m; chip.className = "mchip " + ({ ALPHA: "alpha", BETA: "beta", "GROUND FINE": "beta", REVERSE: "rev", FEATHERED: "feather", STARTING: "start", "CSU FAILED": "rev", WINDMILLING: "rev" }[m] || "");
    $("#mtext-" + k).textContent = e.ctl + (e.lit ? ` Np set ${Math.round(npSetOf(e))} rpm.` : "");
    const deg = e.blade * 90;
    $("#blade-" + k).style.transform = `rotate(${-deg}deg)`;
    $("#bladeTxt-" + k).textContent = e.blade > 0.9 ? "FEATHER" : e.blade < -0.05 ? "REVERSE PITCH" : e.blade < 0.1 ? "NEAR ZERO PITCH" : e.blade < 0.2 ? "FLIGHT IDLE PITCH" : "COARSER (GOVERNING)";
  });
  const E = PP.E, F = PP.fault, gr = !PP.env.flight;
  const A = { LOP: ["red", E.L.oilP < 60], ROP: ["red", E.R.oilP < 60], LFP: ["red", F.boost.L || E.L.n1 < 5], RFP: ["red", F.boost.R || E.R.n1 < 5], LCH: ["amber", F.chip.L], RCH: ["amber", F.chip.R],
    RVS: ["amber", gr && (E.L.pr < 98 || E.R.pr < 98) && (E.L.lit || E.R.lit)], LIG: ["green", E.L.ign], RIG: ["green", E.R.ign], LPP: ["white", E.L.lit && E.L.pl < PL_IDLE], RPP: ["white", E.R.lit && E.R.pl < PL_IDLE] };
  Object.keys(A).forEach(k => { const el = $("#ppa-" + k); if (el) el.className = "ann" + (A[k][1] ? " " + A[k][0] : ""); });
  ppRenderDiagram();
  const n = $("#ppInfoNow"); if (n && ppSel) n.textContent = "Now: " + (PCOMP[ppSel].state ? PCOMP[ppSel].state(PP.E[ppSide]) : "");
}

/* ---------- diagrams ---------- */
const PCOMP = {};
function pc(id, group, name, desc, state) { PCOMP[id] = { group, name, desc, state }; }
pc("prop", "Propeller", "Four-blade propeller", "Full-feathering, reversing, constant-speed propeller on the reduction gearbox output shaft. Feathering springs and counterweights drive the blades toward high pitch and feather. Governor oil on the servo piston, aided by centrifugal twisting moment, drives them toward low pitch and reverse. Lose the oil and it feathers. It feathers automatically at shutdown and unfeathers as the engine starts.", e => `${Math.round(e.np)} rpm · ${e.mode.toLowerCase()}`);
pc("rgb", "Power section", "Reduction gearbox", "Two-stage planetary gearbox that turns the power turbine's high speed and low torque into propeller speed: 17.6:1 (29,920 rpm Nf → 1,700 rpm Np). The torquemeter sits in the first stage and the chip detector at the bottom of the nose case.", e => `Torque ${e.tq.toFixed(0)}%`);
pc("pgov", "Propeller control", "Propeller governor (CSU + fuel topping governor)", "Driven by the reduction gearbox. Flyweights against a speeder spring set by the prop lever meter oil from a built-in booster pump, up to about 400 psi, to the servo piston through the transfer sleeve. Onspeed holds oil, underspeed adds oil (lower pitch), and overspeed drains it (higher pitch). It also contains the beta valve and the fuel topping (Nf) governor, which cuts FCU fuel through a Py bleed if Np runs above the selected speed, and is reset below the selected speed in beta and reverse.", e => e.ctl);
pc("osgov", "Propeller control", "Hydraulic overspeed governor", "A separate, non-adjustable governor on its own drive pad, set above the CSU (typically around 104–106% Np). If the CSU and topping governor fail to hold Np, it dumps propeller oil to raise pitch. A ground TEST switch resets it below normal speed so its operation can be checked.", () => "Standby (no overspeed)");
pc("exh", "Power section", "Exhaust duct & twin exhaust stubs", "Gas leaving the power turbines exits through an annular plenum and two opposed exhaust ports at the front of the engine. Residual jet thrust is about 10% of total power (158 lb at takeoff).", e => e.lit ? "Hot exhaust" : "Cold");
pc("pt", "Power section", "Power turbine (2 stages)", "Drives the propeller shaft through the reduction gearbox. It has no mechanical link to the gas generator: a free turbine. It extracts the roughly 40% of gas energy left after the compressor turbine.", e => `Np ${Math.round(e.np)} rpm`);
pc("ct", "Gas generator", "Compressor turbine (1 stage)", "Single-stage turbine that drives the compressor and accessory gearbox (N1). It extracts about 60% of the energy in the combustion gas and turns opposite to the power turbine.", e => `N1 ${e.n1.toFixed(1)}%`);
pc("itt", "Gas generator", "ITT (T5) probes", "Thermocouples between the compressor turbine and first power turbine stage. ITT is the main temperature limit: 400–820 °C normal, 820 °C maximum continuous, 750 °C at idle, 1,000 °C for starting only (5 s). The gauge is self-powered.", e => `${Math.round(e.itt)} °C`);
pc("comb", "Gas generator", "Annular combustion chamber", "Air turns 180° to enter the liner. About 25% burns with fuel, and 75% centers the flame and cools. Hot gas reverses again in the exit duct toward the turbines. The folded design does away with a long shaft.", e => e.lit ? "Burning" : "No combustion");
pc("noz", "Gas generator", "14 simplex fuel nozzles", "Fed by a dual manifold through the flow divider. Primaries flow first. Secondaries join at about 35–40% N1, which gives cooler starts and a noticeable N1 surge.", e => e.lit || e.ff ? (e.n1 >= 37 ? "Primary + secondary" : "Primary only") : "No flow");
pc("ign", "Gas generator", "Spark igniters (2)", "Two igniters in the liner, fed by a 28 V exciter producing up to 3,500 V. One is enough to start. Powered by the start switch at ON, or by auto-ignition when armed and torque is below about 17%.", e => e.ign ? "SPARKING" : "Off");
pc("comp", "Gas generator", "Compressor: 3 axial + 1 centrifugal", "On one shaft with the compressor turbine. Stator vanes between stages diffuse the air. Diffuser tubes turn it 90° and convert velocity to pressure. Compression ratio is 9:1. P2.5 is interstage air, and P3 is discharge air used for bleed and for the FCU.", e => `N1 ${e.n1.toFixed(1)}% (37,500 rpm = 100%)`);
pc("bleed", "Gas generator", "Compressor bleed valve", "Pneumatic piston valve that compares axial and centrifugal stage pressure. It is open at low N1 to dump surplus P2.5 and prevent stalls, and closed above about 90% N1. Stuck closed causes stalls on acceleration. Stuck open gives high ITT and low torque at power.", e => e.bleedOpen ? "OPEN" : "CLOSED");
pc("inlet", "Gas generator", "Air inlet plenum, screen & jet flap", "Air enters at the rear through an annular plenum and screen. P2.5 air blowing from slots in the hollow inlet struts (the jet flap) pre-swirls the intake like a fixed inlet guide vane. A swing check valve relieves P2.5 the jet flaps can't use.", () => "");
pc("agb", "Accessories", "Accessory gearbox", "At the rear, driven by N1 through a coupling shaft. Starter/generator, high-pressure fuel pump and FCU, N1 tach generator, and the oil pressure and scavenge pumps.", e => e.start !== "OFF" ? "Starter engaged" : "");
pc("plever", "Cockpit", "Power lever", "Forward range: selects N1 through the FCU (alpha). Below flight idle in beta, ground fine and reverse it also sets blade angle through the cambox, Teleflex cable and beta valve. Gated at IDLE and at GROUND FINE.", e => `Position ${e.pl.toFixed(0)} · ${e.pl >= PL_IDLE ? "forward range" : e.pl >= PL_GF ? "ground fine" : "reverse"}`);
pc("prlever", "Cockpit", "Propeller lever", "Sets CSU speeder spring tension from 1,450 to 1,700 rpm. Fully aft through the friction detent, it opens the feathering valve.", e => e.pr < PR_FTH ? "FEATHER" : `${Math.round(npSetOf(e))} rpm selected`);
pc("clever", "Cockpit", "Condition lever", "FUEL CUTOFF closes fuel via the FCU pump unloading/cutoff function. LOW IDLE (62%) to HI IDLE (70%) sets the minimum N1 the power lever works above.", e => e.cl < CL_GATE ? "FUEL CUTOFF" : `Idle floor ${idleOf(e).toFixed(0)}% N1`);
pc("cambox", "Engine controls", "Cambox", "On the engine, linked to the power lever. A slotted cam sends the power lever's motion to the FCU, and through a Teleflex cable to the beta valve's walking beam. In the alpha range the slot is a constant radius, so the beta valve isn't moved.", () => "");
pc("fcu", "Engine fuel", "Fuel control unit (N1 governor)", "Meters fuel to hold the N1 selected by the power or condition lever. A 3D cam and fuel valve are positioned by flyweights (speed feedback) and a P3 bellows (acceleration and deceleration limits). The minimum flow adjustment is about 90 pph. The fuel topping governor can reduce its fuel through Py bleed.", e => e.lit ? `Holding ${e.n1.toFixed(1)}% N1 · ${Math.round(e.ff)} pph` : "Not metering");
pc("beta", "Propeller control", "Beta valve", "In the prop governor, moved by the power lever (cambox → Teleflex → walking beam). A carbon block on the beta ring feeds blade position back. It controls blade angle below the governing range, in beta, ground fine and reverse.", e => ["BETA", "GROUND FINE", "REVERSE"].includes(e.mode) ? "CONTROLLING blade angle" : "Held open (alpha)");
pc("topping", "Propeller control", "Fuel topping (Nf) governor", "Part of the prop governor. In alpha it is set above the selected Np (about 6–10% on typical PT6 installations) and bleeds FCU Py air to cut fuel in a propeller overspeed. In beta and reverse it is reset about 5% below the selected speed, and is then the only governor limiting Np.", e => e.topping ? "LIMITING Np" : "Standby");

pc("filt", "Engine fuel", "Firewall fuel filter & pressure switch", "Filters boost-pump fuel and senses its pressure for FUEL PRES LO.", () => "");
pc("hx", "Engine fuel", "Oil-to-fuel heat exchanger", "Uses hot engine oil to warm the fuel at the pump inlet so ice can't form on the pump filter. Automatic. 55 °C oil is recommended at takeoff power.", e => `Oil ${Math.round(e.oilT)} °C`);
pc("hpp", "Engine fuel", "High-pressure fuel pump", "Engine-driven gear pump with inlet and outlet filters, up to 1,050 psi. A purge line returns a little fuel to the gravity-feed line to keep vapor out of the FCU. If it fails, the minimum pressurizing valve closes and the engine flames out.", () => PP.fault.hp[ppSide] ? "FAILED" : "");

      "fth-dump": e.pr < PR_FTH && e.lit, "top-fcu": e.topping, "servo-beta": e.lit && beta, "cut-noz": e.lit });

/* ================= Chapter 6: Propellers ================= */
const PV_IDLE = 24, PV_GF = 14, PV_FTH = 10, FEATHER_DEG = 79.3;
let PV = null, pvG = [], pvTimer = null, pvSide = "L", pvTab = "hyd", pvSel = null, pvScen = 0, pvScript = null, pvLogArr = [];

function pvEngine() {
  return { pl: PV_IDLE, pr: 100, run: true, n1: 62, shp: 60, np: 1250, beta: 2, ftg: 0, tq: 8, sol: true, stop: 2, mode: "", why: "", pv: -1, bv: "CUTOFF", bvPos: 0,
    oil: true, flow: "trapped", dump: "", os: false, afLight: false, afDump: false, bias: 0, err: 0, phi: 0, prevBeta: 2, rot: 0, warned: {} };
}
function pvFresh() {
  return { E: { L: pvEngine(), R: pvEngine() }, env: { flight: false, ktas: 200, gs: 0, gear: true, lifted: false },
    sw: { af: "OFF", govTest: false, glpsTest: false, sync: false }, fault: { gov: { L: false, R: false }, hub: { L: false, R: false } },
    lift: false, together: true, t: 0, syncAng: 0 };
}
function pvLog(msg, cls) {
  pvLogArr.unshift({ t: PV.t, msg, cls: cls || "" }); if (pvLogArr.length > 50) pvLogArr.pop();
  const h = $("#pvLog"); if (h) h.innerHTML = pvLogArr.map(e => `<li class="${e.cls}"><span class="t">${e.t.toFixed(1)}s</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
function pvOnce(e, key, cond, msg, cls) { if (cond && !e.warned[key]) { e.warned[key] = true; pvLog(msg, cls); } if (!cond) e.warned[key] = false; }
const pvSel1 = e => e.pr < PV_FTH ? 1450 : 1450 + clamp01((e.pr - 12) / 88) * 250;
const pvRange = e => e.pl >= PV_IDLE ? "FWD" : e.pl >= PV_GF ? "GF" : "REV";
const pvN1cmd = e => !e.run ? 0 : e.pl >= PV_IDLE ? 62 + (e.pl - PV_IDLE) / (100 - PV_IDLE) * 42 : e.pl >= PV_GF ? 62 : 62 + (PV_GF - e.pl) / PV_GF * 25;

function pvStep(dt) {
  PV.t += dt;
  const env = PV.env, F = PV.fault, sw = PV.sw;
  // ground speed: accelerates with forward thrust, decelerates otherwise (reverse decelerates harder)
  if (!env.flight) {
    const thrust = (PV.E.L.tq + PV.E.R.tq) / 2, rev = pvRange(PV.E.L) === "REV" || pvRange(PV.E.R) === "REV";
    if (thrust > 60 && !rev && !env.brakes && PV.E.L.beta > 8 && PV.E.R.beta > 8) env.gs = Math.min(110, env.gs + 4 * dt);
    else env.gs = Math.max(0, env.gs - (rev ? 6 : 2.5) * dt);
    env.gear = true;
  }
  const V = (env.flight ? env.ktas : env.gs) * 0.5144;
  ["L", "R"].forEach(k => {
    const e = PV.E[k], S = SIDE[k], rng = pvRange(e), sel = pvSel1(e);
    // engine
    e.n1 += (pvN1cmd(e) - e.n1) * dt / (e.run ? 1.5 : 3);
    if (e.n1 < 0.1) e.n1 = 0;
    const dens = env.flight ? 0.75 : 1;
    const shpRaw = e.run ? 1180 * dens * Math.pow(clamp01((e.n1 - 55) / 49), 1.8) + 25 * clamp01(e.n1 / 62) : 0;
    const lim = (rng === "FWD" ? 1.06 : 0.95) * sel;
    e.ftg += (clamp01((e.np - lim) / 25) - e.ftg) * dt / 0.25;
    e.shp = shpRaw * (1 - 0.92 * e.ftg);
    // ground low pitch stop solenoid (350): right gear safety switch on ground, or power levers lifted at IDLE; opened above 68–70% N1 by the power lever switch
    e.sol = (!env.flight || PV.lift || sw.glpsTest) && pvN1cmd(e) < 69 && e.run;
    e.stop = rng === "FWD" ? (e.sol ? 2 : 12) : rng === "GF" ? 2 + (e.pl - PV_IDLE) / (PV_IDLE - PV_GF) * 5 : -3 - (PV_GF - e.pl) / PV_GF * 11;
    // oil: governor pump is driven by the Np shaft; supply from engine oil
    e.oil = e.np > 250 && (e.run || env.flight);
    // aerodynamics (teaching model)
    const U = Math.max(e.np, 1) * 0.10472 * 1.07, vi = 10 * Math.sqrt(Math.max(0, e.shp) / 1050);
    e.phi = Math.atan2(V + vi, Math.max(U, 5)) * 180 / Math.PI;
    let a;
    if (e.beta < 0) a = 0.05 + 0.03 * -e.beta + 0.0005 * e.beta * e.beta;
    else { const x = e.beta - e.phi; a = 0.08 + 0.06 * x + 0.0012 * x * Math.abs(x); a = e.beta > 60 ? Math.min(Math.max(a, 0.015), 1.5) : Math.max(Math.min(a, 1.5), -0.7); }
    const r = e.np / 1700, pabs = 1250 * r * r * r * a + 8 * r;
    e.np += (e.shp - pabs) / Math.max(e.np, 150) * 900 * dt;
    if (!e.run && !env.flight) e.np -= e.np * 0.2 * dt;
    e.np = Math.max(0, e.np);
    // governors
    const set = sel + e.bias;
    e.err = e.np - set;
    let rate = F.gov[k] ? -25 : Math.max(-30, Math.min(30, 0.3 * e.err));
    e.pv = F.gov[k] ? -1 : Math.max(-1, Math.min(1, e.err / 40));
    const osSet = sw.govTest ? 1565 : 1768;
    e.os = e.np > osSet && e.oil;
    if (e.os) rate = Math.max(rate, Math.min(40, 0.3 * (e.np - osSet)));
    const featherCmd = e.pr < PV_FTH || e.afDump || !e.oil;
    const b0 = e.beta;
    e.dump = "";
    if (F.hub[k]) { /* frozen hub: blades can't move */ }
    else if (featherCmd) { e.beta = Math.min(FEATHER_DEG, e.beta + 16 * dt); e.dump = e.pr < PV_FTH ? "feather" : e.afDump ? "autofeather" : "nooil"; }
    else if (rng !== "FWD") {
      // ground fine / reverse: the beta valve ports oil to (or from) the dome until the blades reach the lever-selected angle
      const d = e.stop - e.beta; e.beta += Math.sign(d) * Math.min(Math.abs(d), 12 * dt);
      if (Math.abs(d) > 0.05) e.dump = d > 0 ? "beta" : "";
    }
    else {
      let nb = e.beta + rate * dt;
      if (nb < e.stop) nb = e.beta >= e.stop ? e.stop : Math.min(e.stop, e.beta + 20 * dt);
      e.beta = Math.max(-14, Math.min(FEATHER_DEG, nb));
      if (e.beta < b0 - 0.0001 && b0 < e.stop) e.dump = "";
      if (b0 < e.stop - 0.05) e.dump = "beta";
      else if (e.os && e.beta > b0) e.dump = "os";
      else if (e.beta > b0 + 0.01) e.dump = "pilot";
    }
    const br = (e.beta - b0) / dt;
    e.flow = !e.oil && e.beta >= FEATHER_DEG - 0.1 ? "none" : br < -0.25 ? "fill" : br > 0.25 ? "dump" : e.oil ? "trapped" : "none";
    // beta valve position (relative to its oil cut-off point)
    const dxTop = -(12 - (rng === "FWD" ? e.stop : e.stop)), dxBot = Math.max(0, 15 - e.beta);
    e.bvPos = dxTop + dxBot - 3;
    e.bv = e.bvPos < -0.6 ? "OPEN" : e.bvPos > 0.6 ? "DUMP" : "CUT-OFF";
    if (rng !== "FWD" || e.sol) { if (Math.abs(e.beta - e.stop) < 0.3) e.bv = "CUT-OFF"; }
    e.tq = e.run ? e.shp / 1050 * 1700 / Math.max(e.np, 300) * 100 : 0;
    // mode
    const onStop = e.beta <= e.stop + 0.3;
    if (featherCmd && !F.hub[k] && e.beta < FEATHER_DEG - 0.2) { e.mode = "FEATHERING"; e.why = e.dump === "feather" ? "Prop lever in FEATHER: the feathering valve dumps dome oil; springs and counterweights drive the blades toward 79.3°." : e.dump === "autofeather" ? "Autofeather dump valve open: dome oil drains and the blades move toward feather." : "No governor oil pressure: springs and counterweights drive the blades toward feather."; }
    else if (e.beta > 70) { e.mode = e.beta >= FEATHER_DEG - 0.2 ? "FEATHERED" : "FEATHERING"; e.why = e.dump === "feather" ? "Prop lever in FEATHER: the feathering valve dumps dome oil; springs and counterweights drive the blades to 79.3°." : e.dump === "autofeather" ? "Autofeather dump valve open: dome oil drains and the blades feather." : !e.oil ? "No governor oil pressure: springs and counterweights hold the blades feathered." : "Unfeathering: governor oil is driving the blades back toward low pitch."; }
    else if (F.hub[k]) { e.mode = "HUB FROZEN"; e.why = `Blades stuck at ${e.beta.toFixed(0)}°. Neither governor can change pitch, so the fuel topping governor cuts fuel to hold Np near ${Math.round(lim)} rpm (${rng === "FWD" ? "106" : "95"}% of selected).`; }
    else if (e.os) { e.mode = "O/S GOV"; e.why = `Overspeed governor dumping dome oil to hold about ${osSet} rpm${sw.govTest ? " (TEST reset)" : ""}.${F.gov[k] ? " The primary governor has failed toward low pitch." : ""}`; }
    else if (rng === "REV") { e.mode = "REVERSE"; e.why = `Beta valve sets blades at ${e.stop.toFixed(1)}°. N1 rises with aft lever travel (max 87%). The FTG at 95% (${Math.round(lim)} rpm) keeps the governor in underspeed${e.ftg > 0.1 ? " and is now trimming fuel" : ""}.`; }
    else if (rng === "GF") { e.mode = "GROUND FINE"; e.why = `Beta valve sets blades at ${e.stop.toFixed(1)}° (between +2° and −3°). N1 stays at idle and the FTG is reset to 95%${e.ftg > 0.1 ? ", and it is trimming fuel to hold about " + Math.round(lim) + " rpm" : ""}.`; }
    else if (e.ftg > 0.1) { e.mode = "FTG"; e.why = `Fuel topping governor reducing fuel (P3/Py bleed) to limit Np to about ${Math.round(lim)} rpm.`; }
    else if (onStop && e.err < -8) { e.mode = e.stop < 5 ? "GROUND STOP" : "FLIGHT STOP"; e.why = `Underspeed: Np ${Math.round(e.np)} is below ${Math.round(set)}, so the blades rest on the ${e.stop < 5 ? "ground low pitch stop (+2°)" : "flight low pitch stop (+12°)"}. The beta valve has cut off dome oil.`; }
    else if (Math.abs(e.err) <= 8) { e.mode = "ONSPEED"; e.why = `Flyweights balanced against the speeder spring at ${Math.round(set)} rpm. The pilot valve is centered and oil is trapped in the dome.`; }
    else if (e.err > 0) { e.mode = "OVERSPEED"; e.why = "Flyweights out, pilot valve up: dome oil drains to the case and blade angle increases."; }
    else { e.mode = "UNDERSPEED"; e.why = "Flyweights in, pilot valve down: governor oil flows to the dome and blade angle decreases."; }
    e.rot = (e.rot + e.np * 0.06 * dt * 20) % 360;
    // event log
    pvOnce(e, "pp", e.beta < 9 && e.oil, `${S} PROP PITCH: blades below the flight low pitch stop (${e.beta.toFixed(0)}°).`, "");
    pvOnce(e, "flightLift", env.flight && e.beta < 9 && e.beta > -1 && rng === "FWD", `${S} blades dropped to the ground low pitch stop IN FLIGHT. That's excessive drag and a high sink rate. Lower the power levers out of the lift position.`, "bad");
    pvOnce(e, "os", e.os, `${S} overspeed governor active at about ${osSet} rpm.`, sw.govTest ? "" : "bad");
    pvOnce(e, "ftg", e.ftg > 0.2, `${S} fuel topping governor limiting Np (~${Math.round(lim)} rpm).`, rng === "FWD" ? "bad" : "");
    pvOnce(e, "res", !env.flight && e.run && e.np > 820 && e.np < 930 && e.beta < 70, `${S} Np in the 850–900 rpm resonance range. Keep ground rpm above 1,050 or below 400.`, "warn");
    pvOnce(e, "fth", e.beta >= FEATHER_DEG - 0.2, `${S} propeller feathered.`, "");
  });
  // autofeather (Figure 7-44 logic)
  const E = PV.E, plSw = k => E[k].pl >= 71; // power lever switches at about the 88% N1 lever position
  const power = sw.af === "TEST" || (sw.af === "ARM" && plSw("L") && plSw("R"));
  ["L", "R"].forEach(k => {
    const o = OTHER[k], relay = power && E[o].tq > 17;
    E[k].relay = relay; E[k].afLight = relay && E[k].tq >= 10;
    const was = E[k].afDump; E[k].afDump = relay && E[k].tq < 10;
    if (E[k].afDump && !was) pvLog(`${SIDE[k]} torque below 10% with autofeather armed: dump valve opens and the propeller feathers.`, "warn");
  });

  const both = L.mode === "ONSPEED" || L.mode === "OVERSPEED" || L.mode === "UNDERSPEED";
  const bothR = R.mode === "ONSPEED" || R.mode === "OVERSPEED" || R.mode === "UNDERSPEED";
  if (sw.sync && both && bothR) {
    const d = selR - selL;
    L.bias += ((d > 0 ? Math.min(20, d) : 0) - L.bias) * dt / 2; R.bias += ((d < 0 ? Math.min(20, -d) : 0) - R.bias) * dt / 2;
  } else { L.bias += (0 - L.bias) * dt / 2; R.bias += (0 - R.bias) * dt / 2; }
  PV.syncAng = (PV.syncAng + (R.np - L.np) * 4 * dt) % 360;
  if (pvScript) pvRunScript();
  pvRender();
}

function pvRunScript() {
  const s = pvScript;
  while (s.i < s.steps.length) {
    const st = s.steps[s.i];
    if (st.wait !== undefined && PV.t - s.t0 < st.wait) return;
    if (st.until && !st.until(PV)) return;
    st.do(PV); if (st.msg) pvLog("Demo: " + st.msg); s.i++; s.t0 = PV.t;
  }
  pvScript = null;
}

function pvApply(i) {
  pvScen = Math.max(0, Math.min(PV_SCEN.length - 1, i));
  const sc = PV_SCEN[pvScen];
  PV = pvFresh(); pvLogArr = []; sc.apply(PV);
  pvScript = sc.script ? { steps: sc.script, i: 0, t0: 0 } : null;
  pvLog(`Loaded: ${sc.t}.`);
  $("#pvScenSel").value = String(pvScen); $("#pvScenCap").textContent = sc.cap;
  $$("[data-pveng]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.pveng === pvSide)));
  pvSync(); pvStep(0.01);
}

function pvHint(m) { const h = $("#pvHint"); if (h) h.textContent = m; }
function pvLeverInput(g, k, v) {
  const L = PV_LEVERS.find(x => x.g === g), e = PV.E[k], prev = e[L.key];
  if (g === "pwr") {
    if (PV.env.flight && v < PV_IDLE) { v = PV_IDLE; pvHint("In flight the power levers stay at or above IDLE. Ground fine and reverse are ground-only."); }
    else if (prev >= PV_IDLE && v < PV_IDLE && !PV.lift) { v = PV_IDLE; pvHint("Lift the power levers to pass the IDLE gate into GROUND FINE."); }
    else if (prev >= PV_GF && v < PV_GF && !PV.lift) { v = Math.max(v, PV_GF); pvHint("Lift again to pass the GROUND FINE gate into REVERSE."); }
    else if (v < PV_IDLE && e.beta > 60) { v = PV_IDLE; pvHint("Not with the propeller feathered. Forcing the lever into ground fine or reverse damages the reversing linkage."); }
  }

  pvScript = null; pvSync();
}

/* ---------- diagrams ---------- */
const PVC = {};
function pvc(id, group, name, desc, state) { PVC[id] = { group, name, desc, state }; }
pvc("plever", "Cockpit", "Propeller lever", "Sets speeder spring tension on the primary governor from 1,450 (aft) to 1,700 rpm (forward). Into the striped FEATHER detent it opens the feathering dump valve.", e => e.pr < PV_FTH ? "FEATHER" : `${Math.round(pvSel1(e))} rpm selected`);
pvc("pgov", "Governors", "Primary governor: flyweights, speeder spring, pilot valve", "Flyweights geared to the prop shaft balance against the speeder spring. Onspeed: pilot valve centered, oil trapped. Overspeed: valve rises and dome oil drains to the case, raising pitch. Underspeed: valve drops and governor oil flows to the dome, lowering pitch. If the control linkage fails, an external spring drives it to 1,700 rpm.", e => `${e.mode} · set ${Math.round(pvSel1(e) + e.bias)} · Np ${Math.round(e.np)}`);
pvc("pump", "Governors", "Governor pump", "Part of the primary governor and driven by the Np shaft. Raises engine oil to about 375 psi, regulated, to drive the blades toward low pitch and reverse.", e => e.oil ? "≈ 375 psi available" : "No pressure");
pvc("ftg", "Governors", "Fuel topping governor", "Inside the primary governor. If blade angle can't be changed, it bleeds FCU air pressure to cut fuel and power, limiting Np to about 106% of selected in the forward range and about 95% in ground fine and reverse. The power lever resets it, through the reset post and air-bleed link.", e => e.ftg > 0.1 ? "LIMITING (cutting fuel)" : `Standby · limit ${Math.round((pvRange(e) === "FWD" ? 1.06 : 0.95) * pvSel1(e))} rpm`);
pvc("beta", "Low pitch stop", "Beta valve (low pitch stop valve)", "On the primary governor, positioned by the middle of the reverse lever. Aft is open (governor in control). Its first forward motion cuts off oil to the dome, forming the hydraulic low pitch stop. Further forward it dumps dome oil to the gearbox sump. It is spring-loaded to cut off and dump if its linkage fails.", e => e.bv);
pvc("rlever", "Low pitch stop", "Reverse lever", "Top: reversing linkage from the power lever (cam box, push-pull control) and the ground low pitch stop solenoid. Middle: beta valve. Bottom: feedback ring through the carbon block. It sums the commanded stop with the actual blade position.", e => `stop ${e.stop.toFixed(1)}°`);
pvc("sol", "Low pitch stop", "Ground low pitch stop solenoid", "Pulls the top of the reverse lever aft to move the stop from +12° to +2°. Energized by the right main gear safety switch on the ground, or by lifting either power lever at the IDLE gate. Opened by each power lever's switch above 68–70% N1. Voltage drops to about 14 V after 2 s. Protected by the PROP GOV TEST breaker.", e => e.sol ? "ENERGIZED (+2° stop)" : "Off (+12° flight stop)");
pvc("pwrlink", "Cockpit", "Power lever reversing linkage", "From the power lever through the cam box and push-pull control to the top of the reverse lever. From IDLE to full forward thrust it doesn't move the beta valve. Aft of IDLE it pulls the beta valve open to select lower blade angles (ground fine to −3°, reverse to −14°).", e => `${pvRange(e)} · lever ${e.pl.toFixed(0)}`);
pvc("dome", "Propeller", "Propeller dome, piston & feather springs", "Oil in the dome moves it forward, carrying the blades toward low pitch and reverse. Feathering springs (with the blade counterweights) push it aft toward feather. There are no high-pitch locks, so the prop feathers after shutdown.", e => `${e.flow === "fill" ? "filling (pitch decreasing)" : e.flow === "dump" ? "draining (pitch increasing)" : e.flow === "trapped" ? "oil trapped (pitch constant)" : "no oil"} · β ${e.beta.toFixed(1)}°`);
pvc("gland", "Propeller", "Transfer gland", "Surrounds the propeller shaft and lets governor oil enter and leave the rotating dome.", () => "");
pvc("ring", "Low pitch stop", "Feedback ring, polished rods & stop nuts", "Four spring-loaded polished rods connect the dome to the feedback ring behind the prop. Below about 15° the dome flanges hit the low-pitch stop nuts and drag the rods and ring forward. The carbon block carries that motion to the bottom of the reverse lever, closing the beta valve at the stop.", e => `ring ${Math.max(0, 15 - e.beta).toFixed(1)}° forward of rest`);
pvc("ppsw", "Indication", "PROP PITCH proximity switch", "A magnetic proximity sensor on the feedback ring. It lights L/R PROP PITCH when the blades are below the flight low pitch stop (about 9° or less).", e => e.beta < 9 ? "PROP PITCH ON" : "Off");
pvc("osgov", "Governors", "Overspeed governor", "On the left of the reduction gearbox, set at about 1,768 rpm. It can only drain dome oil, raising pitch. PROP GOV TEST resets it to about 1,565 ±45 rpm. Its oil line carries the autofeather dump solenoid.", e => e.os ? "DUMPING" : `Standby · ${PV.sw.govTest ? "1,565 (TEST)" : "1,768"} rpm`);
pvc("afsol", "Autofeather", "Autofeather dump solenoid (N.C.)", "Normally closed. Energized by the autofeather circuit when that engine's torque drops below 10% while armed. It drains the dome so the prop feathers.", e => e.afDump ? "OPEN (feathering)" : "Closed");

/* ================= Chapter 9: Pneumatics ================= */
const PN_N1 = { OFF: 0, IDLE: 62, MID: 75, HIGH: 95 };
let PN = null, PND = null, pnTimer = null, pnSel = null, pnScen = 0, pnScript = null, pnLogArr = [];

function pnFresh() {
  return { t: 0, n1cmd: { L: "OFF", R: "OFF" }, n1: { L: 0, R: 0 }, bleed: { L: "OPEN", R: "OPEN" }, flight: false, alt: 0,
    brake: false, cycle: 0, man: 0, vac: 0, fill: 0, seal: 0, tube: { L: 0, R: 0 }, melt: { L: 0, R: 0 },
    fault: { rup: { L: false, R: false }, reg: false }, hours: 1873.4, hourAcc: 0, warned: {} };
}
function pnLog(msg, cls) {
  pnLogArr.unshift({ t: PN.t, msg, cls: cls || "" }); if (pnLogArr.length > 50) pnLogArr.pop();
  const h = $("#pnLog"); if (h) h.innerHTML = pnLogArr.map(e => `<li class="${e.cls}"><span class="t">${e.t.toFixed(1)}s</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
function pnOnce(key, cond, msg, cls) { if (cond && !PN.warned[key]) { PN.warned[key] = true; pnLog(msg, cls); } if (!cond) PN.warned[key] = false; }

function pnStep(dt) {
  const P = PN; P.t += dt;
  const d = { p3: {}, up: {}, valve: {}, env: {}, check: {}, brake: {}, leak: {}, fail: {}, off: {} };
  ["L", "R"].forEach(k => {
    P.n1[k] += (PN_N1[P.n1cmd[k]] - P.n1[k]) * dt / (P.n1cmd[k] === "OFF" ? 4 : 2.5);
    if (P.n1[k] < 0.2) P.n1[k] = 0;
    d.p3[k] = 120 * clamp01((P.n1[k] - 35) / 65);
    d.valve[k] = P.bleed[k] !== "PNEU";                       // pneumatic air valve: N.O., closed only in PNEU & ENVIR OFF
    d.env[k] = P.bleed[k] === "OPEN" && d.p3[k] > 5;           // environmental flow control valve open and flowing
    d.leak[k] = P.fault.rup[k] && d.valve[k] && d.p3[k] > 5;   // hot air escaping from a broken line
    d.up[k] = d.valve[k] ? d.p3[k] * (P.fault.rup[k] ? 0.35 : 1) : 0;
    d.off[k] = P.bleed[k] !== "OPEN";
  });
  d.tee = Math.max(d.up.L, d.up.R);
  ["L", "R"].forEach(k => { d.check[k] = d.up[k] > 1 && d.up[k] >= d.tee - 2; d.brake[k] = P.brake && d.up[k] > 5; });
  // boot cycle (single cycle: inflate, then vacuum hold-down)
  if (P.cycle > 0) { P.cycle = Math.max(0, P.cycle - dt); if (P.cycle === 0) pnLog("Deice cycle complete: distributor returns the boots to vacuum hold-down."); }
  d.inflate = P.cycle > 0 && P.man > 5;
  // 18 psi regulator (relief at 21 psi), manifold pressure
  const set = P.fault.reg ? 21 : 18;
  let target = Math.min(set, d.tee * 0.9);
  if (d.inflate) target = Math.max(0, target - 2.5);
  P.man += (target - P.man) * dt / (target > P.man ? 0.8 : 1.6);
  if (P.man < 0.05) P.man = 0;
  // ejector vacuum: capacity falls from ~15 in Hg (SL) to ~6 in Hg (31,000 ft); regulated to 5.9
  d.cap = Math.max(0, (15 - 9 * (P.flight ? P.alt : 0) / 31000) * clamp01(P.man / 18));
  const vt = Math.min(5.9, d.cap);
  P.vac += (vt - P.vac) * dt / 1.2; if (P.vac < 0.02) P.vac = 0;
  // fill can: charges from manifold, bleeds off slowly through an orifice
  P.fill += (P.man - P.fill) * dt / (P.man > P.fill ? 1 : 20);
  // door seal: 4 psi regulator, N.O. valve held closed on the ground by the left gear safety switch
  d.sealOpen = P.flight;
  P.seal += ((d.sealOpen ? Math.min(4, P.man) : 0) - P.seal) * dt / 1.2;
  // hourmeter: right gear safety switch valve (N.C., open in flight) -> pressure switch
  d.hourOpen = P.flight;
  d.hourRun = d.hourOpen && P.man > 2;
  if (d.hourRun) { P.hourAcc += dt; if (P.hourAcc >= 3) { P.hourAcc = 0; P.hours += 0.1; } }
  // bleed air warning tubes: fed from the manifold through orifices; heat from a leak melts the tube
  ["L", "R"].forEach(k => {
    if (d.leak[k]) P.melt[k] = Math.min(1, P.melt[k] + dt / 2.5);
    const melted = P.melt[k] >= 1;
    P.tube[k] += ((melted ? 0 : P.man) - P.tube[k]) * dt / (melted ? 0.8 : 1.5);
    d.fail[k] = P.tube[k] < 2;
  });
  d.defog = d.tee > 5;
  PND = d;
  // events
  pnOnce("press", P.man > 15, `Pneumatic pressure ${P.man.toFixed(0)} psi: manifold up. Bleed-air warning tubes pressurizing.`);
  pnOnce("nopress", P.t > 0.5 && P.man < 2 && (P.flight || P.n1.L > 40 || P.n1.R > 40), "No pneumatic pressure: no vacuum for the gyros, no boots, no door seal.", "bad");
  ["L", "R"].forEach(k => {
    pnOnce("chk" + k, !d.check[k] && d.tee > 5, `${SIDE[k]} check valve closed: the ${k === "L" ? "right" : "left"} engine's air can't escape back through the ${SIDE[k].toLowerCase()} line.`);
    pnOnce("fail" + k, d.fail[k] && P.t > 0.5, `${k} BLEED FAIL: ${SIDE[k].toLowerCase()} warning tube below 2 psi${P.melt[k] >= 1 ? " (tube melted by escaping bleed air)" : " (no manifold pressure)"}.`, P.melt[k] >= 1 ? "bad" : "warn");
    pnOnce("leak" + k, d.leak[k], `${SIDE[k]} bleed line ruptured: hot air is escaping into the ${k === "L" ? "left" : "right"} wing and nacelle.`, "bad");
    pnOnce("brk" + k, P.brake && !d.brake[k], `${SIDE[k]} brake deice valve has no bleed air (it's fed from the ${SIDE[k].toLowerCase()} engine's line).`, "warn");
  });
  pnOnce("relief", P.man > 19.5, "Regulator failed: the relief valve is holding about 21 psi, above the red line.", "bad");
  pnOnce("vaclo", P.vac > 0.1 && P.vac < 4.3, `Suction ${P.vac.toFixed(1)} in Hg is below the 4.3–5.9 regulated range.`, "warn");
  if (pnScript) pnRunScript();
  pnRender();
}
function pnRunScript() {
  const s = pnScript;
  while (s.i < s.steps.length) {
    const st = s.steps[s.i];
    if (st.wait !== undefined && PN.t - s.t0 < st.wait) return;
    st.do(PN); if (st.msg) pnLog("Demo: " + st.msg); s.i++; s.t0 = PN.t;
  }
  pnScript = null;
}

function pnSvg() {

const PN_G = { p: { min: 0, max: 24, ticks: [0, 5, 10, 15, 20], green: [10, 19.5], red: 20 }, s: { min: 2, max: 7, ticks: [3, 4, 5, 6], green: [3, 6] } };

function fpFresh() {

function fpLog(msg, cls) {
  fpLogArr.unshift({ t: FP.t, msg, cls: cls || "" }); if (fpLogArr.length > 40) fpLogArr.pop();
  const h = $("#fpLog"); if (h) h.innerHTML = fpLogArr.map(e => `<li class="${e.cls}"><span class="t">${e.t.toFixed(1)}s</span><span class="m">${esc(e.msg)}</span></li>`).join("");

function fpLights() {
  const P = FP, L = {};
  ["L", "R"].forEach(k => {
    const alarm = P.heat[k] > 0.6 && !P.fault.tube[k];
    L["fire" + k] = P.bat && (alarm || (P.test[k] === "DET" && !P.fault.tube[k]));
    L["fw" + k] = P.bat && (P.fwT[k] > 0 ? "blink" : P.fw[k] === "CLOSED");
    L["push" + k] = P.fw[k] === "CLOSED" || P.test[k] === "EXT";
    L["dis" + k] = P.dis[k] || (P.test[k] === "EXT" && !P.fault.cart[k]);
    L["alarm" + k] = alarm;
  });
  return L;
}
function fpStep(dt) {
  const P = FP; P.t += dt;
  ["L", "R"].forEach(k => {
    if (P.testT[k] > 0) { P.testT[k] = Math.max(0, P.testT[k] - dt); if (P.testT[k] === 0) P.test[k] = "OFF"; }
    if (P.fwT[k] > 0) { P.fwT[k] = Math.max(0, P.fwT[k] - dt); if (P.fwT[k] === 0) fpLog(`${SIDE[k]} firewall fuel valve ${P.fw[k] === "CLOSED" ? "closed" : "open"}.`); }
    if (P.outT[k] > 0) { P.outT[k] = Math.max(0, P.outT[k] - dt); if (P.outT[k] === 0 && P.fire[k]) { P.fire[k] = false; fpLog(`${SIDE[k]} engine fire out. The tube cools and ENG FIRE goes out.`, "ok"); } }
    if (P.spray[k] > 0) P.spray[k] = Math.max(0, P.spray[k] - dt);
    P.heat[k] = Math.max(0, Math.min(1, P.heat[k] + (P.fire[k] ? dt / 2 : -dt / 3)));
  });
  const Lt = fpLights();
  ["L", "R"].forEach(k => {
    if (Lt["fire" + k] && !P.prevFire[k]) { P.mw = true; if (P.test[k] !== "DET") fpLog(`${k} ENG FIRE: the ${SIDE[k].toLowerCase()} sensor tube alarm switch closed. MASTER WARNING flashing.`, "bad"); }

}

/* ================= Chapter 10: Ice and Rain Protection ================= */
let IC = null, icTimer = null, icSel = null, icLogArr = [], ofhMode = "cold", ofhRunning = true, ofhSel = null;
const IC_VANE_TRAVEL = 12;   // illustrative actuator travel time, s
const IC_ICE_RATE = 0.25;    // illustrative accretion, in/min in icing
const ICC = {
  lip: { group: "Engine", name: "Engine inlet lip heat", desc: "A scoop in the engine's left exhaust stack sends hot exhaust into the hollow lip tube around the air inlet. It leaves through a line into the right exhaust stack. It works whenever the engine runs, with no control." },
  vane: { group: "Engine", name: "Inertial separator (ice vanes)", desc: "Forward and aft vanes in the inlet duct. Extended (ENGINE ANTI-ICE ON), the forward vane forms a venturi and a sudden turn, and the aft vane opens the bypass so heavy ice and debris go overboard. MAIN actuator on the triple-fed bus, STANDBY on the generator bus. ENG ANTI-ICE (green) means extended. ENG ICE FAIL (yellow) means no agreement after 35 s, or immediately on loss of motor power." },
  ign: { group: "Engine", name: "Auto-ignition", desc: "With ENG AUTO IGNITION armed, torque below about 17% powers the igniters and lights IGNITION ON, so a flameout relights automatically. Arm it for turbulence, icing and precipitation. Leave it off on the ground." },
  ofh: { group: "Engine", name: "Oil-to-fuel heat exchanger", desc: "On the engine accessory section. Engine oil warms the fuel ahead of the fuel control unit by conduction, melting ice particles. Automatic whenever the engine runs. See the high-resolution drawing below." },
  ws: { group: "Windshield", name: "Windshield anti-ice", desc: "Heating grid in the windshield's polyvinyl middle layer. NORMAL heats nearly the whole windshield. HIGH heats the outboard two-thirds, faster. A controller holds 90–110 °F. Not effective above 226 KIAS. Can make the magnetic compass erratic." },
  wiper: { group: "Windshield", name: "Windshield wipers", desc: "One motor drives both wipers, from the overhead panel: PARK, OFF, SLOW, FAST. Never run them on dry glass, which can scratch the NESA coating." },
  pboot: { group: "Propellers", name: "Propeller deice boots", desc: "An electrically heated boot on each blade, fed through brushes and slip rings. AUTO: one prop for 90 s, then the other, every 3 minutes, normally 26–32 A. MANUAL (hold): all boots on both props, no ammeter reading, loadmeters up about 10%. Never with the props static." },
  wboot: { group: "Surface deice", name: "Wing deice boots", desc: "Inboard and outboard boots on each wing. SINGLE inflates them for about 6 s. MANUAL inflates them while held. Vacuum holds them flat otherwise. WING DEICE lights when both wing pressure switches see 14–15 psi." },
  tboot: { group: "Surface deice", name: "Horizontal stabilizer boots", desc: "One boot on each side of the horizontal stabilizer. In a SINGLE cycle they inflate for about 4 s after the wing boots. TAIL DEICE lights at 14–15 psi. The vertical stabilizer isn't deiced." },
  pitot: { group: "Air data", name: "Pitot masts (heated)", desc: "Two heated masts on the nose. Left from the triple-fed bus, right from the right generator bus. On for takeoff and in icing, only briefly on the ground." },
  stall: { group: "Air data", name: "Stall warning vane & plate (heated)", desc: "Left wing leading edge. STALL WARN switch, right generator bus. About 14 V on the ground through the left gear safety switch, 28 V in flight. Ice on the wing makes stall warning unreliable anyway." },
  vent: { group: "Fuel", name: "Heated fuel vents", desc: "One electrically heated fuel vent in each wing. L and R FUEL VENT switches, powered by the left and right generator buses." }
};

function icFresh() {
  const lr = v => ({ L: v, R: v });
  return { t: 0, speed: 1, flight: false, oat: 10, moist: false, ias: 180, eng: lr(true), flame: lr(0), tq: lr(10),
    ign: lr("OFF"), eai: lr("OFF"), act: lr("MAIN"), vane: lr(0), failT: lr(0), fault: { pwr: lr(false), stuck: lr(false) },
    ws: { P: "OFF", C: "OFF" }, wsT: { P: 50, C: 50 }, wsOn: { P: false, C: false },
    propAuto: false, propMan: false, propSide: "L", propT: 0, propBlip: 0,
    surfT: -1, surfMan: false, wingP: 0, tailP: 0, shedDone: { wing: false, tail: false },
    vent: lr("OFF"), stall: false, pitot: lr("OFF"), wiper: "OFF", wAng: -62, wDir: 1,
    ice: { wing: 0, tail: 0, propL: 0, propR: 0, wsPo: 0, wsPi: 0, wsCo: 0, wsCi: 0 }, pIce: lr(0), heatT: lr(0), gndPitotT: 0, warned: {} };
}
function icLog(msg, cls) {
  icLogArr.unshift({ t: IC.t, msg, cls: cls || "" }); if (icLogArr.length > 60) icLogArr.pop();
  const h = $("#icLog"); if (h) h.innerHTML = icLogArr.map(e => `<li class="${e.cls}"><span class="t">${fmtIcT(e.t)}</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
const fmtIcT = t => t < 60 ? `${t.toFixed(0)}s` : `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function icOnce(key, cond, msg, cls) { if (cond && !IC.warned[key]) { IC.warned[key] = true; icLog(msg, cls); } if (!cond) IC.warned[key] = false; }
const icIcing = P => P.flight && P.moist && P.oat <= 2;
const icPneu = P => P.eng.L || P.eng.R;
const icSurfState = P => P.surfMan ? "manual" : P.surfT < 0 ? "idle" : P.surfT < 6 ? "wing" : P.surfT < 10 ? "tail" : "idle";
const icPropHeating = (P, k) => P.propMan || (P.propAuto && P.propSide === k);

function icStep(dtReal) {
  const P = IC, dt = dtReal * P.speed; P.t += dt;
  const icing = icIcing(P), rate = IC_ICE_RATE / 60 * dt;
  // engines, torque, auto-ignition
  ["L", "R"].forEach(k => {
    if (P.flame[k] > 0) {
      P.flame[k] = Math.max(0, P.flame[k] - dt);
      if (P.ign[k] === "ARM" && P.flame[k] < 3) { P.flame[k] = 0; icLog(`${SIDE[k]} engine relit by auto-ignition. Torque back above 17%, IGNITION ON goes out.`, "ok"); }
      else if (P.flame[k] === 0) { P.eng[k] = false; icLog(`${SIDE[k]} engine did not relight: auto-ignition wasn't armed.`, "bad"); }
    }
    const base = !P.eng[k] ? 0 : P.flame[k] > 0 ? 0 : P.flight ? 70 : 10;
    P.tq[k] = Math.max(0, base - (P.vane[k] > 0.99 && base > 0 ? 4 : 0));
    // ice vanes
    const target = P.eai[k] === "ON" ? 1 : 0, main = P.act[k] === "MAIN";
    const noPwr = (main && P.fault.pwr[k]) || (!main && !P.eng[k]);
    const stuck = main && P.fault.stuck[k];
    if (!noPwr && !stuck && P.vane[k] !== target) P.vane[k] = target > P.vane[k] ? Math.min(1, P.vane[k] + dt / IC_VANE_TRAVEL) : Math.max(0, P.vane[k] - dt / IC_VANE_TRAVEL);
    const agree = Math.abs(P.vane[k] - target) < 0.001;
    P.failT[k] = agree ? 0 : P.failT[k] + dt;
    P["noPwr" + k] = noPwr && !agree;
    if (P.vane[k] >= 1 && !P["ext" + k]) { P["ext" + k] = true; icLog(`${k} ENG ANTI-ICE: ${SIDE[k].toLowerCase()} ice vanes extended. Expect slightly less torque and a little more ITT.`); }
    if (P.vane[k] <= 0 && P["ext" + k]) { P["ext" + k] = false; icLog(`${SIDE[k]} ice vanes retracted. Torque and ITT restored.`); }
  });
  // windshield heat (controller 90-110 F)
  const oatF = P.oat * 9 / 5 + 32;
  ["P", "C"].forEach(s => {
    const sel = P.ws[s];
    if (sel === "OFF") P.wsOn[s] = false;
    else if (P.wsT[s] < 90) P.wsOn[s] = true;
    else if (P.wsT[s] > 110) P.wsOn[s] = false;
    const heat = P.wsOn[s] ? (sel === "HIGH" ? 4 : 2) : 0, cool = (P.wsT[s] - oatF) * (P.flight ? 0.012 + P.ias / 30000 : 0.006);
    P.wsT[s] += (heat - cool) * dt / 2;
    const eff = sel !== "OFF" && P.wsT[s] >= 80 && !(P.flight && P.ias > 226);
    const o = "ws" + s + "o", i = "ws" + s + "i";
    if (icing) { P.ice[o] = eff ? Math.max(0, P.ice[o] - dt / 20) : Math.min(1, P.ice[o] + rate * 2); P.ice[i] = eff && sel === "NORMAL" ? Math.max(0, P.ice[i] - dt / 20) : Math.min(1, P.ice[i] + rate * 2); }
    else if (P.oat > 2 || sel !== "OFF") { P.ice[o] = Math.max(0, P.ice[o] - dt / 60); P.ice[i] = Math.max(0, P.ice[i] - dt / 60); }
  });
  // prop deice
  if (P.propAuto && !P.propMan) {
    P.propT += dt;
    if (P.propT >= 90) { P.propT = 0; P.propSide = OTHER[P.propSide]; P.propBlip = 0.6; icLog(`Prop deice timer: ${SIDE[P.propSide].toLowerCase()} propeller boots now heating (90 s).`); }
  }
  if (P.propBlip > 0) P.propBlip = Math.max(0, P.propBlip - dtReal);
  ["L", "R"].forEach(k => {
    const heating = icPropHeating(P, k);
    P.heatT[k] = heating ? P.heatT[k] + dt : 0;
    if (icing && !heating) P.ice["prop" + k] = Math.min(1.2, P.ice["prop" + k] + rate * 0.8);
    if (heating && P.heatT[k] > 12 && P.ice["prop" + k] > 0.05 && P.eng[k]) { P.ice["prop" + k] = 0; icLog(`${SIDE[k]} propeller ice loosened by the boots and thrown off.`, "ok"); }
  });
  icOnce("static", (P.propAuto || P.propMan) && !P.eng.L && !P.eng.R, "Prop deice with the propellers static: the slip rings will pit and burn. Turn it off.", "bad");
  // surface deice
  const ss = icSurfState(P);
  if (P.surfT >= 0 && !P.surfMan) { P.surfT += dt; if (P.surfT >= 10) { P.surfT = -1; icLog("Surface deice cycle complete (about 10 s). Boots back to vacuum hold-down."); } }
  const pneu = icPneu(P);
  const wingInf = pneu && (ss === "wing" || ss === "manual"), tailInf = pneu && (ss === "tail" || ss === "manual");
  P.wingP += ((wingInf ? 15 : 0) - P.wingP) * Math.min(1, dt / 0.6); P.tailP += ((tailInf ? 15 : 0) - P.tailP) * Math.min(1, dt / 0.6);
  const shed = (key, name, p) => {
    if (p >= 14 && !P.shedDone[key]) {
      P.shedDone[key] = true;
      const th = P.ice[key];
      if (th < 0.05) return;
      if (th < 0.5) icLog(`${name}: only ${th.toFixed(2)} in of ice. Too thin: it cracked and clung. Repeated cycles can build a shell outside the boot.`, "warn");
      else if (th <= 1.0) { P.ice[key] = 0; icLog(`${name}: ${th.toFixed(2)} in of ice cracked and shed cleanly.`, "ok"); }
      else { P.ice[key] = th * 0.6; icLog(`${name}: ${th.toFixed(2)} in is more than 1 in. Only part of it came off.`, "bad"); }
    }
    if (p < 2) P.shedDone[key] = false;
  };
  shed("wing", "Wing boots", P.wingP); shed("tail", "Tail boots", P.tailP);
  if (icing) { P.ice.wing = Math.min(1.6, P.ice.wing + rate); P.ice.tail = Math.min(1.6, P.ice.tail + rate); }
  // pitot, vents, stall
  ["L", "R"].forEach(k => {
    P.pIce[k] = icing && P.pitot[k] === "OFF" ? P.pIce[k] + dt : 0;
    icOnce("pi" + k, P.pIce[k] > 30, `${SIDE[k]} pitot icing: ${k === "L" ? "pilot's" : "copilot's"} airspeed unreliable. Turn on PITOT ${SIDE[k].toUpperCase()}.`, "bad");
    icOnce("vt" + k, icing && P.vent[k] === "OFF" && P.t > 5, `${SIDE[k]} fuel vent unheated in icing. The vent can ice over.`, "warn");
  });
  P.gndPitotT = !P.flight && (P.pitot.L === "ON" || P.pitot.R === "ON") ? P.gndPitotT + dt : 0;
  icOnce("gp", P.gndPitotT > 60, "Pitot heat on the ground: only for testing or short intervals to clear snow or ice.", "warn");
  icOnce("st", icing && !P.stall, "Stall warning heat off in icing. The lift transducer can freeze up.", "warn");
  // advisories
  const vmc = P.moist && P.oat <= 5;
  ["L", "R"].forEach(k => icOnce("vn" + k, vmc && P.vane[k] < 1 && P.t > 3, `Visible moisture at ${P.oat} °C: ${SIDE[k].toLowerCase()} ice vanes should be extended.`, "warn"));
  icOnce("hot", !P.flight && P.oat > 10 && (P.eai.L === "ON" || P.eai.R === "ON"), `OAT ${P.oat} °C: retract the ice vanes for takeoff above +10 °C (King Air 350).`, "warn");
  icOnce("ign", (icing || (P.flight && P.moist)) && (P.ign.L !== "ARM" || P.ign.R !== "ARM"), "Precipitation or icing: arm auto-ignition on both engines.", "warn");

/* ---------- oil-to-fuel heat exchanger (high-resolution) ---------- */
const OFHC = {
  fin: { name: "Fuel in", desc: "From the firewall fuel filter and engine-driven boost pump. With no fuel temperature gauge ahead of the exchanger, assume this fuel is at OAT." },
  fout: { name: "Fuel out (to the HP pump and FCU)", desc: "Warmed fuel goes on to the engine-driven high-pressure pump and the fuel control unit, so ice can't form at the pump filter." },
  oin: { name: "Oil in (hot engine oil)", desc: "Hot engine oil enters at the top and flows down through the heat exchanger core." },
  oout: { name: "Oil out", desc: "Oil leaves past the slide valve and returns to the engine oil system." },
  core: { name: "Heat exchanger core", desc: "The oil and fuel lines run side by side through the core. Heat moves by conduction from oil to fuel, melting ice particles that may have formed in the fuel." },
  thermal: { name: "Thermal element", desc: "Sits in the fuel outlet and senses the warmed fuel's temperature. It is linked to the slide valve." },
  slide: { name: "Slide valve", desc: "Positioned by the thermal element. With cold fuel it sends the oil through the core. Once the fuel is warm enough it lets oil bypass the core straight to OIL OUT, holding the fuel temperature in the desired range." },
  body: { name: "Oil-to-fuel heat exchanger", desc: "Mounted on each engine's accessory section. Fully automatic whenever the engine is running. No pilot control. A minimum oil temperature of 55 °C is recommended for heater operation at takeoff power." }
};
function ofhInit() {
  const T = (x, y, s, cls, anchor) => `<text x="${x}" y="${y}" class="${cls || "ofh-lbl"}" text-anchor="${anchor || "middle"}">${s}</text>`;
  const comp = (id, inner, hit) => `<g class="comp" data-ofhcomp="${id}" tabindex="0" role="button" aria-label="${esc(OFHC[id].name)}"><rect class="hit" x="${hit[0]}" y="${hit[1]}" width="${hit[2]}" height="${hit[3]}" rx="6"/>${inner}</g>`;
  const arrows = (key, pts, cls) => { let a = ""; for (let i = 0; i < pts.length - 1; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], len = Math.hypot(x2 - x1, y2 - y1); if (len < 70) continue; const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; const n = len > 260 ? 2 : 1; for (let j = 1; j <= n; j++) { const t = j / (n + 1); a += `<path class="ofh-arr ${cls}" data-ofha="${key}" transform="translate(${x1 + (x2 - x1) * t},${y1 + (y2 - y1) * t}) rotate(${ang})" d="M-9,-8 L9,0 L-9,8 Z"/>`; } } return a; };
  const pipe = (key, pts, cls) => { const p = pts.map(q => q.join(",")).join(" "); return `<polyline class="ofh-pipe-case" points="${p}"/><polyline class="ofh-pipe ${cls}" data-ofhp="${key}" points="${p}"/><polyline class="ofh-flow" data-ofhf="${key}" points="${p}"/>${arrows(key, pts, cls)}`; };
  let s = "";
  // housing
  s += comp("body", `<path class="ofh-house" d="M330,96 L790,96 L790,250 L760,250 L760,280 C800,280 812,300 812,330 L812,452 C812,488 790,510 750,510 L292,510 C250,510 222,488 222,452 L222,338 C222,300 250,280 292,280 L330,280 Z"/><rect class="ofh-house" x="812" y="110" width="34" height="390" rx="4"/>${[150, 230, 380, 460].map(y => `<circle class="ofh-bolt" cx="829" cy="${y}" r="7"/>`).join("")}`, [222, 96, 624, 414]);
  s += comp("core", `<rect class="ofh-core" x="262" y="300" width="510" height="190" rx="22"/>${Array.from({ length: 30 }, (_, i) => `<line class="ofh-fin" x1="${282 + i * 16.5}" y1="306" x2="${282 + i * 16.5}" y2="484"/>`).join("")}`, [262, 300, 510, 190]);
  // ports
  s += `<rect class="ofh-port" x="398" y="56" width="64" height="42" rx="4"/><rect class="ofh-port" x="488" y="56" width="64" height="42" rx="4"/><rect class="ofh-port" x="150" y="372" width="74" height="62" rx="4"/><rect class="ofh-port" x="846" y="168" width="40" height="44" rx="4"/>`;
  // oil path (blue) under fuel
  s += pipe("oilIn", [[520, 40], [520, 190]], "oil");
  s += pipe("oilCore", [[520, 190], [520, 452], [690, 452], [690, 190]], "oil");
  s += pipe("oilBy", [[520, 190], [600, 190]], "oil");
  s += pipe("oilOut", [[690, 190], [910, 190]], "oil");
  // fuel path (red)
  const fuel = [[100, 403], [730, 403], [730, 340], [430, 340], [430, 30]];
  s += pipe("fuel", fuel, "fuel");
  // slide valve + thermal element
  s += comp("slide", `<rect class="ofh-valvebody" x="596" y="162" width="114" height="58" rx="8"/><rect class="ofh-spool" id="ofhSpool" x="612" y="170" width="44" height="42" rx="5"/>${T(640, 152, "SLIDE VALVE", "ofh-lbl-b")}`, [592, 134, 122, 90]);
  s += comp("thermal", `<rect class="ofh-thermal" x="410" y="176" width="40" height="38" rx="5"/><polyline class="ofh-link" points="450,186 468,128 700,128 700,162"/>${T(398, 200, "THERMAL", "ofh-lbl-b", "end")}${T(398, 218, "ELEMENT", "ofh-lbl-b", "end")}`, [300, 140, 160, 86]);
  // heat transfer glyphs
  s += [[600, 372], [470, 372], [520, 422], [690, 372], [360, 372], [600, 428]].map(([x, y]) => `<path class="ofh-heat" d="M${x - 10},${y + 8} q5,-8 0,-16 q-5,-8 0,-16 M${x + 2},${y + 8} q5,-8 0,-16 q-5,-8 0,-16 M${x + 14},${y + 8} q5,-8 0,-16 q-5,-8 0,-16"/>`).join("");
  // labels + clickable ports
  s += comp("fin", `${T(110, 365, "FUEL IN", "ofh-lbl-b", "start")}${T(110, 456, "from firewall filter", "ofh-lbl", "start")}`, [96, 345, 130, 120]);
  s += comp("fout", `${T(430, 22, "FUEL OUT → HP PUMP / FCU", "ofh-lbl-b", "end")}`, [250, 4, 196, 40]);
  s += comp("oin", `${T(532, 22, "OIL IN (hot)", "ofh-lbl-b", "start")}`, [508, 4, 140, 40]);

  s += `<text class="ofh-state" id="ofhState" x="500" y="584" text-anchor="middle"></text>`;
  $("#ofhschem").innerHTML = s;

  $("#ofhRun").addEventListener("click", () => { ofhRunning = !ofhRunning; ofhRender(); });

  $("#ofhInfo").innerHTML = `<h3>Component details</h3><p>Select any port, the core, the thermal element or the slide valve.</p>`;

function ofhRender() {
  const run = ofhRunning, cold = ofhMode === "cold";

  $("#ofhRun").setAttribute("aria-pressed", String(run)); $("#ofhRun").textContent = run ? "Engine running" : "Engine stopped";
  const on = { fuel: run, oilIn: run, oilCore: run && cold, oilBy: run && !cold, oilOut: run };

}

function acFresh() {
  return { t: 0, speed: 5, flight: false, oat: 20, gpu: false, n1: { L: 62, R: 62 }, bleed: { L: "OPEN", R: "OPEN" }, envLow: false, mode: "AUTO", knob: 0.5,
    vent: "AUTO", aftBlower: false, elec: false, aftHeat: false, knobs: { pilot: false, defrost: false, cabin: false, copilot: false },
    byp: { L: 0.5, R: 0.5 }, man: 0, acReq: false, doorOpen: false, cabinF: 72, script: null, warned: {} };
}
function acLog(msg, cls) {
  acLogArr.unshift({ t: AC.t, msg, cls: cls || "" }); if (acLogArr.length > 50) acLogArr.pop();
  const h = $("#acLog"); if (h) h.innerHTML = acLogArr.map(e => `<li class="${e.cls}"><span class="t">${fmtIcT(e.t)}</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
function acOnce(key, cond, msg, cls) { if (cond && !AC.warned[key]) { AC.warned[key] = true; acLog(msg, cls); } if (!cond) AC.warned[key] = false; }
const acF = c => c * 9 / 5 + 32;

function acMoveValves(dir, dt) {
  // one valve at a time: toward cold the right valve goes first, toward heat the left valve goes first
  const P = AC, step = dt / 30;
  if (dir < 0) { if (P.byp.R > 0) P.byp.R = Math.max(0, P.byp.R - step); else P.byp.L = Math.max(0, P.byp.L - step); }
  else if (dir > 0) { if (P.byp.L < 1) P.byp.L = Math.min(1, P.byp.L + step); else P.byp.R = Math.min(1, P.byp.R + step); }
}
function acStep(dtReal) {
  const P = AC, dt = dtReal * P.speed; P.t += dt;
  if (P.script && P.script.length && P.t >= P.script[0].t) { const s = P.script.shift(); s.do(P); acLog("Setup: " + s.msg); }
  const d = { run: {}, envOpen: {}, pneuOpen: {}, flow: {}, sideF: {} }, oatF = acF(P.oat);
  ["L", "R"].forEach(k => { d.run[k] = P.n1[k] > 0; d.envOpen[k] = P.bleed[k] === "OPEN" && d.run[k]; d.pneuOpen[k] = P.bleed[k] !== "PNEU" && d.run[k]; });
  d.ambOpen = P.flight && oatF > 50;
  d.power = P.gpu || d.run.L || d.run.R;
  ["L", "R"].forEach(k => {
    d.flow[k] = d.envOpen[k] ? (P.envLow ? 0.5 : 1) * (d.ambOpen ? 1.3 : 1) : 0;
    const p3F = oatF + 100 + Math.max(0, P.n1[k] - 60) * 4, mixF = d.ambOpen ? 0.75 * p3F + 0.25 * oatF : p3F;
    const hxF = oatF + (mixF - oatF) * (P.flight ? 0.25 : 0.55);
    d.sideF[k] = hxF + (mixF - hxF) * P.byp[k];
  });
  d.envFlow = d.flow.L + d.flow.R;
  d.envAirF = d.envFlow ? (d.flow.L * d.sideF.L + d.flow.R * d.sideF.R) / d.envFlow : null;
  d.press = P.flight && d.envFlow > 0;
  if (!P.flight || d.press) { if (P.doorOpen) acLog(P.flight ? "Repressurized: the ram air door closes." : "On the ground: ram air door closed."); P.doorOpen = false; }
  else if (!P.doorOpen) { P.doorOpen = true; acLog("Unpressurized in flight: ram air pushes the evaporator door open. Ambient air enters the forward evaporator compartment.", "warn"); }
  d.ventSpd = !d.power ? 0 : P.vent === "HIGH" ? 2 : P.vent === "LO" ? 1 : P.mode !== "OFF" ? 1 : 0;
  if (P.elec && P.flight) { P.elec = false; acLog("In flight: control power is removed, so electric heat is unavailable. The ELEC HEAT switch springs OFF.", "warn"); }
  d.elecOk = P.elec && !P.flight && d.power && (P.mode === "AUTO" || P.mode === "MAN HEAT");
  d.eFwd = d.elecOk; d.eAft = d.elecOk && P.aftBlower;
  // temperature control
  const target = 60 + 25 * P.knob;
  if (P.mode === "AUTO") { const err = P.cabinF - target; if (err > 1.5) acMoveValves(-1, dt); else if (err < -1.5) acMoveValves(1, dt); }
  else if ((P.mode === "MAN HEAT" || P.mode === "MAN COOL") && P.man) acMoveValves(P.man, dt);
  if (P.mode === "AUTO") { if (P.byp.L <= 0.001) P.acReq = true; else if (P.byp.L > 1 / 3) P.acReq = false; }
  else P.acReq = P.mode === "MAN COOL" && P.byp.L <= 1 / 3;
  d.comp = P.acReq && oatF >= 50 && d.run.R && P.n1.R >= 62;
  d.n1Low = P.acReq && d.run.R && P.n1.R < 62;
  d.cold = P.acReq && oatF < 50;
  d.condBlower = d.comp && !P.flight;
  d.aftCool = d.comp && P.aftBlower && d.power;
  // duct temperature (floor duct) and cabin temperature (illustrative)
  const recircF = d.comp && d.ventSpd ? P.cabinF - 35 : P.cabinF;
  d.ductF = d.envFlow ? (d.envFlow * d.envAirF + 0.4 * (d.ventSpd * 0.5) * recircF) / (d.envFlow + 0.4 * d.ventSpd * 0.5) + (P.knobs.cabin ? 45 : 0) + (d.eFwd ? 30 : 0) : recircF + (d.eFwd ? 60 : 0);
  d.overtemp = d.ductF > 300;
  let w = 0, s = 0; const add = (wt, f) => { w += wt; s += wt * f; };
  if (d.envFlow) add(d.envFlow * 0.5, oatF + (d.envAirF - oatF) * 0.6);
  if (d.comp) add(0.25 + 0.45 * d.ventSpd, 45);
  if (d.aftCool) add(0.6, 45);
  if (d.eFwd) add(0.55, 110); if (d.eAft) add(0.55, 110);
  add(0.3, oatF + (!P.flight && P.oat > 25 ? 25 : 0));
  if (P.doorOpen) add(0.5, oatF);
  d.teq = s / w; if (d.teq > 95) d.teq = 95 + (d.teq - 95) * 0.3;
  P.cabinF += (d.teq - P.cabinF) * Math.min(1, dt / 120);
  d.target = target;
  ACD = d;
  // events
  acOnce("ot", d.overtemp, `DUCT OVERTEMP: floor duct about ${Math.round(d.ductF)} °F (above ~300 °F).${P.knobs.cabin ? " CABIN AIR is pulled out, restricting the duct." : ""}`, "bad");
  acOnce("n1", d.n1Low, "AIR COND N1 LOW: air conditioning requested but the right engine is below 62% N1. Compressor clutch disconnected. Set the right condition lever to hold 62–64% N1.", "warn");
  acOnce("cold", d.cold, "Air conditioning requested but ambient is below about 50 °F, so the compressor is locked out.", "warn");
  acOnce("comp", d.comp, `Air conditioner on: compressor running on the right engine${d.condBlower ? ", condenser blower running (on the ground)" : ", condenser cooled by ram air (in flight)"}.`, "ok");
  acOnce("to", !P.flight && P.oat > 10 && !P.envLow && (P.n1.L >= 95 || P.n1.R >= 95) && d.envFlow > 0, "Takeoff power above +10 °C: ENVIR BLEED AIR should be LOW for takeoff.", "warn");
  acOnce("eaft", d.eFwd && !P.aftBlower, "Electric heat with the aft blower off: only the forward element is energized. Turn the aft blower on for full heat.", "warn");
  acOnce("egpu", P.elec && !P.flight && !d.power, "Electric heat needs external power or a generator.", "warn");
  acRender();
}

function prFresh() {
  return { t: 0, speed: 10, flight: false, field: 0, alt: 0, tgt: 0, vs: 2000, oat: 15, eng: { L: true, R: true }, bleed: { L: "OPEN", R: "OPEN" }, low: false,
    set: 2000, rate: 500, ref: 0, cab: 0, cabRate: 0, sw: "PRESS", test: false, cb: true, altTest: false, diffTest: false, mw: false, toneOff: false,
    seq: { L: 9, R: 9 }, ambT: { L: 0, R: 0 }, fault: { squat: false, preset: false, stuckOpen: false }, hist: [], script: null, warned: {}, prevAnn: {} };
}
function prLog(msg, cls) {
  prLogArr.unshift({ t: PR.t, msg, cls: cls || "" }); if (prLogArr.length > 60) prLogArr.pop();
  const h = $("#prLog"); if (h) h.innerHTML = prLogArr.map(e => `<li class="${e.cls}"><span class="t">${fmtIcT(e.t)}</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
function prOnce(key, cond, msg, cls) { if (cond && !PR.warned[key]) { PR.warned[key] = true; prLog(msg, cls); } if (!cond) PR.warned[key] = false; }

function prFcu(P, k, d) {
  // one flow control unit: lb/min (bleed, ambient, bypass) and the start-up sequence state
  const run = P.eng[k], open = P.bleed[k] === "OPEN" && run && P.cb !== null;
  const oatF = P.oat * 9 / 5 + 32;
  if (!open) P.seq[k] = 0; else if (P.seq[k] < 9) P.seq[k] += d;   // 0..1.5 closing, 1.5..2.5 solenoid/shutoff, 2.5..4 opening to flow
  const s = P.seq[k];
  const ambAllowed = P.flight && oatF > 50 && open;
  P.ambT[k] = ambAllowed ? P.ambT[k] + d : 0;
  const ambOpen = ambAllowed && (k === "L" || P.ambT[k] > 5);
  let bleed = 0, amb = 0, byp = 0;
  const f = P.low ? 0.5 : 1;
  if (open && s >= 2.5) {
    const ramp = Math.min(1, (s - 2.5) / 1.5);
    if (!P.flight) bleed = Math.max(2.5, Math.min(6, 5 - (oatF - 50) * 0.03)) * f;
    else if (ambOpen) { bleed = Math.max(2.5, Math.min(6, 6 - (oatF - 50) * 0.05)) * f; amb = Math.max(0, 6 * f - bleed); }
    else { bleed = (oatF < 20 ? 7 : 6) * f; byp = P.low ? 0.05 : oatF < 50 ? 0.6 : 0.3; }
    bleed *= ramp; amb *= ramp;
  }
  return { run, open, seq: s, sol: open && s >= 1.5, sov: open && s >= 2.5, bvClosing: open && s < 1.5, ambOpen, bleed, amb, byp, total: bleed + amb };
}

function prStep(dtReal) {
  const P = PR, dt = dtReal * P.speed; P.t += dt;
  // script
  if (P.script) {
    while (P.script.length) { const st = P.script[0]; if (st.wait !== undefined && P.t - (P.scriptT0 || 0) < st.wait) break; if (st.until && !st.until(P)) break; P.script.shift(); st.do(P); if (st.msg) prLog("Scenario: " + st.msg); P.scriptT0 = P.t; }
  }
  // airplane
  if (P.flight) {
    const dh = P.tgt - P.alt, step = P.vs / 60 * dt;
    P.alt += Math.sign(dh) * Math.min(Math.abs(dh), step);
    if (P.alt <= P.field + 1 && P.tgt <= P.field) { P.flight = false; P.alt = P.field; prLog("Touchdown: the left squat switch goes to ground mode."); }
  } else P.alt = P.field;
  const d = { fcu: {} };
  ["L", "R"].forEach(k => d.fcu[k] = prFcu(P, k, dt));
  d.inflow = d.fcu.L.total + d.fcu.R.total;
  d.vacuum = ["L", "R"].some(k => P.eng[k] && P.bleed[k] !== "PNEU");
  // electrical: squat signal (or failed-on-ground switch), CABIN PRESS position, PRESS CONTROL breaker
  const gnd = !P.flight || P.fault.squat;
  const sw = P.test ? "TEST" : P.sw;
  d.energized = P.cb && (sw === "DUMP" || (sw === "PRESS" && gnd));
  d.presetClosed = d.energized || P.fault.preset;
  d.dumpOpen = d.energized;
  d.doorHeld = P.cb && sw !== "DUMP";
  // valves
  const Pa = prP(P.alt), Pc = prP(P.cab);
  d.dp = Pc - Pa;
  d.safety = (d.dumpOpen && d.vacuum) || P.fault.stuckOpen;
  d.ctlActive = !d.presetClosed && d.vacuum;
  // controller reference: vented to the cabin when vacuum is cut; otherwise moves toward CABIN ALT at RATE
  if (!d.ctlActive) P.ref = P.cab;
  else { const dr = P.set - P.ref, st = P.rate / 60 * dt; P.ref += Math.sign(dr) * Math.min(Math.abs(dr), st); }
  // cabin altitude
  const prev = P.cab;
  const maxDiffAlt = prCabFor(P.alt);                    // cabin can't be lower than this (relief at max differential)
  const capDp = Math.min(PR_MAXD, d.inflow >= 4 ? PR_MAXD : d.inflow / 4 * PR_MAXD);
  const inflowFloor = d.inflow > 0 ? prH(Pa + capDp) : P.alt;
  const leakRate = (500 + 230 * Math.max(0, d.dp)) / 60;  // ft/s climb when inflow can't hold
  d.mode = "";
  if (d.safety) {
    const tgt = P.fault.stuckOpen ? P.alt : Math.min(P.alt, Math.max(PR_LIMIT, Math.min(P.cab, P.alt)));
    const lim = P.alt > PR_LIMIT && !P.fault.stuckOpen ? Math.min(P.alt, PR_LIMIT) : P.alt;
    P.cab += Math.sign(lim - P.cab) * Math.min(Math.abs(lim - P.cab), 4000 / 60 * dt);
    d.mode = P.alt > PR_LIMIT && !P.fault.stuckOpen && P.cab >= PR_LIMIT - 10 ? "dump-limit" : "dump";
    void tgt;
  } else if (d.ctlActive) {
    let want = Math.min(P.ref, PR_LIMIT);
    if (want < maxDiffAlt) want = maxDiffAlt;
    if (want < inflowFloor) want = inflowFloor;
    const dc = want - P.cab, up = want > P.cab;
    const r = (up && want === inflowFloor && inflowFloor > Math.max(maxDiffAlt, Math.min(P.ref, PR_LIMIT))) ? leakRate : 3000 / 60;
    P.cab += Math.sign(dc) * Math.min(Math.abs(dc), r * dt);
    d.mode = want === maxDiffAlt && P.ref < maxDiffAlt ? "maxdiff" : want === inflowFloor && inflowFloor > Math.min(P.ref, PR_LIMIT) + 1 ? "leak" : "ctl";
  } else {
    // outflow held closed, safety closed: cabin pressurizes toward max differential if there is inflow
    if (d.inflow > 0) { const tgt = Math.max(maxDiffAlt, inflowFloor); P.cab += Math.sign(tgt - P.cab) * Math.min(Math.abs(tgt - P.cab), (150 * d.inflow) / 60 * dt); d.mode = P.cab <= maxDiffAlt + 5 ? "maxdiff" : "closed"; }
    else { P.cab = Math.min(P.alt, P.cab + leakRate * dt); d.mode = "leak"; }
  }
  if (P.cab > P.alt) P.cab = P.alt;                      // negative relief: cabin never above the airplane
  if (d.mode === "ctl" && P.flight && prP(P.cab) - prP(P.alt) >= 6.45) d.mode = "maxdiff";
  if (!P.flight && !d.ctlActive && !d.safety && d.inflow === 0) P.cab = P.alt;
  d.dp = prP(P.cab) - prP(P.alt);
  P.cabRate += ((P.cab - prev) / Math.max(dt, 1e-6) * 60 - P.cabRate) * Math.min(1, dt / 4);
  // outflow valve opening (illustrative) and safety
  d.ofv = !d.ctlActive ? 0 : d.mode === "maxdiff" ? 0.75 : Math.max(0.05, Math.min(1, 0.35 + (P.cabRate / 2000) + (d.inflow / 30)));
  if (d.mode === "leak") d.ofv = d.ctlActive ? 0.02 : 0;
  d.relief = d.mode === "maxdiff";
  d.ann = { calt: P.altTest || P.cab >= 10250, chi: P.altTest || P.cab >= 11750, dhi: P.diffTest || d.dp > 6.9, lbl: P.bleed.L !== "OPEN", rbl: P.bleed.R !== "OPEN" };
  ["chi", "dhi"].forEach(k => { if (d.ann[k] && !P.prevAnn[k]) P.mw = true; P.prevAnn[k] = d.ann[k]; });
  ["calt", "chi"].forEach(k => { if (d.ann[k] && !P.prevAnn[k + "T"]) P.toneOff = false; P.prevAnn[k + "T"] = d.ann[k]; });
  d.tone = (d.ann.calt || d.ann.chi) && !P.toneOff;
  PRD = d;
  // history
  if (!P.hist.length || P.t - P.hist[P.hist.length - 1][0] >= 10) { P.hist.push([P.t, P.alt, P.cab]); if (P.hist.length > 600) P.hist.shift(); }
  // events
  prOnce("ca", P.cab >= 10250 && !P.altTest, `CABIN ALTITUDE (white) plus tone: cabin at ${fmtFt(P.cab)} ft.`, "warn");
  prOnce("chi", P.cab >= 11750 && !P.altTest, `CABIN ALT HI (red) plus tone: cabin ${fmtFt(P.cab)} ft. Oxygen required.`, "bad");
  prOnce("mask", P.cab >= 12500, "Cabin passing 12,500 ft: passenger oxygen masks should deploy. If not, pull the manual dropout handle.", "bad");
  prOnce("md", d.mode === "maxdiff" && P.flight, `On maximum differential (${d.dp.toFixed(2)} psid): the ${PR.fault.preset ? "safety valve relief" : "safety and outflow relief valves"} are limiting differential. Expect pressure bumps.`, "warn");
  prOnce("dl", d.mode === "dump-limit", "Dumping above 13,500 ft: the 350 altitude limit controller holds the cabin near 13,500 ft.", "warn");
  prOnce("dhi", d.dp > 6.9 && !P.diffTest, "CABIN DIFF HI: differential above 6.9 psid.", "bad");
  prOnce("noin", P.flight && d.inflow === 0 && P.t > 2, "No inflow: both environmental shutoff valves closed. The cabin is leaking down toward airplane altitude.", "bad");
  prOnce("nv", !d.vacuum && (P.eng.L || P.eng.R), "No vacuum (no pneumatic air): the outflow valve springs closed and the safety valve can't dump.", "warn");
  prOnce("sq", P.flight && P.fault.squat && P.sw === "PRESS" && !P.test && P.cb, "After takeoff the cabin is climbing with the airplane: the left squat switch is still signaling ground, so the safety valve is open and the preset solenoid closed.", "bad");
  prOnce("ps", P.flight && P.fault.preset, "Cabin descending fast after takeoff: the preset solenoid is stuck closed, so no controller pressure reaches the outflow valve and it's held shut.", "bad");
  prRender();
}
