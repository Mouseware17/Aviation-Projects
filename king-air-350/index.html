  fTimer = setInterval(() => fStep(0.25), 250);
}


/* ================= Chapter 7: Powerplant ================= */
const PL_IDLE = 24, PL_GF = 14, CL_GATE = 10, PR_FTH = 10;
let PP = null, ppTimer = null, ppSide = "L", ppTab = "gas", ppSel = null, ppScen = 0, ppScript = null, ppLogArr = [];
const clamp01 = v => Math.max(0, Math.min(1, v));

function ppEngine() {
  return { pl: PL_IDLE, pr: 5, cl: 0, start: "OFF", autoIgn: false, n1: 0, itt: 15, np: 0, tq: 0, ff: 0, oilP: 0, oilT: 15, blade: 1,
    lit: false, startPhase: false, wetT: 0, peak: 0, purgeT: 0, starterT: 0, mode: "SHUT DOWN", ctl: "", topping: false, warned: {}, stallT: 0, prevN1: 0, starterHold: 0 };
}
function ppFresh() {
  return { E: { L: ppEngine(), R: ppEngine() }, env: { flight: false, oat: 15, gen: { L: true, R: true }, ac: false },
    fault: { chip: { L: false, R: false }, bleedOpen: { L: false, R: false }, bleedClosed: { L: false, R: false }, hp: { L: false, R: false }, boost: { L: false, R: false }, csu: { L: false, R: false } },
    lift: { pwr: false, cnd: false }, together: true, t: 0 };
}
function ppLog(msg, cls) {
  ppLogArr.unshift({ t: PP.t, msg, cls: cls || "" }); if (ppLogArr.length > 50) ppLogArr.pop();
  const h = $("#ppLog"); if (h) h.innerHTML = ppLogArr.map(e => `<li class="${e.cls}"><span class="t">${e.t.toFixed(1)}s</span><span class="m">${esc(e.msg)}</span></li>`).join("");
}
function warnOnce(e, key, cond, msg, cls) { if (cond && !e.warned[key]) { e.warned[key] = true; ppLog(msg, cls || "warn"); } if (!cond) e.warned[key] = false; }
const npSetOf = e => 1450 + clamp01((e.pr - 12) / 88) * 250;
const idleOf = e => 62 + clamp01((e.cl - CL_GATE) / 90) * 8;

function ppStep(dt) {
  PP.t += dt;
  const env = PP.env, F = PP.fault;
  ["L", "R"].forEach(k => {
    const e = PP.E[k], S = SIDE[k];
    const fuelSel = e.cl >= CL_GATE;
    if (e.start === "STARTER") { e.starterHold -= dt; if (e.starterHold <= 0) { e.start = "OFF"; ppLog(`${S} STARTER ONLY released (spring-loaded to OFF).`); } }
    const starter = e.start === "ON" || e.start === "STARTER";
    const ign = e.start === "ON" || (e.autoIgn && e.tq < 17);
    e.ign = ign;
    const flowing = fuelSel && !F.hp[k] && e.n1 >= 8;
    // light-off / flameout
    if (flowing && !e.lit) {
      if (ign) {
        e.lit = true; e.startPhase = e.n1 < idleOf(e) - 1;
        e.peak = 760 + Math.max(0, 12 - e.n1) * 150 + Math.min(e.wetT, 10) * 30 + (env.oat - 15) * 2;
        ppLog(e.startPhase ? `${S} light-off at ${e.n1.toFixed(0)}% N1${e.n1 < 12 ? ". Fuel was introduced below 12% N1: expect a hot start." : "."}${e.wetT > 2 ? " Pooled fuel adds to the ITT peak." : ""}` : `${S} engine relights (igniters on).`, e.n1 < 12 && e.startPhase ? "warn" : "");
        e.wetT = 0;
      } else { e.wetT += dt; warnOnce(e, "wet", e.wetT > 2, `${S}: fuel is flowing with no ignition. That's a wet start risk, and STARTER ONLY clears the fuel.`); }
    } else if (!flowing) e.wetT = Math.max(0, e.wetT - dt * 0.5);
    if (e.lit && !flowing) {
      e.lit = false; e.startPhase = false;
      if (!fuelSel) { e.purgeT = 1.5; ppLog(`${S} condition lever to FUEL CUTOFF. The P3 manifold purge burns residual fuel, so spool-down starts after 1–2 s.`); }
      else if (F.hp[k]) ppLog(`${S} high-pressure fuel pump failed. The minimum pressurizing valve closes and the engine flames out.`, "bad");
      else ppLog(`${S} engine flamed out.`, "bad");
    }
    // N1
    const idle = idleOf(e);
    if (e.lit) {
      let cmd;
      if (e.pl >= PL_IDLE) cmd = idle + (e.pl - PL_IDLE) / (100 - PL_IDLE) * (104 - idle);
      else if (e.pl >= PL_GF) cmd = idle;
      else cmd = idle + (PL_GF - e.pl) / PL_GF * (86 - idle);
      if (e.startPhase) {
        e.n1 += (2.6 + (starter ? 1.6 : 0) + (e.n1 > 37 ? 1.8 : 0)) * dt;
        if (e.n1 >= 37 && e.prevN1 < 37) ppLog(`${S} secondary nozzles flowing (~37% N1). All 14 nozzles now deliver fuel, and N1 accelerates noticeably.`);
        if (e.n1 >= idle - 1) { e.startPhase = false; ppLog(`${S} stabilized at idle, ${idle.toFixed(0)}% N1. Turn the start switch OFF.`); }
      } else e.n1 += Math.max(-6 * dt, Math.min(8 * dt, (cmd - e.n1) * dt / 1.6));
    } else if (e.purgeT > 0) e.purgeT -= dt;
    else {
      const tgt = starter ? 20 : 0;
      e.n1 += (tgt - e.n1) * dt / (tgt > e.n1 ? 2.4 : 3.5);
      if (e.n1 < 0.05) e.n1 = 0;
    }
    if (starter) { e.starterT += dt; warnOnce(e, "starter", e.starterT > 30, `${S} starter has run 30 s. Limit is 30 s ON, then 5 min OFF.`); } else e.starterT = 0;
    // bleed valve
    e.bleedOpen = F.bleedOpen[k] ? true : F.bleedClosed[k] ? false : e.n1 < 90;
    // SHP
    const dens = 288 / (273 + env.oat) * (env.flight ? 0.72 : 1);
    let shp = e.lit ? 1180 * dens * Math.pow(clamp01((e.n1 - 55) / 49), 1.8) : 0;
    if (e.bleedOpen && e.n1 > 85) shp *= 0.88;
    // ITT
    if (e.lit) {
      const pen = ((env.gen[k] ? 90 : 0) + (k === "R" && env.ac ? 160 : 0)) * clamp01((78 - e.n1) / 16);
      const steadyAt = n => 520 + 6.4 * (n - 62) + (env.oat - 15) * 2.2 + pen + (e.bleedOpen && n > 85 ? 55 : 0) - (env.flight ? 15 : 0);
      let tgt = steadyAt(e.n1);
      if (e.startPhase) { const base = steadyAt(idle); tgt = Math.max(tgt, base + (e.peak - base) * Math.exp(-Math.pow((e.n1 - 26) / 11, 2))); }
      if (F.bleedClosed[k] && e.n1 < 85 && e.n1 - e.prevN1 > 0.25 * dt * 10 && !e.startPhase) { if (e.stallT <= 0) ppLog(`${S} compressor stall: the bleed valve is stuck closed during acceleration at low N1. Bang, ITT spike.`, "bad"); e.stallT = 1.5; }
      if (e.stallT > 0) { e.stallT -= dt; tgt += 120; }
      e.itt += (tgt - e.itt) * dt / 1.1;
    } else e.itt += (env.oat + 20 - e.itt) * dt / 8;
    // oil
    e.oilP = e.n1 < 10 ? e.n1 * 4.5 : 55 + (Math.min(e.n1, 80) - 10) * 0.85;
    e.oilT += ((e.n1 > 5 ? 45 + e.n1 * 0.4 + (env.oat - 15) * 0.3 : env.oat) - e.oilT) * dt / 40;
    // propeller
    const npSet = npSetOf(e);
    const ram = env.flight ? 950 : 0;
    const npFine = e.lit ? 900 + 2200 * Math.pow(shp / 1180, 0.75) + ram : (env.flight ? 1150 : 0);
    let feather = e.pr < PR_FTH || (!env.flight && (!e.lit || e.oilP < 40));
    let npT, blade, mode, ctl; e.topping = false;
    if (feather) {
      blade = 1; npT = e.lit ? Math.min(npFine * 0.3, 650) : 0;
      mode = e.lit ? "FEATHERED" : (e.n1 > 0.5 ? (e.startPhase || e.start !== "OFF" ? "STARTING" : "SPOOLING DOWN") : "SHUT DOWN");
      ctl = e.pr < PR_FTH ? "Prop lever in FEATHER: the feathering valve dumps governor oil, and springs plus counterweights drive the blades to the feather stop." : "No governor oil pressure: the propeller sits on its feather stop until the engine is running.";
    } else if (!e.lit && env.flight) {
      blade = 0.25; npT = Math.min(npSet, 1150); mode = "WINDMILLING";
      ctl = "Engine not running, propeller windmilling with high drag. Feather it: prop lever to FEATHER.";
    } else if (e.pl >= PL_IDLE) {
      if (F.csu[k]) {
        const top = npSet * 1.06; npT = Math.min(npFine, top); e.topping = npFine > top;
        blade = 0.15; mode = "CSU FAILED";
        ctl = e.topping ? `Constant speed governor failed. The fuel topping governor bleeds FCU air and cuts fuel to hold about ${Math.round(top)} rpm. More power lever has no effect.` : "Constant speed governor failed. Np follows power until the fuel topping governor takes over.";
      } else if (npFine >= npSet) {
        npT = npSet; blade = 0.18 + 0.55 * clamp01((npFine - npSet) / 2600); mode = "ALPHA";
        ctl = `Constant speed: the CSU varies blade angle to hold ${Math.round(npSet)} rpm. The power lever sets N1 only.`;
      } else {
        npT = npFine; blade = 0.15 + (e.pl - PL_IDLE) / 76 * 0.04; mode = "BETA";
        ctl = `Below governing speed (Np < ${Math.round(npSet)}). The blades rest at the flight-idle angle set through the beta valve, and the CSU is in underspeed.`;
      }
    } else if (e.pl >= PL_GF) {
      blade = (e.pl - 19) / 5 * 0.15; npT = npFine; mode = "GROUND FINE";
      ctl = "Ground fine: the power lever sets blade angle through the cambox and beta valve. N1 stays at idle. Zero thrust is near the middle of this range.";
    } else {
      const top = npSet * 0.97; blade = -0.15 - (PL_GF - e.pl) / PL_GF * 0.25; npT = Math.min(npFine, top); e.topping = npFine > top; mode = "REVERSE";
      ctl = `Reverse: the power lever sets both N1 and reverse blade angle. The fuel topping governor, reset below the selected speed, limits Np to about ${Math.round(top)} rpm.`;
    }
    e.np += (npT - e.np) * dt / 1.3; if (e.np < 1) e.np = 0;
    e.blade += (blade - e.blade) * dt / 0.8;
    e.mode = e.startPhase ? "STARTING" : mode; e.ctl = e.startPhase ? "Starting: the starter and the FCU's start fuel schedule accelerate the gas generator. Watch ITT." : ctl;
    e.tq = e.lit && e.np > 60 ? shp / 1050 * 1700 / e.np * 100 : 0;
    e.ff = e.lit ? (90 + 540 * Math.pow(clamp01((e.n1 - 55) / 49), 1.35)) * (env.flight ? 0.8 : 1) : (flowing ? 110 : 0);
    // exceedance messages
    warnOnce(e, "itt1000", e.itt > 1000, `${S} ITT above 1,000 °C. That's the starting limit, and only 5 s is allowed. Abort: condition lever to FUEL CUTOFF.`, "bad");
    warnOnce(e, "itt820", e.lit && !e.startPhase && e.itt > 822, `${S} ITT above 820 °C maximum continuous. Reduce power: this is the ITT-limited case.`, "bad");
    warnOnce(e, "itt750", e.lit && !e.startPhase && e.n1 < 72 && e.itt > 750 && e.itt <= 822, `${S} ITT above the 750 °C idle limit. Reduce generator/A-C load, then raise N1 with the condition lever (HI IDLE).`, "warn");
    warnOnce(e, "tq", e.tq > 101, `${S} torque above 100%. Reduce the power lever: this is the torque-limited case.`, "bad");
    warnOnce(e, "np", e.np > 1712, `${S} propeller above 1,700 rpm.`, "bad");
    warnOnce(e, "oilp", e.lit && !e.startPhase && e.oilP < 60, `${S} oil pressure below 60 psi.`, "bad");
    warnOnce(e, "ground", env.flight && e.pl < PL_IDLE, `${S} power lever below flight idle in flight. Never do this.`, "bad");
    e.prevN1 = e.n1;
  });
  if (ppScript) ppRunScript();
  ppRender();
}

/* ---------- scripts (auto-demonstrations) ---------- */
function ppRunScript() {
  const s = ppScript;
  while (s.i < s.steps.length) {
    const st = s.steps[s.i];
    if (st.wait !== undefined) { if (PP.t - s.t0 < st.wait) return; }
    else if (st.until && !st.until(PP)) return;
    st.do(PP); if (st.msg) ppLog("Demo: " + st.msg); s.i++; s.t0 = PP.t;
  }
  ppScript = null;
}

/* ---------- scenarios ---------- */
function ppRun(e, cl) { e.lit = true; e.n1 = idleOf(Object.assign({}, e, { cl: cl === undefined ? e.cl : cl })); e.itt = 560; e.np = 1100; e.oilP = 100; e.oilT = 60; e.blade = 0.15; e.mode = "BETA"; }
const both = (P, f) => ["L", "R"].forEach(k => f(P.E[k], k));
const PP_SCEN = [
  { t: "Cold & dark", cap: "Both engines shut down, props feathered, condition levers at FUEL CUTOFF. Try a start yourself: prop levers to HIGH RPM, start switch ON, then condition lever to LOW IDLE (lift over the gate) once N1 passes 12%.", apply() {} },

  { t: "Demo: normal start (right engine)", cap: "Automatic demonstration of a normal start. The starter motors N1, fuel is introduced above 12% N1, then light-off, a controlled ITT peak, the secondary nozzles, and stabilization at low idle. Then the start switch goes OFF. Follow along in the event log and on the gas-path diagram.", apply(P) { both(P, e => { e.pr = 100; }); ppSide = "R"; },
    script: [{ wait: 1, do: P => { P.E.R.start = "ON"; }, msg: "right start switch ON (starter + ignition)." }, { until: P => P.E.R.n1 >= 13, do: P => { P.E.R.cl = CL_GATE; }, msg: "N1 above 12%: right condition lever to LOW IDLE." }, { until: P => !P.E.R.startPhase && P.E.R.lit, do: P => { P.E.R.start = "OFF"; }, msg: "stabilized: right start switch OFF." }] },
  { t: "Demo: hot start", cap: "Fuel is introduced too early, at about 6% N1, with too little airflow. ITT shoots past the 1,000 °C starting limit, and the demo aborts the start by pulling the condition lever to FUEL CUTOFF. In the airplane that's an Area A/B/C exceedance on Figure 7-24.", apply(P) { both(P, e => { e.pr = 100; }); ppSide = "L"; },
    script: [{ wait: 1, do: P => { P.E.L.start = "ON"; }, msg: "left start switch ON." }, { until: P => P.E.L.n1 >= 8.5, do: P => { P.E.L.cl = CL_GATE; }, msg: "condition lever to LOW IDLE far too early (≈8% N1)." }, { until: P => P.E.L.itt > 1000, do: P => { P.E.L.cl = 0; P.E.L.start = "OFF"; }, msg: "ITT past 1,000 °C: abort. Condition lever to FUEL CUTOFF, start switch OFF." }] },
  { t: "Low idle with generator and air-conditioning load", cap: "Both engines at LOW IDLE on a 30 °C day, with both generators loaded and the air conditioner running on the right engine. Right ITT rises past the 750 °C idle limit. Lift nothing: just push the condition levers toward HI IDLE (70%) and watch ITT come down as airflow increases.", apply(P) { P.env.oat = 30; P.env.ac = true; both(P, e => { e.pr = 100; e.cl = CL_GATE; ppRun(e); }); } },
  { t: "Taxi in ground fine", cap: "Power levers lifted over the IDLE gate into GROUND FINE. N1 stays at idle and the power lever now sets blade angle through the beta valve, which is how taxi speed is controlled. PROP PITCH shows the blades below the flight-idle stop.", apply(P) { both(P, e => { e.pr = 100; e.cl = 100; ppRun(e, 100); e.pl = 19; }); } },
  { t: "Takeoff, ISA (15 °C): torque-limited", cap: "Full power on a standard day. Torque passes 100% before ITT reaches 820 °C, so this case is torque-limited. Bring the power levers back until torque reads 100%. Np is held at 1,700 by the CSU (alpha).", apply(P) { both(P, e => { e.pr = 100; e.cl = 100; ppRun(e, 100); e.pl = 100; }); } },
  { t: "Takeoff, hot day (40 °C): ITT-limited", cap: "Same full power at 40 °C. Thinner air means less torque, but ITT passes 820 °C first, so this case is ITT-limited. Reduce power until ITT is within limits. Whichever limit you meet first sets the power available.", apply(P) { P.env.oat = 40; both(P, e => { e.pr = 100; e.cl = 100; ppRun(e, 100); e.pl = 100; }); } },
  { t: "Cruise, 1,500 rpm (in flight)", cap: "In flight at altitude, with props pulled back to 1,500 rpm. In alpha the prop lever sets Np and the power lever sets N1. Move the prop levers and torque changes opposite to Np while N1 stays put, because it's a free turbine. Move the power levers and torque follows N1 with Np constant.", apply(P) { P.env.flight = true; P.env.oat = -20; both(P, e => { e.pr = 12 + 50 / 250 * 88; e.cl = CL_GATE; ppRun(e); e.n1 = 90; e.np = 1500; e.pl = 80; e.itt = 700; }); } },

    script: [{ wait: 2.5, do: P => both(P, e => { e.cl = 0; }), msg: "both condition levers to FUEL CUTOFF." }] }

function ppApply(i) {
  ppScen = Math.max(0, Math.min(PP_SCEN.length - 1, i));
  const sc = PP_SCEN[ppScen];
  PP = ppFresh(); ppLogArr = [];
  sc.apply(PP);
  ppScript = sc.script ? { steps: sc.script, i: 0, t0: 0 } : null;
  ppLog(`Loaded: ${sc.t}.`);
  $("#ppScenSel").value = String(ppScen);
  $("#ppScenCap").textContent = sc.cap;
  $$("[data-eng]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.eng === ppSide)));
  ppSyncControls();
  ppStep(0.01);
}

/* ---------- pedestal & controls ---------- */
const LEVERS = [
  { g: "pwr", name: "Power", cls: "pwr", marks: [[100, "Takeoff"], [62, "Cruise"], [PL_IDLE, "Idle", 1], [19, "Gnd fine"], [PL_GF, "", 1], [5, "Reverse"]], gates: [PL_IDLE, PL_GF] },
  { g: "prp", name: "Propeller", cls: "prp", marks: [[100, "High rpm 1700"], [56, "1575"], [12, "Low 1450"], [5, "Feather"]], stripe: [0, PR_FTH] },
  { g: "cnd", name: "Condition", cls: "cnd", marks: [[100, "Hi idle 70%"], [CL_GATE, "Low idle 62%", 1], [3, "Fuel cutoff"]], gates: [CL_GATE] }
];
const LKEY = { pwr: "pl", prp: "pr", cnd: "cl" };
function ppHint(msg) { const h = $("#ppHint"); if (h) h.textContent = msg; }

function ppLeverInput(g, k, v) {
  const key = LKEY[g], e = PP.E[k], prev = e[key];
  if (g === "pwr") {
    if (PP.env.flight && v < PL_IDLE) { v = PL_IDLE; ppHint("In flight the power levers stay at or above flight idle. Ground fine and reverse are for the ground only."); }
    else if (prev >= PL_IDLE && v < PL_IDLE && !PP.lift.pwr) { v = PL_IDLE; ppHint("Lift the power levers to move them over the IDLE gate into GROUND FINE."); }
    else if (prev >= PL_GF && v < PL_GF && !PP.lift.pwr) { v = Math.max(v, PL_GF); ppHint("Lift again to pass the GROUND FINE gate into REVERSE."); }
  }
  if (g === "cnd" && prev >= CL_GATE && v < CL_GATE && !PP.lift.cnd) { v = CL_GATE; ppHint("Lift the condition levers over the gate to reach FUEL CUTOFF."); }
  e[key] = v;
  if (PP.together) { const o = PP.E[OTHER[k]]; if (!(g === "cnd" && o.cl < CL_GATE && v >= CL_GATE && !o.lit && o.n1 < 1)) o[key] = v; }
  ppSyncControls();
}

function ppSyncControls() {
  ["pwr", "prp", "cnd"].forEach(g => ["L", "R"].forEach(k => { const el = $(`#lv-${g}-${k}`); if (el && +el.value !== PP.E[k][LKEY[g]]) el.value = PP.E[k][LKEY[g]]; }));
  ["pwr", "cnd"].forEach(g => { const b = $("#lift-" + g); if (b) b.setAttribute("aria-pressed", String(PP.lift[g])); });
  const t = $("#together"); if (t) t.checked = PP.together;
  $$("#ppSwitches button[data-ps]").forEach(b => {
    const [f, k] = b.dataset.ps.split(":"); const e = PP.E[k];
    const val = f === "start" ? e.start : e.autoIgn ? "ARM" : "OFF";
    b.setAttribute("aria-pressed", String(val === b.dataset.val));
  });
  const env = PP.env;
  $$("#envRow [data-env]").forEach(b => {
    const f = b.dataset.env;
    const on = f === "flight" ? env.flight : f === "ground" ? !env.flight : f === "ac" ? env.ac : env.gen[f.slice(-1)];
    b.setAttribute("aria-pressed", String(on));
  });
  const o = $("#oat"); if (o && +o.value !== env.oat) o.value = env.oat;
  const ov = $("#oatV"); if (ov) ov.textContent = env.oat + " °C";
  $$("#ppFaults [data-pf]").forEach(b => { const [t, k] = b.dataset.pf.split(":"); b.setAttribute("aria-pressed", String(PP.fault[t][k])); });
}

const QSET = [
  ["Start config", P => both(P, e => { e.pl = PL_IDLE; e.pr = 100; if (!e.lit) e.cl = 0; })],

  ["Cruise 1,500 rpm", P => both(P, e => { e.pl = 80; e.pr = 12 + 50 / 250 * 88; })],

    <div class="tog"><div class="name">Auto ign</div><div class="pos">${[["ARM", "ARM"], ["OFF", "OFF"]].map(p => `<button type="button" id="ps-ai-${k}-${p[0]}" data-ps="ai:${k}" data-val="${p[0]}" aria-pressed="false">${p[1]}</button>`).join("")}</div></div></div></div>`).join("");
  $("#ppSwitches").addEventListener("click", e => {

    const [f, k] = b.dataset.ps.split(":"), e2 = PP.E[k];
    if (f === "start") { e2.start = b.dataset.val; if (e2.start === "STARTER") e2.starterHold = 10; ppLog(`${SIDE[k]} IGNITION AND ENGINE START: ${b.textContent}.`); }

function engGaugeSVG(g, id) {
  const A = v => -135 + 270 * (Math.max(g.min, Math.min(g.max, v)) - g.min) / (g.max - g.min);
  const P = (a, r) => [60 + r * Math.sin(a * Math.PI / 180), 60 - r * Math.cos(a * Math.PI / 180)];
  const arc = (a1, a2, r, col, w) => { const p1 = P(a1, r), p2 = P(a2, r); return `<path d="M${p1[0].toFixed(1)},${p1[1].toFixed(1)} A${r},${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}"/>`; };
  const radial = (v, col, w) => { const a = A(v), p1 = P(a, 52), p2 = P(a, 40); return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${col}" stroke-width="${w}"/>`; };
  let s = `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" fill="#141618" stroke="#5b636b" stroke-width="2"/>`;
  for (let i = 0; i <= 20; i++) { const a = -135 + 270 * i / 20, p1 = P(a, 52), p2 = P(a, i % 5 ? 48 : 45); s += `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#cfd5da" stroke-width="1"/>`; }
  if (g.green) s += arc(A(g.green[0]), A(g.green[1]), 49, "#3cbf5c", 4);
  (g.yellow || []).forEach(y => s += arc(A(y[0]), A(y[1]), 49, "#f2c21c", 4));
  (g.red || []).forEach(r => s += radial(r, "#e5483a", 3));
  if (g.white) s += radial(g.white, "#ffffff", 3);
  g.labels.forEach(([v, t]) => { const p = P(A(v), 33); s += `<text x="${p[0].toFixed(1)}" y="${(p[1] + 3).toFixed(1)}" font-size="9" text-anchor="middle">${t}</text>`; });
  s += `<text x="60" y="86" font-size="8" text-anchor="middle" fill="#9aa3ab">${g.unit}</text><line id="${id}N" x1="60" y1="60" x2="60" y2="14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" style="transform-origin:60px 60px;transition:transform .12s linear"/><circle cx="60" cy="60" r="5" fill="#cfd5da"/></svg>`;
  return s;
}

const PCOMP = {};
function pc(id, group, name, desc, state) { PCOMP[id] = { group, name, desc, state }; }
pc("prop", "Propeller", "Four-blade propeller", "Full-feathering, reversing, constant-speed propeller on the reduction gearbox output shaft. Feathering springs and counterweights drive the blades toward high pitch and feather. Governor oil on the servo piston, aided by centrifugal twisting moment, drives them toward low pitch and reverse. Lose the oil and it feathers. It feathers automatically at shutdown and unfeathers as the engine starts.", e => `${Math.round(e.np)} rpm · ${e.mode.toLowerCase()}`);
pc("rgb", "Power section", "Reduction gearbox", "Two-stage planetary gearbox that turns the power turbine's high speed and low torque into propeller speed: 17.6:1 (29,920 rpm Nf → 1,700 rpm Np). The torquemeter sits in the first stage and the chip detector at the bottom of the nose case.", e => `Torque ${e.tq.toFixed(0)}%`);
pc("pgov", "Propeller control", "Propeller governor (CSU + fuel topping governor)", "Driven by the reduction gearbox. Flyweights against a speeder spring set by the prop lever meter oil from a built-in booster pump, up to about 400 psi, to the servo piston through the transfer sleeve. Onspeed holds oil, underspeed adds oil (lower pitch), and overspeed drains it (higher pitch). It also contains the beta valve and the fuel topping (Nf) governor, which cuts FCU fuel through a Py bleed if Np runs above the selected speed, and is reset below the selected speed in beta and reverse.", e => e.ctl);
pc("osgov", "Propeller control", "Hydraulic overspeed governor", "A separate, non-adjustable governor on its own drive pad, set above the CSU (typically around 104–106% Np). If the CSU and topping governor fail to hold Np, it dumps propeller oil to raise pitch. A ground TEST switch resets it below normal speed so its operation can be checked.", () => "Standby (no overspeed)");
pc("exh", "Power section", "Exhaust duct & twin exhaust stubs", "Gas leaving the power turbines exits through an annular plenum and two opposed exhaust ports at the front of the engine. Residual jet thrust is about 10% of total power (158 lb at takeoff).", e => e.lit ? "Hot exhaust" : "Cold");
pc("pt", "Power section", "Power turbine (2 stages)", "Drives the propeller shaft through the reduction gearbox. It has no mechanical link to the gas generator: a free turbine. It extracts the roughly 40% of gas energy left after the compressor turbine.", e => `Np ${Math.round(e.np)} rpm`);
pc("ct", "Gas generator", "Compressor turbine (1 stage)", "Single-stage turbine that drives the compressor and accessory gearbox (N1). It extracts about 60% of the energy in the combustion gas and turns opposite to the power turbine.", e => `N1 ${e.n1.toFixed(1)}%`);
pc("itt", "Gas generator", "ITT (T5) probes", "Thermocouples between the compressor turbine and first power turbine stage. ITT is the main temperature limit: 400–820 °C normal, 820 °C maximum continuous, 750 °C at idle, 1,000 °C for starting only (5 s). The gauge is self-powered.", e => `${Math.round(e.itt)} °C`);
pc("comb", "Gas generator", "Annular combustion chamber", "Air turns 180° to enter the liner. About 25% burns with fuel, and 75% centers the flame and cools. Hot gas reverses again in the exit duct toward the turbines. The folded design does away with a long shaft.", e => e.lit ? "Burning" : "No combustion");

pc("ign", "Gas generator", "Spark igniters (2)", "Two igniters in the liner, fed by a 28 V exciter producing up to 3,500 V. One is enough to start. Powered by the start switch at ON, or by auto-ignition when armed and torque is below about 17%.", e => e.ign ? "SPARKING" : "Off");

function ppSvg() {
  const T = (x, y, s, cls, anchor) => `<text x="${x}" y="${y}" class="${cls || "lbl"}" text-anchor="${anchor || "middle"}">${s}</text>`;
  const comp = (id, inner, hit) => `<g class="comp" data-pcomp="${id}" tabindex="0" role="button" aria-label="${esc(PCOMP[id].name)}"><rect class="hit" x="${hit[0]}" y="${hit[1]}" width="${hit[2]}" height="${hit[3]}" rx="4"/>${inner}</g>`;
  const box = (id, x, y, w, h, t, sub) => comp(id, `<rect class="blk" data-blk="${id}" x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/>${T(x + w / 2, y + (sub ? h / 2 - 2 : h / 2 + 4), t, "blk-t")}${sub ? T(x + w / 2, y + h / 2 + 12, sub, "blk-s") : ""}`, [x - 3, y - 3, w + 6, h + 6]);
  const ln = (key, pts, c, dash) => `<polyline class="ln c-${c}" data-ln="${key}" points="${pts.map(p => p.join(",")).join(" ")}"${dash ? ' stroke-dasharray="4 4"' : ""}/>`;

  // ----- gas path -----
  let g = "";
  g += `<rect class="casing" x="100" y="150" width="115" height="130" rx="14"/><rect class="casing" x="215" y="122" width="115" height="186"/><rect class="casing" x="245" y="70" width="40" height="52"/><rect class="casing" x="245" y="308" width="40" height="52"/>
    <rect class="casing" x="330" y="125" width="110" height="180"/><rect class="casing" x="440" y="100" width="140" height="230" rx="6"/><rect class="casing" x="580" y="135" width="210" height="160"/><rect class="casing" x="790" y="105" width="60" height="220"/><rect class="casing" x="850" y="150" width="115" height="130" rx="8"/>`;
  g += `<line class="shaft-np" x1="80" y1="215" x2="360" y2="215"/><line class="shaft-n1" x1="402" y1="215" x2="860" y2="215"/>`;
  g += `<rect class="sym" x="458" y="128" width="104" height="32" rx="12"/><rect class="sym" x="458" y="270" width="104" height="32" rx="12"/>`;
  // flows
  g += `<polyline class="gas cold" data-gas="cold" points="820,78 820,182 662,182 636,152 612,120 580,113 452,113 444,128 456,144"/>`;
  g += `<polyline class="gas hot" data-gas="hot" points="462,144 548,144 566,160 548,180 420,182 330,182 290,172 265,140 265,62"/>`;
  g += comp("inlet", `<line x1="800" y1="110" x2="800" y2="320" stroke="var(--sym)" stroke-dasharray="3 3"/><line x1="812" y1="110" x2="812" y2="320" stroke="var(--sym)" stroke-dasharray="3 3"/>${T(820, 345, "AIR INLET (REAR)", "lbl")}`, [790, 100, 62, 255]);
  g += comp("comp", [700, 730, 760].map(x => `<rect class="disc cmp" x="${x - 5}" y="163" width="10" height="104" rx="2"/>`).join("") + `<path class="disc cmp" d="M620,155 L660,170 L660,260 L620,275 Z"/>${T(700, 310, "COMPRESSOR · 3 AXIAL + CENTRIFUGAL", "lbl")}`, [612, 150, 158, 168]);
  g += comp("bleed", `<rect class="bleedv" data-bleed="1" x="676" y="124" width="26" height="12" rx="2"/>${T(689, 118, "BLEED VALVE", "lbl")}`, [660, 106, 58, 32]);
  g += comp("comb", `${T(510, 92, "COMBUSTION CHAMBER", "lbl")}`, [450, 78, 120, 90]);
  g += comp("noz", `<path class="sym-solid" d="M548,136 L558,144 L548,152 Z"/>${T(540, 172, "", "lbl")}`, [542, 132, 20, 24]);
  g += comp("ign", `<circle class="spark" data-spark="1" cx="500" cy="129" r="6"/><circle class="sym" cx="500" cy="122" r="3"/>${T(498, 196, "", "lbl")}`, [490, 112, 22, 24]);
  g += comp("ct", `<rect class="disc trb" x="405" y="152" width="12" height="126" rx="2"/>${T(411, 296, "CT", "lbl-b")}`, [398, 148, 26, 160]);
  g += comp("pt", `<rect class="disc trb" x="342" y="150" width="12" height="130" rx="2"/><rect class="disc trb" x="366" y="150" width="12" height="130" rx="2"/>${T(360, 296, "PT", "lbl-b")}`, [336, 146, 48, 162]);
  g += comp("itt", `<line x1="392" y1="125" x2="392" y2="178" stroke="var(--fault)" stroke-width="2.5"/><circle cx="392" cy="178" r="3" fill="var(--fault)"/>${T(392, 116, "ITT (T5)", "stn")}`, [374, 104, 36, 80]);
  g += comp("exh", `${T(265, 54, "EXHAUST", "lbl")}`, [240, 40, 50, 84]);
  g += comp("rgb", `${T(157, 245, "REDUCTION", "lbl")}${T(157, 258, "GEARBOX 17.6:1", "lbl")}<circle class="sym" cx="140" cy="200" r="12"/><circle class="sym" cx="175" cy="200" r="12"/>`, [100, 150, 115, 130]);
  g += comp("pgov", `<rect class="blk" x="118" y="112" width="80" height="34" rx="4"/>${T(158, 127, "PROP GOV", "blk-t")}${T(158, 140, "CSU · β · Nf", "blk-s")}`, [114, 108, 88, 42]);
  g += comp("osgov", `<rect class="blk" x="118" y="284" width="80" height="30" rx="4"/>${T(158, 303, "O/S GOV", "blk-t")}`, [114, 280, 88, 38]);
  g += comp("agb", `${["STARTER/GEN", "HP PUMP · FCU", "N1 TACH GEN", "OIL PUMPS"].map((t, i) => T(907, 176 + i * 28, t, "lbl")).join("")}`, [850, 150, 115, 130]);
  g += comp("prop", `<circle class="sym" cx="70" cy="215" r="22"/><ellipse id="gasBladeT" cx="70" cy="140" rx="10" ry="58" fill="var(--sym-fill)" stroke="var(--sym)" stroke-width="1.6"/><ellipse id="gasBladeB" cx="70" cy="290" rx="10" ry="58" fill="var(--sym-fill)" stroke="var(--sym)" stroke-width="1.6"/>`, [20, 76, 100, 280]);
  g += `<text class="stn" x="686" y="160" text-anchor="middle">P2.5</text><text class="stn" x="600" y="104" text-anchor="middle">P3</text>`;
  g += `<text class="n1t" id="gasN1" x="700" y="390" text-anchor="middle"></text><text class="n1t" id="gasNp" x="200" y="390" text-anchor="middle"></text><text class="n1t" id="gasITT" x="410" y="390" text-anchor="middle"></text>`;
  g += T(500, 420, "FRONT ◄  gas flows forward through the engine  ◄  REAR", "lbl");
  $("#pp-gas").innerHTML = g;

  // ----- control system -----
  let c = "";
  c += ln("pl-cam", [[165, 84], [165, 130]], "pwr") + ln("cam-fcu", [[135, 174], [135, 240]], "pwr") + ln("cam-beta", [[200, 174], [200, 205], [405, 205], [405, 240]], "pwr");
  c += ln("fcu-n1", [[165, 300], [165, 352]], "fuel") + ln("cl-fcu", [[865, 40], [865, 16], [30, 16], [30, 270], [60, 270]], "cnd") + ln("cl-cut", [[880, 84], [880, 140]], "cnd");
  c += ln("prl-csu", [[500, 84], [500, 140]], "prp") + ln("prl-fth", [[575, 62], [712, 62], [712, 322], [720, 322]], "prp");
  c += ln("pump-beta", [[405, 330], [405, 290]], "oil") + ln("beta-csu", [[480, 255], [505, 255], [505, 165], [520, 165]], "oil") + ln("csu-servo", [[690, 175], [700, 175], [700, 385], [690, 385]], "oil");
  c += ln("fth-dump", [[850, 344], [850, 398], [690, 398]], "prp") + ln("top-fcu", [[560, 269], [560, 312], [240, 312], [240, 300]], "air") + ln("servo-beta", [[520, 398], [510, 398], [510, 298], [445, 298], [445, 290]], "oil", true) + ln("cut-noz", [[950, 162], [975, 162], [975, 418], [165, 418], [165, 400]], "fuel");
  c += box("plever", 90, 40, 150, 44, "POWER LEVER") + box("prlever", 425, 40, 150, 44, "PROPELLER LEVER") + box("clever", 780, 40, 170, 44, "CONDITION LEVER");
  c += box("cambox", 90, 130, 150, 44, "CAMBOX") + box("fcu", 60, 240, 210, 60, "FCU · N1 GOVERNOR", "3D cam · flyweights · P3 bellows");
  c += box("unload", 780, 140, 170, 44, "CUTOFF / UNLOADING") + box("beta", 330, 240, 150, 50, "BETA VALVE", "Teleflex · walking beam");
  c += box("pgov", 520, 140, 170, 50, "PROP GOVERNOR (CSU)", "flyweights · speeder spring") + box("topping", 520, 225, 170, 44, "FUEL TOPPING (Nf) GOV");
  c += box("feath", 720, 300, 200, 44, "FEATHERING VALVE") + box("osgov", 720, 230, 200, 44, "OVERSPEED GOVERNOR");
  c += box("govpump", 330, 330, 150, 50, "GOV OIL BOOST PUMP", "engine oil in") + box("servo", 520, 360, 170, 50, "SERVO PISTON & BLADES", "springs + counterweights") + box("noz", 60, 352, 210, 48, "GAS GENERATOR · NOZZLES");
  c += `<text class="n1t" id="ctlStatus" x="500" y="436" text-anchor="middle"></text>`;
  $("#pp-ctl").innerHTML = c;

  // ----- engine fuel -----
  let f = "";
  f += `<rect x="400" y="62" width="420" height="190" rx="8" fill="none" stroke="var(--muted)" stroke-dasharray="6 5"/>` + T(610, 56, "FUEL CONTROL UNIT", "lbl-b");
  f += ln("f-boost", [[105, 330], [105, 290]], "fuel") + ln("f-filt", [[105, 240], [105, 190]], "fuel") + ln("f-hx", [[170, 165], [220, 165]], "fuel") + ln("f-hpp", [[350, 170], [430, 170]], "fuel");
  f += ln("f-fv", [[580, 170], [630, 170]], "fuel") + ln("f-unl", [[780, 167], [850, 167]], "fuel") + ln("f-byp", [[705, 194], [705, 232], [300, 232], [300, 190]], "fuel");
  f += ln("f-mpv", [[915, 190], [915, 240]], "fuel") + ln("f-ffx", [[915, 284], [915, 330]], "fuel") + ln("f-pri", [[850, 345], [810, 345]], "fuel") + ln("f-sec", [[850, 370], [810, 370]], "fuel");
  f += ln("f-purgeline", [[285, 140], [285, 28], [70, 28]], "fuel") + ln("f-p3", [[500, 290], [500, 330]], "air") + ln("f-purge", [[580, 370], [600, 405], [915, 405], [915, 380]], "air");
  f += box("boost", 40, 330, 130, 50, "BOOST PUMP", "engine-driven") + box("filt", 40, 240, 130, 50, "FIREWALL FILTER", "pressure switch") + box("hx", 40, 140, 130, 50, "OIL-TO-FUEL HX");
  f += box("hpp", 220, 140, 130, 50, "HP FUEL PUMP", "≤ 1,050 psi") + box("fcu", 430, 140, 150, 60, "FUEL VALVE · 3D CAM", "N1 governor · P3 bellows") + box("unload", 630, 145, 150, 44, "PUMP UNLOADING", "condition lever");
  f += box("mpv", 850, 140, 130, 50, "MIN PRESS VALVE", "opens ≈100 psi") + box("ffx", 850, 240, 130, 44, "FLOW TRANSMITTER") + box("fdiv", 850, 330, 130, 50, "FLOW DIVIDER");
  f += box("noz", 620, 330, 190, 60, "14 NOZZLES", "primary · secondary") + box("purge", 420, 330, 160, 50, "P3 PURGE TANK");
  f += T(70, 20, "TO GRAVITY-FEED LINE (purge)", "lbl", "start") + T(505, 286, "P3 AIR", "stn") + T(640, 245, "bypass (fuel cut off)", "lbl") + `<text class="n1t" id="fuelStatus" x="200" y="420" text-anchor="middle"></text>`;
  $("#pp-fuel").innerHTML = f;

  // ----- lubrication -----
  let o = "";
  o += ln("o-feed", [[800, 205], [760, 205]], "oil") + ln("o-sens", [[690, 180], [690, 130]], "oil") + ln("o-brg", [[620, 205], [540, 205]], "oil") + ln("o-nose", [[380, 205], [320, 205]], "oil");
  o += ln("o-tqm", [[235, 180], [235, 130]], "oil") + ln("o-prop", [[150, 200], [118, 200], [118, 42], [130, 42]], "hot") + ln("o-chip", [[235, 230], [235, 250]], "scav");
  o += ln("o-scav1", [[460, 230], [460, 320]], "scav") + ln("o-scav2", [[235, 290], [235, 345], [380, 345]], "scav") + ln("o-cool", [[540, 345], [620, 345]], "scav") + ln("o-hx", [[760, 345], [800, 345]], "scav") + ln("o-ret", [[875, 320], [875, 240]], "scav");
  o += box("otank", 800, 170, 150, 70, "OIL TANK 2.5 gal", "in compressor inlet case") + box("opump", 620, 180, 140, 50, "PRESSURE PUMP", "regulator · filter") + box("osens", 620, 90, 140, 40, "PRESS / TEMP BULBS");
  o += box("brg", 380, 180, 160, 50, "BEARINGS", "gas generator · turbines") + box("nose", 150, 180, 170, 50, "NOSE CASE", "reduction gear") + box("tqm", 150, 90, 170, 40, "TORQUEMETER");
  o += box("propoil", 130, 20, 210, 44, "PROP GOVERNOR → PROP", "boosted supply oil") + box("chip", 150, 250, 170, 40, "CHIP DETECTOR");
  o += box("scav", 380, 320, 160, 50, "SCAVENGE PUMPS") + box("cool", 620, 320, 140, 50, "OIL COOLER", "thermostatic") + box("ohx", 800, 320, 150, 50, "OIL-TO-FUEL HEATER");
  o += `<text class="n1t" id="lubeStatus" x="500" y="420" text-anchor="middle"></text>`;
  $("#pp-lube").innerHTML = o;
}

const PP_LEGEND = {
  gas: [["#3a8be0", "Compressor air (cold)"], ["#ee5a24", "Combustion gas (hot)"], ["#3a8be0", "N1 shaft"], ["#d24a35", "Power turbine / prop shaft"]],
  ctl: [["#2fb062", "Power lever path"], ["#d14bd1", "Propeller lever path"], ["#3a6fd8", "Condition lever path"], ["#c08a1e", "Governor oil"], ["#e8607a", "Py air (topping)"], ["#2a8ad8", "Fuel"]],
  fuel: [["#2a8ad8", "Fuel"], ["#e8607a", "P3 air (purge)"]],
  lube: [["#c08a1e", "Pressure oil"], ["#ee7d1f", "Propeller supply oil"], ["#23904e", "Scavenge oil"]]
};
function ppRenderDiagram() {
  const e = PP.E[ppSide], F = PP.fault, k = ppSide;
  const set = (svg, map) => $$(`#${svg} [data-ln]`).forEach(l => l.classList.toggle("on", !!map[l.dataset.ln]));
  const blk = (svg, ids) => $$(`#${svg} [data-blk]`).forEach(b => b.classList.toggle("on", ids.includes(b.dataset.blk)));
  if (ppTab === "gas") {
    const run = e.n1 > 1;
    $$("#pp-gas [data-gas]").forEach(p => { const on = p.dataset.gas === "cold" ? run : e.lit; p.classList.toggle("on", on); p.style.animationDuration = Math.max(0.35, 2.4 - e.n1 / 50) + "s"; });
    $('#pp-gas [data-bleed]').classList.toggle("open", !!e.bleedOpen && run);
    $('#pp-gas [data-spark]').classList.toggle("on", !!e.ign);
    const rx = Math.max(3, Math.abs(Math.cos(e.blade * Math.PI / 2)) * 16);
    $("#gasBladeT").setAttribute("rx", rx.toFixed(1)); $("#gasBladeB").setAttribute("rx", rx.toFixed(1));
    $("#gasN1").textContent = `N1 ${e.n1.toFixed(1)}% · bleed ${e.bleedOpen ? "open" : "closed"}`;
    $("#gasNp").textContent = `Np ${Math.round(e.np)} rpm · ${e.mode}`;
    $("#gasITT").textContent = `ITT ${Math.round(e.itt)} °C`;
  } else if (ppTab === "ctl") {
    const beta = ["BETA", "GROUND FINE", "REVERSE"].includes(e.mode), alpha = e.mode === "ALPHA";
    set("pp-ctl", { "pl-cam": e.lit, "cam-fcu": e.lit, "cam-beta": e.lit && beta, "fcu-n1": e.lit || e.ff > 0, "cl-fcu": e.lit, "cl-cut": e.cl < CL_GATE,
      "prl-csu": e.lit && (alpha || e.mode === "CSU FAILED"), "prl-fth": e.pr < PR_FTH, "pump-beta": e.lit && e.mode !== "FEATHERED", "beta-csu": e.lit && e.mode !== "FEATHERED", "csu-servo": e.lit && e.mode !== "FEATHERED",
      "fth-dump": e.pr < PR_FTH && e.lit, "top-fcu": e.topping, "servo-beta": e.lit && beta, "cut-noz": e.lit });
    const on = [];
    if (e.lit) on.push("fcu"); if (alpha) on.push("pgov"); if (beta) on.push("beta"); if (e.topping) on.push("topping"); if (e.pr < PR_FTH) on.push("feath"); if (e.cl < CL_GATE) on.push("unload");
    blk("pp-ctl", on);
    $("#ctlStatus").textContent = `${SIDE[k].toUpperCase()} ENGINE · ${e.mode} · ${alpha ? "CSU governs Np" : beta ? "beta valve sets blade angle" : e.mode === "FEATHERED" ? "feathering valve / no oil" : e.topping ? "topping governor limiting" : "—"}`;
  } else if (ppTab === "fuel") {
    const turning = e.n1 > 5, fuelTo = e.ff > 0;
    set("pp-fuel", { "f-boost": turning && !F.boost[k], "f-filt": turning, "f-hx": turning, "f-hpp": turning && !F.hp[k], "f-fv": turning && !F.hp[k], "f-unl": fuelTo, "f-byp": turning && e.cl < CL_GATE,
      "f-mpv": fuelTo, "f-ffx": fuelTo, "f-pri": fuelTo, "f-sec": fuelTo && e.n1 >= 37, "f-purgeline": turning && !F.hp[k], "f-p3": e.lit, "f-purge": e.purgeT > 0 });
    blk("pp-fuel", [F.boost[k] ? "boost" : "", F.hp[k] ? "hpp" : "", e.purgeT > 0 ? "purge" : "", e.cl < CL_GATE ? "unload" : ""]);
    $("#fuelStatus").textContent = `${SIDE[k]} · FF ${Math.round(e.ff)} pph · ${e.cl < CL_GATE ? "FUEL CUTOFF" : "fuel ON"}${e.purgeT > 0 ? " · PURGING" : ""}`;
  } else {
    const run = e.n1 > 3;
    set("pp-lube", { "o-feed": run, "o-sens": run, "o-brg": run, "o-nose": run, "o-tqm": run, "o-prop": e.lit && e.mode !== "FEATHERED", "o-chip": run, "o-scav1": run, "o-scav2": run, "o-cool": run, "o-hx": run, "o-ret": run });
    blk("pp-lube", F.chip[k] ? ["chip"] : []);
    $("#lubeStatus").textContent = `${SIDE[k]} · oil ${Math.round(e.oilP)} psi · ${Math.round(e.oilT)} °C${F.chip[k] ? " · CHIP DETECT" : ""}`;
  }
}

function ppSelect(id) {
  ppSel = id;
  $$("#ppSvgs .comp").forEach(g => g.classList.toggle("sel", g.dataset.pcomp === id));
  const c = PCOMP[id];
  $("#ppInfo").innerHTML = `<div class="eyebrow">${esc(c.group)}</div><h4>${esc(c.name)}</h4><div class="now" id="ppInfoNow">Now: ${esc(c.state ? c.state(PP.E[ppSide]) : "")}</div><p>${esc(c.desc)}</p>`;
}
function ppShowTab(t) {
  ppTab = t;
  ["gas", "ctl", "fuel", "lube"].forEach(x => { $("#pp-" + x).toggleAttribute("hidden", x !== t); $("#ppt-" + x).setAttribute("aria-pressed", String(x === t)); });
  $("#ppLegend").innerHTML = PP_LEGEND[t].map(l => `<span><i style="background:${l[0]}"></i>${l[1]}</span>`).join("");
  ppRenderDiagram();
}

function initPowerplant() {
  PP = ppFresh(); ppSide = "L"; ppTab = "gas"; ppSel = null;
  $("#ppSubnav").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) document.getElementById(b.dataset.go).scrollIntoView({ behavior: "smooth", block: "start" }); });
  buildPedestal(); buildInstruments(); ppSvg();
  $("#ppScenSel").innerHTML = PP_SCEN.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.t)}</option>`).join("");
  $("#ppScenSel").addEventListener("change", e => ppApply(+e.target.value));
  $("#ppPrev").addEventListener("click", () => ppApply(ppScen - 1));
  $("#ppNext").addEventListener("click", () => ppApply(ppScen + 1));
  $("#ppTabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) ppShowTab(b.dataset.tab); });
  $$("[data-eng]").forEach(b => b.addEventListener("click", () => { ppSide = b.dataset.eng; $$("[data-eng]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); ppRender(); }));
  const sv = $("#ppSvgs");
  sv.addEventListener("click", e => { const g = e.target.closest(".comp"); if (g) ppSelect(g.dataset.pcomp); });
  sv.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".comp")) { e.preventDefault(); ppSelect(e.target.closest(".comp").dataset.pcomp); } });
  ppShowTab("gas");
  ppApply(1);
  $("#ppInfo").innerHTML = `<h3>Component details</h3><p>Select any part of a diagram (turbines, governors, valves, pumps) to see what it does and its live state for the engine shown.</p>`;
  ppTimer = setInterval(() => ppStep(0.1), 100);
}

/* ================= boot ================= */
buildToc();
$("#menuBtn").addEventListener("click", () => { const o = $("#rail").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); });
window.addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
