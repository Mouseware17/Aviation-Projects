<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King Air 200 Manual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive Super King Air 200/B200 systems manual, checklist, walkaround and annunciator trainer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="bar">
  <button class="tool menu-btn" id="menuBtn" aria-label="Open contents" aria-expanded="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
  <a class="brand" href="#manual">King Air 200 <small>B200 systems and checklist</small></a>
  <nav class="tabs" aria-label="Sections">
    <a class="tab" href="#manual" data-mode="manual">Manual</a>
    <a class="tab" href="#checklist" data-mode="checklist">Checklist</a>
    <a class="tab" href="#walkaround" data-mode="walkaround">Walkaround</a>
    <a class="tab" href="#annunciators" data-mode="annunciators">Annunciators</a>
  </nav>
  <div class="bar-tools">
    <button class="tool" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <span class="lbl">Search</span><kbd>/</kbd>
    </button>
    <a class="emer" href="#emergency">EMERGENCY</a>
  </div>
</header>
<div class="shell">
  <aside class="side" id="side" aria-label="Contents"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim"></div>

<dialog class="lb" id="lb" aria-label="Figure viewer">
  <div class="lb-top">
    <div class="lb-title" id="lbTitle"></div>
    <button class="lb-btn" id="lbPrev" aria-label="Previous figure">&#8249;</button>
    <button class="lb-btn" id="lbNext" aria-label="Next figure">&#8250;</button>
    <button class="lb-btn" id="lbOut" aria-label="Zoom out">&minus;</button>
    <button class="lb-btn" id="lbIn" aria-label="Zoom in">+</button>
    <button class="lb-btn" id="lbFit" aria-label="Fit to screen">Fit</button>
    <button class="lb-btn" id="lbClose" aria-label="Close">&times;</button>
  </div>
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-text" id="lbText"></div>
</dialog>

<dialog class="pal" id="pal" aria-label="Search">
  <div class="pal-in">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <label class="vh" for="palInput">Search the manual, checklist and annunciators</label>
    <input id="palInput" type="search" placeholder="Search systems, procedures, annunciators" autocomplete="off" spellcheck="false">
    <button class="btn small" id="palClose">Close</button>
  </div>
  <ul class="pal-res" id="palRes" role="listbox"></ul>
</dialog>

<script src="data/manual.js"></script>
<script src="data/checklist.js"></script>
<script src="data/annunciators.js"></script>
<script src="assets/sims.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
